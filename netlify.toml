# Plainly — Netlify configuration
# Static index.html + a single serverless function (claude.js) that proxies
# the Anthropic API. IEP analysis is two sequential calls to that same
# function from the browser — no background functions, no Blobs.

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Give functions the maximum synchronous timeout. The IEP extraction call
# (PDF + vision) is the slowest single request; this headroom keeps it from
# timing out. (Free tier max is 26s; paid plans allow more.)
[functions."claude"]
  timeout = 26

# Static download assets. Netlify already serves .pdf as application/pdf by
# content-type detection; this makes it explicit and stable for the hosted
# NYSED forms so they open/download reliably rather than being sniffed as
# something else. Inline so the browser can preview before saving.
[[headers]]
  for = "/forms/*.pdf"
  [headers.values]
    Content-Type = "application/pdf"
    Content-Disposition = "inline"
    Cache-Control = "public, max-age=3600"
