<html lang="en">
<head>
<meta charset="UTF-8" />

<title>Plainly — NY special education, in plain English</title>
<style>
  body, html { margin: 0; padding: 0; }
  /* While Babel transforms the JSX, hide the page until React renders */
  #root:empty + .boot-msg { display: block; }
  .boot-msg { display: none; padding: 60px 24px; text-align: center; font-family: Georgia, serif; color: #5A6580; }
  .boot-msg .pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #1F6F8B; margin: 0 4px; animation: pulse 1.4s ease-in-out infinite; }
  .boot-msg .pulse:nth-child(2) { animation-delay: 0.2s; }
  .boot-msg .pulse:nth-child(3) { animation-delay: 0.4s; }

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

// ============================================================================
// PLAINLY — SITE SHELL
// ============================================================================
// A demo of the broader site that wraps the chat tool. This is a single-file
// React app with simple hash-based routing. When porting to Next.js, each
// route below becomes its own page file.
//
// Routes:
//   #/         home
//   #/start    the chat tool (stub link in this file — full version is the
//              standalone artifact; in production this will be the live tool)
//   #/how      "How it works" — NY due process arc in plain language
//   #/who      "Is this for me?" — claim types with examples
//   #/faq      common questions
//   #/resources  links to NYSED, NYC IHO, mediation, primary sources
//   #/about    about, disclaimers
// ============================================================================

const STYLES = `
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Newsreader:ital,wght@0,300;0,400;0,500;1,400&display=swap');

:root {
  --bg: #F5E8D4;
  --surface: #FBF3E5;
  --surface-2: #EFDFC5;
  --ink: #1A2540;
  --ink-muted: #5A6580;
  --ink-soft: #8A8474;
  --accent: #1F6F8B;
  --accent-deep: #134E63;
  --accent-soft: #DCEAF0;
  --action: #D7522A;
  --action-deep: #B23C18;
  --action-soft: #FBE0D5;
  --warn: #B85C38;
  --warn-soft: #F2DDD0;
  --warn-deep: #8A4226;
  --border: #DBC9A8;
  --border-soft: #E8D8B8;
  --shadow: 0 1px 2px rgba(26,37,64,0.05), 0 4px 12px rgba(26,37,64,0.05);
  --shadow-lg: 0 4px 28px rgba(26,37,64,0.10);
}

* { box-sizing: border-box; }

body, html, #root {
  margin: 0;
  padding: 0;
  background: var(--bg);
  font-family: 'Newsreader', Georgia, serif;
  color: var(--ink);
  font-size: 17px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.app-root {
  min-height: 100vh;
  background-image:
    radial-gradient(circle at 15% 0%, rgba(31,111,139,0.07) 0%, transparent 38%),
    radial-gradient(circle at 85% 30%, rgba(215,82,42,0.07) 0%, transparent 38%);
}

/* ------- Header ------- */

.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--bg);
  border-bottom: 1px solid var(--border-soft);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.site-header-inner {
  max-width: 1080px;
  margin: 0 auto;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 32px;
}
.brand-link {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: inherit;
  flex-shrink: 0;
}
.brand-mark {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--accent);
  position: relative;
  flex-shrink: 0;
}
.brand-mark::after {
  content: '';
  position: absolute;
  inset: 5px;
  border: 1.5px solid var(--bg);
  border-radius: 50%;
}
.brand-name {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 21px;
  letter-spacing: -0.015em;
  color: var(--ink);
}
.brand-mark-tag {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-soft);
  margin-left: 4px;
  font-weight: 500;
}

.site-nav {
  display: flex;
  gap: 24px;
  align-items: center;
  flex: 1;
}
.site-nav a {
  color: var(--ink-muted);
  text-decoration: none;
  font-size: 15px;
  transition: color 0.15s ease;
}
.site-nav a:hover { color: var(--ink); }
.site-nav a.active { color: var(--accent); font-weight: 500; }

.header-cta {
  background: var(--action);
  color: white;
  padding: 8px 18px;
  border-radius: 6px;
  text-decoration: none;
  font-size: 14.5px;
  font-weight: 500;
  font-family: inherit;
  transition: background 0.15s ease;
  white-space: nowrap;
}
.header-cta:hover { background: var(--action-deep); }

@media (max-width: 720px) {
  .site-nav { display: none; }
  .site-header-inner { padding: 14px 18px; gap: 12px; }
}

/* ------- Page shell ------- */

.page {
  max-width: 720px;
  margin: 0 auto;
  padding: 56px 24px 80px;
}
.page-wide {
  max-width: 1000px;
  margin: 0 auto;
  padding: 56px 24px 80px;
}

@media (max-width: 720px) {
  .page, .page-wide { padding: 32px 18px 60px; }
}

/* ------- Type ------- */

h1.display {
  font-family: 'Fraunces', serif;
  font-weight: 400;
  font-size: 52px;
  line-height: 1.05;
  letter-spacing: -0.025em;
  color: var(--ink);
  margin: 0 0 20px;
}
h1.display em { font-style: italic; font-weight: 300; color: var(--action); }

@media (max-width: 720px) {
  h1.display { font-size: 38px; }
}

h2.section {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 32px;
  line-height: 1.15;
  letter-spacing: -0.015em;
  color: var(--ink);
  margin: 56px 0 16px;
}

h3.sub {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 20px;
  letter-spacing: -0.005em;
  color: var(--ink);
  margin: 0 0 8px;
}

.eyebrow {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 16px;
}

.lede {
  font-size: 21px;
  line-height: 1.5;
  color: var(--ink-muted);
  margin: 0 0 32px;
  font-weight: 300;
}

p { margin: 0 0 16px; }
p.muted { color: var(--ink-muted); }
p.soft { color: var(--ink-soft); font-size: 14px; }

a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { color: var(--accent-deep); }

ul, ol { padding-left: 22px; margin: 0 0 16px; }
li { margin-bottom: 8px; }

strong { font-weight: 500; color: var(--ink); }

/* ------- Buttons ------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 13px 24px;
  border-radius: 6px;
  font-family: 'Newsreader', serif;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s ease;
  border: none;
  text-decoration: none;
}
.btn-primary { background: var(--action); color: white; }
.btn-primary:hover { background: var(--action-deep); color: white; }
.btn-accent { background: var(--accent); color: white; }
.btn-accent:hover { background: var(--accent-deep); color: white; }
.btn-secondary {
  background: transparent;
  color: var(--ink-muted);
  border: 1px solid var(--border);
}
.btn-secondary:hover { background: var(--surface-2); color: var(--ink); }
.btn-large { padding: 16px 32px; font-size: 17px; }

.btn-row {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}

/* ------- Cards / sections ------- */

.card {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: 12px;
  padding: 28px;
  margin-bottom: 14px;
}
.card-accent {
  border-left: 3px solid var(--accent);
}
.card h3 { margin-top: 0; }

.card-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin: 24px 0;
}
@media (max-width: 720px) {
  .card-grid { grid-template-columns: 1fr; }
}

.card-grid-2 {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  margin: 24px 0;
}
@media (max-width: 720px) {
  .card-grid-2 { grid-template-columns: 1fr; }
}

.tile {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: 12px;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  text-decoration: none;
  color: inherit;
  transition: all 0.2s ease;
}
.tile:hover {
  border-color: var(--action);
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg);
  color: inherit;
}
.tile h3 {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 18px;
  margin: 0;
  color: var(--ink);
}
.tile p {
  font-size: 14.5px;
  color: var(--ink-muted);
  line-height: 1.55;
  margin: 0;
}
.tile-arrow {
  margin-top: auto;
  padding-top: 12px;
  font-size: 13px;
  color: var(--action);
  font-weight: 500;
}

/* ------- Hero ------- */

.hero {
  padding: 72px 24px 48px;
  max-width: 760px;
  margin: 0 auto;
}
@media (max-width: 720px) {
  .hero { padding: 40px 18px 28px; }
}

.hero-stat {
  display: flex;
  gap: 28px;
  margin: 32px 0 0;
  flex-wrap: wrap;
  font-size: 14.5px;
  color: var(--ink-soft);
}
.hero-stat-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.hero-stat-num {
  font-family: 'Fraunces', serif;
  font-size: 26px;
  font-weight: 500;
  color: var(--action);
  line-height: 1;
}

/* ------- FAQ ------- */

.faq-item {
  border-top: 1px solid var(--border-soft);
  padding: 18px 0;
}
.faq-item:last-child { border-bottom: 1px solid var(--border-soft); }
.faq-q {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 17px;
  cursor: pointer;
  user-select: none;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  color: var(--ink);
}
.faq-q-toggle {
  color: var(--ink-soft);
  font-size: 14px;
  flex-shrink: 0;
  margin-top: 4px;
  transition: transform 0.2s ease;
}
.faq-q-toggle.open { transform: rotate(180deg); }
.faq-a {
  margin-top: 12px;
  color: var(--ink-muted);
  font-size: 16px;
  line-height: 1.6;
}
.faq-a p { margin-bottom: 12px; }
.faq-a p:last-child { margin-bottom: 0; }

/* ------- Process timeline ------- */

.timeline {
  position: relative;
  padding-left: 28px;
  margin: 24px 0 32px;
}
.timeline::before {
  content: '';
  position: absolute;
  left: 6px;
  top: 8px;
  bottom: 8px;
  width: 2px;
  background: var(--border);
}
.timeline-step {
  position: relative;
  padding: 8px 0 24px;
}
.timeline-step::before {
  content: '';
  position: absolute;
  left: -28px;
  top: 14px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--accent);
  border: 3px solid var(--bg);
  box-shadow: 0 0 0 1px var(--accent);
}
.timeline-step h4 {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 17px;
  margin: 0 0 4px;
  color: var(--ink);
}
.timeline-step .meta {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 6px;
}
.timeline-step p {
  font-size: 15px;
  line-height: 1.55;
  color: var(--ink-muted);
  margin: 0;
}

/* ------- Video placeholders ------- */

.video-placeholder {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: 10px;
  aspect-ratio: 16 / 9;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-align: center;
  padding: 16px;
  position: relative;
  overflow: hidden;
}
.video-placeholder::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--accent-soft) 0%, var(--surface-2) 100%);
  opacity: 0.5;
}
.video-play {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  position: relative;
  z-index: 1;
}
.video-title {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 15px;
  position: relative;
  z-index: 1;
  color: var(--ink);
}
.video-tag {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink-soft);
  font-weight: 500;
  position: relative;
  z-index: 1;
}

/* ------- Resource list ------- */

.resource-list { margin: 16px 0 32px; }
.resource-item {
  display: flex;
  flex-direction: column;
  padding: 16px 0;
  border-top: 1px solid var(--border-soft);
}
.resource-item:last-child { border-bottom: 1px solid var(--border-soft); }
.resource-item h4 {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 16px;
  margin: 0 0 4px;
}
.resource-item h4 a {
  color: var(--ink);
  text-decoration: none;
}
.resource-item h4 a:hover { color: var(--accent); }
.resource-item p {
  font-size: 14.5px;
  color: var(--ink-muted);
  line-height: 1.5;
  margin: 0;
}
.resource-item .url {
  font-size: 12px;
  color: var(--ink-soft);
  margin-top: 4px;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
}

/* ------- Big CTA strip ------- */

.cta-strip {
  margin: 48px 0;
  padding: 36px 32px;
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-left: 4px solid var(--action);
  border-radius: 12px;
}
.cta-strip h3 {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 22px;
  margin: 0 0 6px;
  color: var(--ink);
}
.cta-strip p {
  color: var(--ink-muted);
  margin: 0 0 16px;
  font-size: 15.5px;
}

/* ------- Footer ------- */

.site-footer {
  border-top: 1px solid var(--border-soft);
  background: var(--surface);
  padding: 40px 24px 32px;
  margin-top: 80px;
}
.site-footer-inner {
  max-width: 1080px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr;
  gap: 32px;
}
@media (max-width: 720px) {
  .site-footer-inner { grid-template-columns: 1fr 1fr; gap: 24px; }
}
.footer-brand p {
  font-size: 13px;
  color: var(--ink-soft);
  margin-top: 8px;
  line-height: 1.5;
  max-width: 320px;
}
.footer-col h5 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-soft);
  font-weight: 600;
  margin: 0 0 12px;
  font-family: 'Newsreader', serif;
}
.footer-col a {
  display: block;
  color: var(--ink-muted);
  text-decoration: none;
  font-size: 14px;
  padding: 4px 0;
}
.footer-col a:hover { color: var(--ink); }
.footer-disclaimer {
  max-width: 1080px;
  margin: 32px auto 0;
  padding-top: 24px;
  border-top: 1px solid var(--border-soft);
  font-size: 12px;
  color: var(--ink-soft);
  line-height: 1.6;
}

/* ------- Misc ------- */

.fade-in { animation: fadeIn 0.3s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.divider {
  border: none;
  border-top: 1px solid var(--border-soft);
  margin: 48px 0;
}

.callout {
  background: var(--accent-soft);
  border-left: 3px solid var(--accent);
  border-radius: 6px;
  padding: 16px 20px;
  margin: 24px 0;
  font-size: 15.5px;
  color: var(--ink);
}
.callout p:last-child { margin-bottom: 0; }

/* Rights section on home */
.rights-section {
  margin-top: 24px;
  padding: 36px 0 8px;
  border-top: 1px solid var(--border-soft);
}
.rights-section p {
  font-size: 17px;
  line-height: 1.6;
  color: var(--ink);
  max-width: 640px;
}
.rights-callouts {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-top: 28px;
}
@media (max-width: 720px) {
  .rights-callouts { grid-template-columns: 1fr; }
}
.rights-callout {
  padding: 20px;
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-left: 3px solid var(--accent);
  border-radius: 8px;
}
.rights-callout h4 {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 16px;
  margin: 0 0 6px;
  color: var(--accent-deep);
}
.rights-callout p {
  font-size: 14px;
  color: var(--ink-muted);
  line-height: 1.5;
  margin: 0;
}

/* ===== Chat tool ===== */

.demo-banner {
  background: #FFF4E0;
  border: 1px solid #E8C078;
  border-radius: 8px;
  padding: 14px 18px;
  margin-bottom: 24px;
  font-size: 14px;
  color: #6B5634;
}
.demo-banner strong { color: #4A3D24; }

.chat-shell {
  max-width: 760px;
  margin: 0 auto;
}
.chat-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 16px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--border-soft);
}
.chat-head-title {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 18px;
  margin: 0;
  color: var(--ink);
}
.chat-head-actions a {
  font-size: 13px;
  color: var(--ink-muted);
  cursor: pointer;
  text-decoration: underline;
  text-decoration-style: dotted;
  text-underline-offset: 3px;
}
.chat-head-actions a:hover { color: var(--ink); }

.phase-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--border-soft);
  padding-bottom: 0;
}
.phase-bar-item {
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-soft);
  padding: 8px 0;
  border-bottom: 2px solid transparent;
  font-weight: 600;
  transition: color 0.2s ease;
}
.phase-bar-item.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}
.phase-bar-item.complete {
  color: var(--accent);
  opacity: 0.7;
}

.thread {
  margin-bottom: 16px;
}
.msg {
  margin-bottom: 18px;
  display: flex;
}
.msg.assistant { justify-content: flex-start; }
.msg.user { justify-content: flex-end; }
.msg-bubble {
  max-width: 85%;
  padding: 14px 18px;
  border-radius: 12px;
  font-size: 15.5px;
  line-height: 1.55;
}
.msg.assistant .msg-bubble {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  color: var(--ink);
}
.msg.user .msg-bubble {
  background: var(--accent);
  color: white;
}
.msg-bubble p { margin: 0 0 8px; }
.msg-bubble p:last-child { margin-bottom: 0; }
.msg-bubble strong { font-weight: 600; }

.wait-check {
  background: var(--warn-soft);
  border: 1px solid var(--warn);
  border-left: 3px solid var(--warn-deep);
  border-radius: 8px;
  padding: 14px 18px;
  margin: 12px 0;
  font-size: 14.5px;
  color: var(--ink);
}
.wait-check strong { color: var(--warn-deep); }

.composer {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  padding: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
}
.composer textarea {
  flex: 1;
  border: none;
  background: transparent;

function useRoute() {
  const get = () => {
    if (typeof window === "undefined") return "/";
    const h = window.location.hash || "#/";
    return h.replace(/^#/, "") || "/";
  };
  const [route, setRoute] = useState(get);
  useEffect(() => {
    const onHash = () => setRoute(get());
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);
  useEffect(() => {
    if (typeof window !== "undefined") window.scrollTo({ top: 0, behavior: "instant" });
  }, [route]);
  return route;
}

function go(path) {
  if (typeof window !== "undefined") window.location.hash = "#" + path;
}

function HowPage() {
  return (
    <div className="page fade-in">
      <div className="eyebrow">How it works</div>
      <h1 className="display" style={{ fontSize: 42 }}>
        What filing a <em>due process complaint</em> in New York actually looks like.
      </h1>
      <p className="lede">
        In plain language, with realistic timelines. The whole process is more
        manageable than it sounds — most cases don't end up at a hearing.
      </p>

      <h2 className="section" style={{ marginTop: 32 }}>The arc</h2>
      <div className="timeline">
        <div className="timeline-step">
          <div className="meta">Step 1 · Day 0</div>
          <h4>You file the complaint</h4>
          <p>
            The complaint is a written document — a letter, basically — that
            describes the problem and what you want fixed. You send it to two
            places at the same time: your school district and the New York
            State Education Department. There's no filing fee. Plainly drafts
            this for you in your voice.
          </p>
        </div>
        <div className="timeline-step">
          <div className="meta">Step 2 · Within 15 days</div>
          <h4>Resolution session</h4>
          <p>
            The district has to convene a "resolution session" — basically a
            sit-down meeting between you and district representatives to try to
            settle the complaint. It's informal. No hearing officer, no
            transcript. A lot of cases settle here. The district usually shows
            up because they'd rather give you something than litigate.
          </p>
        </div>
        <div className="timeline-step">
          <div className="meta">Step 3 · Days 15–30</div>
          <h4>Resolution period</h4>
          <p>
            If the resolution session doesn't fully resolve things on day one,
            the parties have up to 30 days from the date you filed to keep
            negotiating. Many cases that don't settle on day one do settle
            within this window. Mediation is also available as a separate,
            voluntary alternative — free, less formal — if both sides agree.
          </p>
        </div>
        <div className="timeline-step">
          <div className="meta">Step 4 · ~Day 75 in NY</div>
          <h4>If unresolved: due process hearing</h4>
          <p>
            If nothing's been resolved, the case proceeds to a formal hearing
            before an Impartial Hearing Officer (IHO). Both sides present
            evidence and witnesses. NYC has its own Impartial Hearing Office;
            other NY districts handle hearings through their own procedures.
            The hearing itself is usually 1–3 days. Extensions are common in
            practice, so the actual timeline can run longer.
          </p>
        </div>
        <div className="timeline-step">
          <div className="meta">Step 5 · ~45 days after hearing</div>
          <h4>Decision</h4>
          <p>
            The hearing officer issues a written decision. If you disagree with
            it, you can appeal to a State Review Officer (SRO), and from there
            potentially to court. Most cases don't reach this stage.
          </p>
        </div>
      </div>

      <div className="callout">
        <strong>What this all means for your time:</strong>
        <p style={{ marginTop: 8 }}>
          If your case settles at the resolution session — which a lot do — the
          whole thing might be a couple of hours of your time, plus drafting and
          gathering documents. If it goes to hearing, plan on 1–3 days of
          hearing time plus prep. Throughout, your child's current program
          stays in place; the district can't change it while the case is pending.
        </p>
      </div>

      <h2 className="section">A few things parents are usually surprised to learn</h2>
      <div className="card">
        <h3 className="sub">There's no filing fee.</h3>
        <p className="muted" style={{ margin: 0 }}>
          Filing a due process complaint costs you nothing out of pocket. Some
          parents end up paying for outside evaluations or hiring an advocate or
          attorney, but the filing itself is free.
        </p>
      </div>
      <div className="card">
        <h3 className="sub">The district can't recover legal fees from you.</h3>
        <p className="muted" style={{ margin: 0 }}>
          Under IDEA, fee-shifting only runs to prevailing parents — meaning a
          district can't make you pay their lawyer. The narrow exception is for
          truly frivolous filings, which is a high bar.
        </p>
      </div>
      <div className="card">
        <h3 className="sub">Pendency means your child's current program stays.</h3>
        <p className="muted" style={{ margin: 0 }}>
          Once you file, the district can't change your child's program until
          the case is resolved. This is called "pendency" or "stay-put." For
          most parents this is a feature: it freezes things in place while you
          negotiate.
        </p>
      </div>
      <div className="card">
        <h3 className="sub">Most cases settle at the resolution session.</h3>
        <p className="muted" style={{ margin: 0 }}>
          The resolution session exists because districts settle most cases

// ============================================================================
// SESSION STORAGE SHIM — emulates artifact window.storage API
// ============================================================================
// Uses sessionStorage (not localStorage): a conversation survives a page
// reload WITHIN the same browser tab, but a new visit / new tab / closing the
// tab starts completely fresh. This prevents a new visitor from ever seeing a
// previous person's conversation, while still protecting against accidental
// mid-session refreshes. Installed BEFORE any chat code runs.
if (typeof window !== "undefined" && !window.storage) {
  var _store = (typeof sessionStorage !== "undefined") ? sessionStorage : null;
  // In-memory fallback if sessionStorage is unavailable (private mode edge cases)
  var _mem = {};
  function _get(k) { return _store ? _store.getItem(k) : (k in _mem ? _mem[k] : null); }
  function _set(k, v) { if (_store) _store.setItem(k, v); else _mem[k] = v; }
  function _del(k) { if (_store) _store.removeItem(k); else delete _mem[k]; }
  function _len() { return _store ? _store.length : Object.keys(_mem).length; }
  function _key(i) { return _store ? _store.key(i) : Object.keys(_mem)[i]; }

  window.storage = {
    async get(key) {
      const v = _get(key);
      if (v == null) throw new Error("Key not found: " + key);
      return { key, value: v, shared: false };
    },
    async set(key, value) {
      try {
        const s = typeof value === "string" ? value : JSON.stringify(value);
        _set(key, s);
        return { key, value: s, shared: false };
      } catch (e) { return null; }
    },
    async delete(key) {
      try { _del(key); return { key, deleted: true, shared: false }; }
      catch (e) { return null; }
    },
    async list(prefix) {
      const keys = [];
      for (let i = 0; i < _len(); i++) {
        const k = _key(i);
        if (!prefix || (k && k.startsWith(prefix))) keys.push(k);
      }
      return { keys, prefix, shared: false };
    },
  };

  // One-time cleanup: the previous version stored conversations in
  // localStorage. Remove any leftover Plainly keys there so old data doesn't
  // linger in returning visitors' browsers.
  try {
    if (typeof localStorage !== "undefined") {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && (k.indexOf("plainly:") === 0 || k.indexOf("filing_path_demo:") === 0)) {
          stale.push(k);
        }
      }
      stale.forEach((k) => localStorage.removeItem(k));
    }
  } catch (e) { /* ignore */ }
}

- Warm, direct, plain English. A friend who knows special ed law — not a lawyer.
- Short messages. Don't lecture. One question at a time when possible.
- Never tell the parent their case is weak. Never use "FAPE," "LRE," or cite statutes in chat.
- Acknowledge feelings briefly when appropriate, then keep moving.
- Don't say "captured," "noting that," "let me record" — anything that surfaces the structured capture.

PROGRESSIVE DISCLOSURE — important
The goal of this conversation is to assess whether there's a viable claim. Keep friction low. Do NOT proactively ask for identifiable demographic information at this stage — that includes full names, addresses, school names, district names, dates of birth, or other formal identifiers. Those get collected later, only if the parent decides to move forward to drafting.

For this conversation, you only need enough to:
- Converse naturally (first name + age + grade is plenty for orientation)
- Recognize the type of claim from the issue description
- Surface any wait-checks that apply
- Understand the basics: what services or program, what's not working, what the parent has tried

If the parent volunteers a school name, district, or other identifier, you can capture it silently — but don't ask. The disability classification often surfaces naturally as the parent describes the situation; let it come up rather than interviewing for it.

FOUR PHASES — light scaffolding. Move through them naturally; don't announce them.
1. "child" — JUST first name, age, grade. Enough to converse naturally and orient. Do not push for school name, district, full name, or formal classification at this phase.
2. "issue" — what's actually wrong, in their words and through your follow-ups
3. "context" — recent CSE meetings, written communications, evidence available, anything older than 2 years
4. "wrap" — recap what you're taking forward and confirm

CLAIM CATEGORIES — recognize these in parent's words, don't recite them
1. Inadequate related services
2. Inappropriate program/IEP
3. Implementation failure
4. Evaluation/IEE
5. Placement/LRE
6. Tuition reimbursement / unilateral private placement
7. Procedural violation affecting FAPE
8. Discipline / manifestation determination

ORIENTATION ON CLAIMS
Find a claim, don't screen one out. Parents under-file. Threshold is "colorable" — facts plausibly fit at least one category. Don't assess strength.

WAIT-CHECK TRIGGERS — surface IMMEDIATELY in conversation, not at recap

Trigger A: parent mentions private school (considering, planning, or already enrolled)
Action: in your very next reply, briefly explain the 10-day notice rule. Example: "Quick — important thing before we keep going. To preserve the strongest claim for tuition reimbursement, NY parents need to either tell the district at the most recent CSE meeting that you're rejecting their program and intend to enroll privately at public expense, OR give them written notice at least 10 business days before pulling [child] out. Have you done either of those?" Set wait_check_just_surfaced = "ten_day_notice".

Trigger B: parent describes events more than 2 years old as their main concerns
Action: gently note that NY generally requires filing within 2 years of when you knew about the issue. Ask what's been going on more recently. Set wait_check_just_surfaced = "statute_of_limitations".

Trigger C: parent describes wanting to change a current program mid-year
Action: briefly mention filing usually freezes the current program in place during the case. Set wait_check_just_surfaced = "pendency".

Trigger D: very recent CSE meeting (last 2 weeks) or imminent one
Action: note some parents file before the next meeting; either is fine. Set wait_check_just_surfaced = "recent_cse".

THIN-CASE HANDLING
If after 3-4 issue-phase turns you genuinely cannot identify any colorable claim category, do NOT keep fishing. Acknowledge honestly and give specific guidance: get the most recent IEP, request progress reports on goals, put concerns in writing to CSE chair, request evaluation in writing if needed. Invite them to come back. Set state = "thin_offer_guidance".

WHEN TO WRAP UP
Move to "wrap" when you have basic child info, an issue with at least one identifiable claim category, some context, and any wait-checks have been addressed.

When you wrap, your chat_reply should be a clean recap of what you're taking forward and ask: "Did I get that right? Anything I missed?" Set state = "ready_to_recap".

Don't proactively go to "complete" — wait for parent affirmation. When parent affirms the recap is right, OFFER a draft preview using LIGHT-TOUCH framing — NOT a heavy "ready to file" framing. Use language like:

"Let me know if you'd like to see what a complaint would look like for this situation — I can put a draft together for you to review. There's no commitment to actually file; it's something you can hold, look over, and decide later. Or, if you want to ask anything first about how this works, the timeline, or what filing involves, happy to talk through it."

The frame is "preview" not "are you ready to take action." Parents need something tangible in their hands to evaluate. The draft is collateral they can sit with.

Set state = "complete" once the parent has affirmed the recap. The "complete" state means intake is done — but it does NOT mean we're proceeding to file. The draft is just a preview.

ASSESSMENT/DRAFT TRIGGER

When the parent indicates they want to see the draft (anything like "yes please," "go ahead," "sure," "let's see it," "show me," "yes do that"), set parent_requested_assessment = true in your output. Your chat_reply should briefly acknowledge ("Okay — pulling that together now. You'll see it appear below.") and continue to be available for questions.

If the parent only wants to ask questions without seeing the draft, leave parent_requested_assessment unset (or false) and just answer.

Once parent_requested_assessment has been set true once, it stays true — the analysis and draft become available. Don't re-set it on subsequent turns.

WHEN PARENT SAYS "NOT READY" OR "NOT NOW" — OFFER LIGHTER OUTPUTS

If the parent indicates they're not ready to see a full draft (e.g., "I'm not ready to file anything," "I need to think about it," "not sure yet"), do NOT just back off and end the conversation. Acknowledge that's fine, then OFFER 2-4 lighter-touch deliverables tailored to their situation. See THE OUTPUT LIBRARY below.

THE OUTPUT LIBRARY — what you can generate

You can offer any combination of these. The UI generates whichever ones the parent accepts.

LETTERS (each is a short, ready-to-send email/letter the parent can use):
- 10-day notice — letter to the district saying you reject their program and intend to enroll privately. Time-sensitive. Offer when private school is in play and notice not yet given.
- IEE request — letter asking the district to fund an independent evaluation. Offer when parent disagrees with a district eval.
- Evaluation request — letter asking the district to evaluate or reevaluate. Offer when parent thinks evaluation is needed and district hasn't done it.
- CSE follow-up — letter putting concerns in writing after the district has gone quiet. Offer when parent has raised something orally and district hasn't acted.
- IEP rejection — letter formally disagreeing with the proposed IEP. Offer when district has proposed an IEP parent disagrees with, especially if not signed.
- Records request — letter requesting the full educational file. Offer when parent doesn't have full picture or wants documentation before filing.

NARRATIVE / REFERENCE DOCUMENTS:
- Claim summary — clean one-page write-up of the situation in the parent's voice. Useful for almost any situation. Offer when parent might benefit from seeing their case organized.
- Documents to gather — personalized list of documents that would matter for their case. Almost always useful.
- Other steps to consider — non-document actions like getting a doctor's letter, requesting an observation, etc.

FULL OUTPUT:
- Full complaint draft — the complete due process complaint. Requires more formal details (parent's full name, address, child's DOB, district name, specific remedy). Offer when parent wants to see what filing would actually look like.

WHEN OFFERING — be specific and tailored. Don't dump the menu. Pick 2-4 most relevant.

Examples of good offers:

For a parent considering private placement who's "not sure if they want to file":
"A few things might be useful to have in hand either way: I can draft the 10-day notice letter so you have it ready to send if you decide to enroll — even if you don't end up using it, it preserves your options. I can also write up a clean summary of [child]'s situation that you can sit with, and a list of documents worth gathering. Want me to put those together?"

For a parent dealing with inadequate services who's not ready to file:
"A couple of things I can put together: a clean summary of the situation, a follow-up letter to the CSE chair so the concerns are on the record in writing, and a list of documents worth gathering. Or if you'd like to see what a full complaint would look like just to consider, I can do that too. Let me know what would help."

For a parent whose situation is mostly procedural (no PWN, district unresponsive):
"A few things that could help: I can draft a follow-up letter to the CSE chair putting your concerns in writing — that triggers their obligation to respond. I can also do a records request so you get the full file. And a list of next steps to consider. Want me to put those together?"

THE STRUCTURED SIGNAL

When the parent accepts ANY combination of outputs:
1. Set parent_requested_assessment = true.
2. Populate outputs_to_generate with the list of output IDs from the library. Use these EXACT IDs:
   "ten_day_notice", "iee_request", "evaluation_request", "cse_followup", "iep_rejection", "records_request", "claim_summary", "document_checklist", "action_recommendations", "full_complaint"

If the parent says yes generally without specifying ("yes please," "go ahead", "all of those sound good"), use your judgment to populate outputs_to_generate with the 2-4 you offered.

If the parent specifically asks for the full complaint, include "full_complaint" in the list. The UI will gather formal details for that one.

Q&A MODE — after intake is complete

Once you set state to "complete" in a prior turn, the conversation CONTINUES in Q&A mode. The parent can ask questions; you answer. Topics you handle:

- What filing actually involves procedurally
- Timeline: 15 days from filing for resolution session, 30-day resolution period, hearing within ~45 days after if not resolved (~3 months filing to hearing in NY, often longer with extensions). Decision within 45 days of hearing.
- Time commitment for parents
- Mediation as a voluntary, free alternative
- State complaint to NYSED — focused on procedural compliance, 60-day investigation
- Pendency / stay-put
- Documents to gather
- Whether the case feels worth filing

CRITICAL CALIBRATION ON ATTORNEY MENTIONS — read carefully

The default posture of this product is that PARENTS CAN AND SHOULD HANDLE THESE CASES THEMSELVES. Parents under-file dramatically. The product exists because the legal-fees calculation makes attorneys impractical for most disputes. Every reflexive "consider a lawyer" line undermines the parent's confidence and runs against the product's core mission. A pro se parent who can clearly articulate facts to a hearing officer can do fine.

DO NOT proactively recommend an attorney for these GARDEN-VARIETY cases:
- Disputes over service frequency, duration, or amount (more speech, more OT, more reading support)
- Disputes over evaluation or IEE
- Classification or eligibility disputes
- Implementation failures (services not being delivered)
- Procedural violations (no PWN, missed timelines, etc.)
- Transportation, equitable services, related services for parentally-placed private students
- Most placement disputes within the public system

For these, when the parent asks about legal questions or about going forward, your default posture is: "What's the harm in filing? You don't pay to file. The district can't recover fees from you unless the case is frivolous. The worst plausible outcome of filing is that you don't get what you asked for and you're back where you started — but in many cases the resolution session itself produces some kind of accommodation because the district doesn't want to litigate. Filing also makes the district take you seriously in a way that informal conversation often doesn't."

You CAN mention attorneys for genuinely HIGH-STAKES situations:
- Tuition reimbursement >$20K
- Expulsion or manifestation determination
- Cases where the district already has an attorney at the resolution session
- Complex multi-issue cases at the hearing stage

For these, frame attorney consultation as ONE OPTION worth considering at certain stages — not as a prerequisite to acting. Even here, "you can file first, see how the resolution session goes, and reassess from there" is usually the right framing.

CRITICAL CALIBRATION ON LEGAL UNCERTAINTY

When asked legal questions where the answer is genuinely unsettled (e.g., transportation for parentally-placed private students), explain the framework honestly — what the rules say, what the district's likely position is, what the gray area is. Do NOT default to "consult an attorney." Instead, default to: "It's not a slam dunk, but you have enough to push back. Filing puts pressure on the district to engage with the question. The worst case is they win on the merits and you're where you are now. The best case is they decide it's not worth fighting and they restore the service."

Stay conversational. Plain English. Use the child's first name. Don't lecture. Don't dump everything you know; answer what they asked.

In Q&A mode:
- Keep state = "complete"
- Don't change current_phase
- intake_updates stays empty unless something genuinely new comes up
- wait_check_just_surfaced stays "none" unless something genuinely new triggers
- Just answer in chat_reply

OUTPUT FORMAT — CRITICAL

Every reply you produce MUST be a single valid JSON object and NOTHING ELSE.

- The very first character of your response MUST be { (left curly brace).
- The very last character of your response MUST be } (right curly brace).
- NO prose before the JSON. NO prose after the JSON.
- NO markdown code fences (no \`\`\`json or \`\`\`).
- NO explanation of what you're about to say. The chat_reply field IS what the parent will see — put your conversational message there.
- Inside string values, escape newlines as \\n and double quotes as \\".

The JSON object structure:

{
  "chat_reply": "the message the parent sees — your full conversational response goes HERE, not before the JSON",
  "current_phase": "child|issue|context|wrap",
  "intake_updates": {
    // only newly-learned fields. Omit anything not yet known. Schema below.
  },
  "wait_check_just_surfaced": "ten_day_notice|statute_of_limitations|pendency|recent_cse|null",
  "state": "continuing|ready_to_recap|thin_offer_guidance|complete"
}

INTAKE SCHEMA — populate silently:
{
  "student_first_name": string,
  "student_age": number,
  "student_grade": string,
  "student_school": string,
  "student_classification": string,

  "concern_tags": [from: "not_making_progress","services_not_happening","wrong_amount_of_services","wrong_kind_of_program","evaluation_problem","placement_problem","behavior_or_discipline","communication_problem","considering_private","transition_problem"],

  "evidence_available": [from: "current_iep","prior_ieps","private_evaluation","district_evaluation","progress_reports","report_cards","emails","pwn","meeting_notes","provider_letters","medical"]
}

The running intake state will be appended to your system prompt. Use it. Don't re-ask things you already know.

DO NOT tell the parent about phases, claim categories, or output format. Don't recommend a lawyer in chat. Don't predict outcomes. Don't invent facts.`;

const IEP_FLAG_PROMPT = `You are reviewing a New York State IEP that has already been extracted into structured form, plus brief context from the parent about their concerns. Your job is to identify facts in the IEP that plausibly connect to recognized due process claim categories, and to ask the parent the questions that would turn each fact into actual evidence.

You are not grading the IEP. You are not finding everything that could be improved. You are finding facts that, combined with parent information, could support a colorable due process claim.

Most flags should be paired with a question to the parent, because the IEP alone usually cannot tell you whether something is an issue. Examples:

  Wrong: "Speech services are insufficient."
  Right: "The IEP provides 30 minutes of speech per week, individually. Has [name] been making progress on his speech goals? Has any private evaluator or therapist recommended more than this?"

  Wrong: "The reading goal recycles from last year — that's a FAPE violation."
  Right: "The reading fluency goal in this IEP looks similar to last year's. Did [name] not meet that goal last year? What do the progress reports say?"

CLAIM CATEGORIES TO MAP TO

Use these eight categories (same as the rest of the system). Each flag should reference one or more.

1. Inadequate related services — service amounts low relative to typical recommendations for the disability classification, group format where 1:1 may be needed, services missing despite present levels describing needs in that domain.

2. Inappropriate program/IEP — annual goals that are vague, not measurable, or lack baselines (NY requires measurable goals); goals that appear to repeat from a prior IEP if available; program type that may not match present levels (e.g., ICT for a child whose present levels describe needing intensive 1:1 support); methodology silence in cases where methodology matters (no structured literacy mentioned for an LD-reading classification; behavioral approach unspecified for autism with significant behavior needs); missing/weak management needs section when present levels describe substantial behavior, attention, or sensory needs.

3. Implementation failure — IEP rarely shows this on its face. Ask the parent directly whether services on the IEP are actually happening every session, every week.

4. Evaluation/IEE — evaluations referenced more than three years old (triennial overdue); classification that may not match present levels; no private/independent evaluation referenced when parent has one.

5. Placement/LRE — placement more or less restrictive than present levels seem to require; LRE explanation generic or absent; for NYC DOE: deferred placement, District 75 disputes, nonpublic recommendations.

6. Tuition reimbursement / unilateral placement — only engage this category if parent context indicates private placement is in play.

7. Procedural violation affecting FAPE — IEP meeting date more than a year before projected implementation; required participants apparently missing; for students 15+: missing/thin transition plan, missing post-secondary goals; 12-month services denied without rationale where regression risk is described; testing accommodations missing or inconsistent with classroom accommodations; counseling/behavior supports recommended in present levels but not in services.

// Calls Claude with our response tool. Tries tool_use first (most reliable
// when the model honors tool_choice), falls back to parsing JSON from text
// blocks if the model returns text instead. This handles environments where
// tool_choice forcing isn't fully supported.
async function callClaude(messages, dynamicSystem) {
  const apiMessages = messages.map((m) => ({ role: m.role, content: m.content }));
  const response = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: MODEL,
      max_tokens: 2000,
      system: dynamicSystem,
      messages: apiMessages,
      tools: [RESPONSE_TOOL],
      tool_choice: { type: "tool", name: "respond_to_parent" },
    }),
  });
  if (!response.ok) {
    const err = await response.text();
    throw new Error(`API ${response.status}: ${err.slice(0, 200)}`);
  }
  const data = await response.json();

  // Path 1: model used the tool (most reliable)
  const toolUse = data.content.find(
    (b) => b.type === "tool_use" && b.name === "respond_to_parent"
  );
  if (toolUse && toolUse.input) {
    return toolUse.input;
  }

  // Path 2: model returned text — try to parse JSON out of it
  const text = data.content
    .filter((b) => b.type === "text")
    .map((b) => b.text)
    .join("\n");
  if (text && text.trim()) {
    try {
      return parseJSON(text);
    } catch (e) {
      // Graceful degradation: model returned plain conversational text without
      // structured output. Use the text as chat_reply so the conversation flows;
      // we just don't update structured intake fields for this turn. Next turn
      // catches up.
      return {
        chat_reply: text.trim(),
        current_phase: null,
        intake_updates: {},
        wait_check_just_surfaced: "none",
        state: "continuing",
      };
    }
  }

  // Truly nothing usable
  const blockTypes = data.content.map((b) => b.type).join(", ");
  throw new Error(`No response from model (got blocks: ${blockTypes || "none"})`);
}

// Calls Claude without forcing tool use, for tasks like checklist generation

async function callClaudeForJSON(systemPrompt, userMessage) {

    body: JSON.stringify({
      model: MODEL,
      max_tokens: 3000,

    }),
  });
  if (!response.ok) {
    const err = await response.text();
    throw new Error(`API ${response.status}: ${err.slice(0, 200)}`);
  }
  const data = await response.json();
  const text = data.content
    .filter((b) => b.type === "text")
    .map((b) => b.text)
    .join("\n");
  return parseJSON(text);
}

// Calls Claude for plain-text output (e.g., the drafter generating a complaint letter).
// Calls Claude for plain-text output (e.g., the drafter generating a complaint letter).
async function callClaudeForText(systemPrompt, userMessage, maxTokens = 4000) {
  const response = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: MODEL,
      max_tokens: maxTokens,
      system: systemPrompt,
      messages: [{ role: "user", content: userMessage }],
    }),
  });
  if (!response.ok) {
    const err = await response.text();
    throw new Error(`API ${response.status}: ${err.slice(0, 200)}`);
  }
  const data = await response.json();
  const text = data.content
    .filter((b) => b.type === "text")
    .map((b) => b.text)
    .join("\n");
  if (!text || !text.trim()) {
    throw new Error("Empty response from model");
  }
  return text.trim();
}

  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result;
      // result is a data URL like "data:application/pdf;base64,XXXX"
      const base64 = result.split(",")[1];
      resolve(base64);
    };
    reader.onerror = () => reject(new Error("Failed to read file"));
    reader.readAsDataURL(file);
  });
}

// Calls Claude with a PDF as a document block plus a system prompt and a text
// instruction. Used for IEP extraction. Returns parsed JSON.
async function callClaudeWithPDF(systemPrompt, pdfBase64, instruction, maxTokens = 4000) {
  const response = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: MODEL,
      max_tokens: maxTokens,
      system: systemPrompt,
      messages: [
        {
          role: "user",
          content: [
            {
              type: "document",
              source: { type: "base64", media_type: "application/pdf", data: pdfBase64 },
            },
            { type: "text", text: instruction },
          ],
        },
      ],
    }),
  });
  if (!response.ok) {
    const err = await response.text();
    throw new Error(`API ${response.status}: ${err.slice(0, 200)}`);
  }
  const data = await response.json();
  const text = data.content
    .filter((b) => b.type === "text")
    .map((b) => b.text)
    .join("\n");
  return parseJSON(text);
}

// Walk the text tracking string state and brace depth to find a complete,
// balanced JSON object. Much more robust than first-{ to last-} slicing.
function extractBalancedJSON(text) {
  const start = text.indexOf("{");
  if (start === -1) return null;
  let depth = 0;
  let inString = false;
  let escape = false;
  for (let i = start; i < text.length; i++) {
    const c = text[i];
    if (escape) { escape = false; continue; }
    if (c === "\\") { escape = true; continue; }
    if (c === '"') { inString = !inString; continue; }
    if (inString) continue;
    if (c === "{") depth++;
    else if (c === "}") {
      depth--;
      if (depth === 0) return text.slice(start, i + 1);
    }
  }
  return null;
}

function parseJSON(text) {
  if (!text) throw new Error("Empty response");
  // Try direct parse first
  try { return JSON.parse(text); } catch {}
  // Try code-fenced
  const fenced = text.match(/```(?:json)?\s*([\s\S]*?)\s*```/);
  if (fenced) {
    try { return JSON.parse(fenced[1]); } catch {}
  }
  // Try brace-balanced extraction (handles prose around JSON, nested objects, etc.)
  const balanced = extractBalancedJSON(text);
  if (balanced) {
    try { return JSON.parse(balanced); } catch {}
  }
  // Last-ditch: try to recover at least chat_reply via regex so the user sees something
  const replyMatch = text.match(/"chat_reply"\s*:\s*"((?:[^"\\]|\\.)*)"/);
  if (replyMatch) {
    return {
      chat_reply: replyMatch[1].replace(/\\n/g, "\n").replace(/\\"/g, '"'),
      _partial: true,
    };
  }
  throw new Error("Could not parse JSON from model response");
}

function mergeIntake(current, updates) {
  if (!updates) return current;
  const merged = { ...current };
  for (const [k, v] of Object.entries(updates)) {
    if (v === null || v === undefined) continue;
    if (Array.isArray(v)) {
      const ex = Array.isArray(merged[k]) ? merged[k] : [];
      merged[k] = Array.from(new Set([...ex, ...v]));
    } else {
      merged[k] = v;
    }
  }
  return merged;
}

// ============================================================================

const PHASE_ORDER = ["child", "issue", "context", "wrap"];
const PHASE_LABELS = {
  child: "About child",
  issue: "What's going on",
  context: "Where things stand",
  wrap: "Wrapping up",
};

function PhaseBar({ phase }) {
  const idx = PHASE_ORDER.indexOf(phase);
  return (
    <>
      <div className="phase-bar">
        {PHASE_ORDER.map((p, i) => {
          let cls = "phase-seg";
          if (i < idx) cls += " done";
          else if (i === idx) cls += " active";
          return <div key={p} className={cls} />;
        })}
      </div>
      <div className="phase-labels">
        {PHASE_ORDER.map((p, i) => {
          let cls = "phase-label";
          if (i < idx) cls += " done";
          else if (i === idx) cls += " active";
          return (
            <span key={p} className={cls}>
              {PHASE_LABELS[p]}
            </span>
          );
        })}
      </div>
    </>
  );
}

function CapturedIntake({ intake }) {
  const [open, setOpen] = useState(false);
  const keys = Object.keys(intake).filter((k) => {
    const v = intake[k];
    if (v === null || v === undefined) return false;
    if (Array.isArray(v) && v.length === 0) return false;
    if (typeof v === "string" && v.trim() === "") return false;
    return true;
  });

  const formatVal = (v) => {
    if (Array.isArray(v)) return v.join(", ");
    if (typeof v === "boolean") return v ? "yes" : "no";
    return String(v);
  };

  return (
    <div className="intake-panel">
      <div className="intake-head" onClick={() => setOpen((o) => !o)}>
        <span className="intake-title">
          Structured intake captured silently
        </span>
        <span className="intake-count">
          {keys.length} field{keys.length === 1 ? "" : "s"} · {open ? "hide" : "show"}
        </span>
      </div>
      {open && (
        <div className="intake-body">
          {keys.length === 0 ? (
            <p className="intake-empty">
              Nothing captured yet — start the conversation above.
            </p>
          ) : (
            keys.map((k) => (
              <div key={k} className="intake-row">
                <span className="intake-key">{k}:</span>
                <span className="intake-val">{formatVal(intake[k])}</span>
              </div>
            ))
          )}
        </div>
      )}
    </div>
  );
}

function TriageSection({ result, loading }) {
  if (loading) {
    return (
      <div className="stage-block">
        <div className="stage-eyebrow">Reviewing your situation</div>
        <div className="checklist-loading">
          <span className="spinner" style={{ width: 16, height: 16, borderWidth: 2 }} />
          <span>Identifying which kinds of claim your situation fits…</span>
        </div>
      </div>
    );
  }
  if (!result) return null;

  const isColorable = result.claim_assessment === "colorable";
  return (
    <div className="stage-block">
      <div className="stage-eyebrow">What we're seeing</div>
      <h3 className="stage-title">
        {isColorable ? "Yes — this is worth filing." : "Let's narrow it down."}
      </h3>
      <div className="triage-card">
        <p className="triage-summary">{result.summary_for_parent}</p>
        {result.identified_categories?.map((c, i) => (
          <div key={i} className="triage-cat">
            <div className="triage-cat-label">{c.category?.replace(/_/g, " ")}</div>
            <p className="triage-cat-why">{c.why_it_fits_in_plain_language}</p>
            {c.key_facts_from_intake?.length > 0 && (
              <ul style={{ margin: "4px 0 0 16px", color: "var(--ink-muted)", fontSize: 13.5 }}>
                {c.key_facts_from_intake.map((f, j) => (
                  <li key={j}>{f}</li>
                ))}
              </ul>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

function DrafterForm({ values, onChange, onSubmit, onCancel }) {
  const evidenceOptions = [
    { id: "current_iep", label: "Current IEP" },
    { id: "prior_ieps", label: "Prior IEPs" },
    { id: "private_evaluation", label: "Private evaluation" },
    { id: "district_evaluation", label: "District evaluation" },
    { id: "progress_reports", label: "Progress reports" },
    { id: "report_cards", label: "Report cards" },
    { id: "emails", label: "Emails with district" },
    { id: "pwn", label: "Prior written notice from district" },
    { id: "meeting_notes", label: "CSE meeting notes" },
    { id: "provider_letters", label: "Provider/therapist letters" },
    { id: "medical", label: "Medical records" },
  ];

  const set = (k, v) => onChange((prev) => ({ ...prev, [k]: v }));
  const toggleEvidence = (id) =>
    onChange((prev) => ({
      ...prev,
      evidence: prev.evidence.includes(id)
        ? prev.evidence.filter((x) => x !== id)
        : [...prev.evidence, id],
    }));

  const canSubmit =
    values.parentName.trim() &&
    values.parentAddress.trim() &&
    values.studentFullName.trim() &&
    values.districtName.trim() &&
    values.remedy.trim();

  return (
    <div className="stage-block">
      <div className="stage-eyebrow">Last step before drafting</div>
      <h3 className="stage-title">A few formal details.</h3>
      <p className="stage-lede">
        We need these for the caption of the complaint and to spell out exactly
        what you're asking for. P.O. box is fine for the address.
      </p>

      <div className="drafter-form">
        <div className="drafter-section">
          <h4>For the caption</h4>
          <p className="help">Required by NY procedure to identify who is filing on whose behalf.</p>
          <div className="field">
            <label>Your full legal name</label>
            <input value={values.parentName} onChange={(e) => set("parentName", e.target.value)} placeholder="Sarah Goldberg" />
          </div>
          <div className="field">
            <label>Your mailing address</label>
            <input value={values.parentAddress} onChange={(e) => set("parentAddress", e.target.value)} placeholder="123 Main St, New Rochelle, NY 10801" />
          </div>
          <div className="row-2">
            <div className="field">
              <label>Email</label>
              <input type="email" value={values.parentEmail} onChange={(e) => set("parentEmail", e.target.value)} />
            </div>
            <div className="field">
              <label>Phone</label>
              <input value={values.parentPhone} onChange={(e) => set("parentPhone", e.target.value)} />
            </div>
          </div>
          <div className="field">
            <label>Your child's full legal name</label>
            <input value={values.studentFullName} onChange={(e) => set("studentFullName", e.target.value)} />
          </div>
          <div className="row-2">
            <div className="field">
              <label>Your child's date of birth</label>
              <input type="date" value={values.studentDOB} onChange={(e) => set("studentDOB", e.target.value)} />
            </div>
            <div className="field">
              <label>School district</label>
              <input value={values.districtName} onChange={(e) => set("districtName", e.target.value)} placeholder="New Rochelle City School District" />
            </div>
          </div>
        </div>

        <div className="drafter-section">
          <h4>What you're asking for</h4>
          <p className="help">
            Be specific. Examples: "Find Abie eligible for an IEP and provide structured literacy intervention 5x/week." "Reimburse $42,000 in tuition for 2024-25." "Add 2 sessions of individual speech per week."
          </p>
          <div className="field">
            <textarea rows={5} value={values.remedy} onChange={(e) => set("remedy", e.target.value)} />
          </div>
        </div>

        <div className="drafter-section">
          <h4>Have you put concerns in writing to the district?</h4>
          <p className="help">If yes — when, what you said, what they said back. Often important for the complaint.</p>
          <div className="field">
            <textarea rows={4} value={values.priorWritten} onChange={(e) => set("priorWritten", e.target.value)} placeholder="e.g., Emailed CSE chair Jane Smith on 3/15/25 requesting more support. No response. Followed up 4/2/25..." />
          </div>
        </div>

        <div className="drafter-section">
          <h4>Documents you have</h4>
          <p className="help">Pick anything you have — these get listed at the end of the complaint.</p>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
            {evidenceOptions.map((opt) => (
              <button
                key={opt.id}
                type="button"
                onClick={() => toggleEvidence(opt.id)}
                style={{
                  padding: "6px 12px",
                  borderRadius: 999,
                  border: "1px solid var(--border)",
                  background: values.evidence.includes(opt.id) ? "var(--accent)" : "white",
                  color: values.evidence.includes(opt.id) ? "white" : "var(--ink)",
                  cursor: "pointer",
                  fontSize: 13,
                  fontFamily: "inherit",
                }}
              >
                {opt.label}
              </button>
            ))}
          </div>
        </div>

        <div className="drafter-section">
          <h4>Pendency (stay-put)</h4>
          <p className="help">
            Filing usually freezes your child's program in place during the case. If there's a specific program you want treated as "current" — e.g., the last IEP you both agreed on — say so.
          </p>
          <div className="field">
            <select value={values.pendency} onChange={(e) => set("pendency", e.target.value)}>
              <option value="not_asserting">Not asserting anything specific</option>
              <option value="last_agreed_iep">The last IEP we agreed on</option>
              <option value="prior_iho_order">A prior hearing officer order</option>
              <option value="other">Something else</option>
            </select>
          </div>
          {values.pendency !== "not_asserting" && (
            <div className="field">
              <label>Briefly describe</label>
              <textarea rows={3} value={values.pendencyDetails} onChange={(e) => set("pendencyDetails", e.target.value)} />
            </div>
          )}
        </div>

        <div style={{ display: "flex", gap: 10, marginTop: 16 }}>
          <button className="btn btn-primary" onClick={onSubmit} disabled={!canSubmit}>
            Generate the draft
          </button>
          {onCancel && (
            <button className="btn btn-ghost" onClick={onCancel}>
              Cancel
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

function DraftReview({ draft, edited, onEditChange, changelog, checks, onCheckChange, onRegenerate, drafting }) {
  const [editing, setEditing] = useState(false);
  if (drafting) {
    return (
      <div className="stage-block">
        <div className="stage-eyebrow">Drafting your complaint</div>
        <div className="checklist-loading">
          <span className="spinner" style={{ width: 16, height: 16, borderWidth: 2 }} />
          <span>First pass: writing in your voice. Second pass: cleaning up any lawyerly language…</span>
        </div>
      </div>
    );
  }
  if (!draft) return null;

  const finalText = edited != null ? edited : draft;
  const allChecked = checks.accuracy && checks.dates && checks.remedy;

  const downloadText = () => {
    const blob = new Blob([finalText], { type: "text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "due_process_complaint.txt";
    a.click();
    URL.revokeObjectURL(url);
  };
  const copyToClipboard = () => {
    navigator.clipboard.writeText(finalText).then(() => alert("Copied."));
  };

  return (
    <div className="stage-block">
      <div className="stage-eyebrow">Your draft</div>
      <h3 className="stage-title">A draft complaint, in your voice.</h3>
      <p className="stage-lede">
        Read through carefully. Anywhere you see [PARENT TO ADD: …] is a spot
        you need to fill in before filing. Click "Edit directly" to make changes.
      </p>

      {editing ? (
        <div className="draft-paper">
          <textarea
            value={finalText}
            onChange={(e) => onEditChange(e.target.value)}
            autoFocus
          />
        </div>
      ) : (
        <div className="draft-paper">{finalText}</div>
      )}

      <div style={{ display: "flex", gap: 10, marginTop: 12, flexWrap: "wrap" }}>
        <button className="btn btn-ghost" onClick={() => setEditing((e) => !e)}>
          {editing ? "Done editing" : "Edit directly"}
        </button>
        <button className="btn btn-ghost" onClick={onRegenerate}>
          Regenerate draft
        </button>
      </div>

      {changelog && changelog.length > 0 && (
        <div className="changelog">
          <p className="changelog-title">What we cleaned up in the second pass</p>
          {changelog.map((c, i) => (
            <div key={i} className="changelog-item">
              <span>{c}</span>
            </div>
          ))}
        </div>
      )}

      <div className="review-checks">
        <h4 style={{ fontFamily: "Fraunces, serif", fontWeight: 500, fontSize: 16, margin: "0 0 4px" }}>
          Before you file — final check
        </h4>
        <p style={{ fontSize: 13, color: "var(--ink-soft)", margin: "0 0 10px" }}>
          Once filed, this becomes part of a real legal proceeding. Confirm each.
        </p>
        <label className="review-check">
          <input type="checkbox" checked={checks.accuracy} onChange={(e) => onCheckChange("accuracy", e.target.checked)} />
          <span className="review-check-body">
            <strong>I read every paragraph.</strong> Everything accurately describes what's happened. Nothing was invented or misstated.
          </span>
        </label>
        <label className="review-check">
          <input type="checkbox" checked={checks.dates} onChange={(e) => onCheckChange("dates", e.target.checked)} />
          <span className="review-check-body">
            <strong>Dates and numbers are correct.</strong> IEP dates, meeting dates, service amounts, dollar figures — I checked them.
          </span>
        </label>
        <label className="review-check">
          <input type="checkbox" checked={checks.remedy} onChange={(e) => onCheckChange("remedy", e.target.checked)} />
          <span className="review-check-body">
            <strong>The remedy section says what I actually want.</strong>
          </span>
        </label>
      </div>

      {allChecked && (
        <div className="ready-card">
          <h4>Ready. Here's what to do next.</h4>
          <p>
            Download or copy the draft. File it by sending to the district AND
            to NYSED's Office of Special Education at the same time. Most NY
            districts accept email or mail — check your district's procedure.
            NYC DOE has its own filing portal (Impartial Hearing Office).
          </p>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            <button className="btn btn-primary" onClick={downloadText}>Download as .txt</button>
            <button className="btn btn-ghost" onClick={copyToClipboard}>Copy to clipboard</button>
          </div>
        </div>
      )}
    </div>
  );
}

function LetterFieldsForm({ values, onChange, onSubmit, neededFor, childFirstName }) {
  const set = (k, v) => onChange((p) => ({ ...p, [k]: v }));
  const canSubmit = values.parent_full_name.trim() && values.child_full_name.trim();

  // Pre-fill child's full name field with first name from intake if blank
  useEffect(() => {
    if (childFirstName && !values.child_full_name) {
      set("child_full_name", childFirstName + " ");
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [childFirstName]);

  const labelList = neededFor.map((id) => OUTPUT_LIBRARY[id]?.label).filter(Boolean).join(", ");

  return (
    <div className="letter-fields-card">
      <h4>One last thing — full legal names for the letterhead</h4>
      <p className="help">
        I have {childFirstName || "your child"}'s first name from our chat, but for letters that get sent to the district, I want to make sure I have full legal names — both yours and {childFirstName ? childFirstName + "'s" : "your child's"}. This is the only piece I'll need that wasn't covered above.
      </p>
      <p className="help" style={{ marginTop: -8 }}>
        For: {labelList}.
      </p>
      <div className="field">
        <label>Your full legal name</label>
        <input
          value={values.parent_full_name}
          onChange={(e) => set("parent_full_name", e.target.value)}
          placeholder="e.g., Sarah Goldberg"
        />
      </div>
      <div className="field">
        <label>{childFirstName ? childFirstName + "'s full legal name" : "Your child's full legal name"}</label>
        <input
          value={values.child_full_name}
          onChange={(e) => set("child_full_name", e.target.value)}
          placeholder={childFirstName ? `${childFirstName} Goldberg` : "e.g., Jacob Goldberg"}
        />
      </div>
      <button className="btn btn-primary" onClick={onSubmit} disabled={!canSubmit}>
        Generate the documents
      </button>
    </div>
  );
}

function OutputCard({ id, def, content, loading, onRegenerate }) {
  const [open, setOpen] = useState(true);
  const [editingText, setEditingText] = useState(null);
  const [editing, setEditing] = useState(false);

  const isError = content && typeof content === "object" && content.error;
  const isLetter = ["ten_day_notice", "iee_request", "evaluation_request", "cse_followup", "iep_rejection", "records_request"].includes(id);
  const isSummary = id === "claim_summary";
  const isChecklist = id === "document_checklist";
  const isActions = id === "action_recommendations";

  let status = "loading";
  let statusText = "preparing";
  if (isError) { status = "error"; statusText = "error"; }
  else if (content) { status = "ready"; statusText = "ready"; }

  const currentText = editingText != null ? editingText : (typeof content === "string" ? content : "");

  const downloadText = () => {
    const blob = new Blob([currentText], { type: "text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${id}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  };
  const copyText = () => {
    navigator.clipboard.writeText(currentText).then(() => alert("Copied."));
  };

  return (
    <div className="output-card">
      <div className="output-head" onClick={() => setOpen((o) => !o)}>
        <div className="output-head-text">
          <p className="output-label">{def.label}</p>
          <p className="output-short">{def.short}</p>
        </div>
        <span className={`output-status ${status}`}>{statusText}</span>
        <span className={`output-chevron ${open ? "open" : ""}`}>▾</span>
      </div>

      {open && (
        <div className="output-body">
          {loading && (
            <div className="checklist-loading" style={{ marginTop: 0 }}>
              <span className="spinner" style={{ width: 14, height: 14, borderWidth: 2 }} />
              <span>Drafting…</span>
            </div>
          )}

          {isError && (
            <div style={{ color: "var(--warn-deep)", fontSize: 14 }}>
              {content.error}
              <button
                className="output-action-btn"
                style={{ marginLeft: 12 }}
                onClick={() => onRegenerate(id)}
              >
                Try again
              </button>
            </div>
          )}

          {!loading && !isError && content && (
            <>
              {(isLetter || isSummary) && (
                <>
                  {editing ? (
                    <div className="output-letter">
                      <textarea
                        value={currentText}
                        onChange={(e) => setEditingText(e.target.value)}
                        autoFocus
                      />
                    </div>
                  ) : (
                    <div className={isLetter ? "output-letter" : "output-summary"}>
                      {currentText}
                    </div>
                  )}
                  <div className="output-actions">
                    <button
                      className="output-action-btn"
                      onClick={() => setEditing((e) => !e)}
                    >
                      {editing ? "Done editing" : "Edit"}
                    </button>
                    <button className="output-action-btn primary" onClick={downloadText}>
                      Download
                    </button>
                    <button className="output-action-btn" onClick={copyText}>
                      Copy
                    </button>
                    <button className="output-action-btn" onClick={() => onRegenerate(id)}>
                      Regenerate
                    </button>
                  </div>
                </>
              )}

              {isChecklist && content.groups && (
                <>
                  {content.intro && (
                    <p style={{ margin: "0 0 14px", color: "var(--ink-muted)", fontSize: 14 }}>
                      {content.intro}
                    </p>
                  )}
                  {content.groups.map((g, gi) => (
                    <div key={gi} style={{ marginBottom: 14 }}>
                      <h4 style={{ fontFamily: "Fraunces, serif", fontWeight: 500, fontSize: 14, margin: "0 0 4px" }}>
                        {g.title}
                      </h4>
                      {g.description && (
                        <p style={{ fontSize: 12.5, color: "var(--ink-soft)", margin: "0 0 8px", fontStyle: "italic" }}>
                          {g.description}
                        </p>
                      )}
                      <ul style={{ margin: 0, paddingLeft: 18, fontSize: 14, color: "var(--ink)" }}>
                        {g.items?.map((it) => (
                          <li key={it.id} style={{ marginBottom: 6, color: it.already_have ? "var(--ink-soft)" : "var(--ink)" }}>
                            <strong style={{ fontWeight: 500 }}>
                              {it.already_have ? "✓ " : ""}{it.label}
                            </strong>
                            {it.why && (
                              <div style={{ fontSize: 13, color: "var(--ink-muted)", marginTop: 2 }}>
                                {it.why}
                              </div>
                            )}
                          </li>
                        ))}
                      </ul>
                    </div>
                  ))}
                </>
              )}

              {isActions && content.actions && (
                <>
                  {content.intro && (
                    <p style={{ margin: "0 0 14px", color: "var(--ink-muted)", fontSize: 14 }}>
                      {content.intro}
                    </p>
                  )}

  );

function Checklist({ data, checked, onToggle, loading }) {
  if (loading) {
    return (
      <div className="checklist-loading">
        <span className="spinner" style={{ width: 16, height: 16, borderWidth: 2 }} />
        <span>Putting together a personalized document checklist for your case…</span>
      </div>
    );
  }
  if (!data || !data.groups) return null;

  const allItems = data.groups.flatMap((g) => g.items || []);
  const totalCount = allItems.length;
  const haveCount = allItems.filter(
    (it) => it.already_have || checked[it.id]
  ).length;

  return (
    <div className="checklist">
      <div className="checklist-head">
        <h3 className="checklist-title">Documents to gather</h3>
        <span className="checklist-progress">
          {haveCount} of {totalCount} ready
        </span>
      </div>
      {data.intro && <p className="checklist-intro">{data.intro}</p>}
      {data.groups.map((g, gi) => (
        <div key={gi} className="checklist-group">
          <h4>{g.title}</h4>
          {g.description && <p className="checklist-group-desc">{g.description}</p>}
          {g.items?.map((it) => {
            const isChecked = it.already_have || !!checked[it.id];
            return (
              <label
                key={it.id}
                className={`checklist-item ${isChecked ? "checked" : ""}`}
              >
                <input
                  type="checkbox"
                  checked={isChecked}
                  onChange={() => onToggle(it.id, !isChecked)}
                />
                <div className="checklist-item-body">
                  <div className="checklist-item-label">{it.label}</div>
                  {it.why && <div className="checklist-item-why">{it.why}</div>}
                </div>
              </label>
            );
          })}
        </div>
      ))}
    </div>
  );
}
