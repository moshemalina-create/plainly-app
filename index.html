    throw new Error(`API ${response.status}: ${err.slice(0, 200)}`);
  }
  const data = await response.json();
  const text = data.content
    .filter((b) => b.type === "text")
    .map((b) => b.text)
    .join("\n");
  if (!text || !text.trim()) {
    throw new Error("Empty response from model");
  }
  return text.trim();
}

// Read a File into a base64 string (for sending PDFs to Claude as document blocks)
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result;
      // result is a data URL like "data:application/pdf;base64,XXXX"
      const base64 = result.split(",")[1];
      resolve(base64);
    };
    reader.onerror = () => reject(new Error("Failed to read file"));
    reader.readAsDataURL(file);
  });
}

// Extract plain text from a PDF entirely in the browser using PDF.js. This
// keeps the heavy PDF parsing off the server, so it doesn't count against the
// Netlify function timeout.
//
// Returns { text, pageCount, hadTextLayer, perPageChars, issues } where
// `issues` flags structural problems that often produce jumbled or partial
// text (multi-column layouts, rotated pages, scanned pages mixed in with
// typed ones). Callers should decide whether to surface those as a hard
// error rather than feed bad text into the model — see pdfQualityBlocker
// below for the heuristics, and processIEP for how they map to user-facing
// messages.
async function extractPdfText(file) {
  if (!window.pdfjsLib) {
    throw new Error("PDF reader didn't load. Refresh the page and try again.");
  }
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const pageCount = pdf.numPages;

  // Gather a structural snapshot per page so detection can run as a pure
  // function on plain data (and so it's testable from Node without PDF.js).
  const pages = [];
  for (let pageNum = 1; pageNum <= pageCount; pageNum++) {
    const page = await pdf.getPage(pageNum);
    const content = await page.getTextContent();
    pages.push({
      rotate: typeof page.rotate === "number" ? page.rotate : 0,
      items: content.items.map((i) => ({
        str: i.str || "",
        x: i.transform ? i.transform[4] : null,
        y: i.transform ? i.transform[5] : null,
      })),
    });
  }

  return analyzePdfPages(pages);
}

// Pure function: takes an array of { rotate, items: [{str, x, y}] } and
// returns the reconstructed text plus per-page char counts and structural
// issues. Pulled out of extractPdfText so it can be unit-tested without
// PDF.js — see test-fixtures/verify-detection.js.
function analyzePdfPages(pages) {
  const pageCount = pages.length;
  const perPageChars = [];
  const perPageText = [];
  const issues = {
    scannedPages: [],     // pages with almost no extractable text
    rotatedPages: [],     // pages whose PDF rotation is non-zero
    multiColumnPages: [], // pages whose line-start X positions look bimodal
  };
  let totalChars = 0;

  for (let i = 0; i < pageCount; i++) {
    const { rotate, items } = pages[i];
    const pageNum = i + 1;

    if (rotate && rotate !== 0) {
      issues.rotatedPages.push(pageNum);
    }

    // Reconstruct lines using item Y positions, same heuristic as before.
    // Also record where each line starts (X of first item) for the multi-
    // column check below.
    let lastY = null;
    let pageText = "";
    const lineStartXs = [];
    let lineHasContent = false;
    for (const item of items) {
      if (!item.str) continue;
      const y = item.y;
      const x = item.x;
      const isNewLine = lastY !== null && y !== null && Math.abs(y - lastY) > 2;
      if (isNewLine) {
        pageText += "\n";
        lineHasContent = false;
      }
      if (!lineHasContent && x !== null && item.str.trim().length > 0) {
        lineStartXs.push(x);
        lineHasContent = true;
      }
      pageText += item.str + " ";
      lastY = y;
    }
    const trimmed = pageText.trim();
    perPageText.push(trimmed);
    perPageChars.push(trimmed.length);
    totalChars += trimmed.length;

    if (trimmed.length < 30) {
      issues.scannedPages.push(pageNum);
    }

    if (looksMultiColumn(lineStartXs)) {
      issues.multiColumnPages.push(pageNum);
    }
  }

  const fullText = perPageText
    .map((t, i) => "\n\n--- Page " + (i + 1) + " ---\n" + t)
    .join("")
    .trim();

  // If almost no text came out across the whole PDF, it's likely image-only.
  const hadTextLayer = totalChars > 80;

  return { text: fullText, pageCount, hadTextLayer, perPageChars, issues };
}

// Bimodal line-start X positions suggest a multi-column layout: lots of
// lines start near the left edge AND lots start near the middle/right, with
// few in between. Tables don't trigger this because every table row's first
// item is still in the leftmost column. Requires at least 10 lines to fire
// (very short pages aren't reliable).
function looksMultiColumn(lineStartXs) {
  if (lineStartXs.length < 10) return false;
  let minX = Infinity, maxX = -Infinity;
  for (const x of lineStartXs) {
    if (x < minX) minX = x;
    if (x > maxX) maxX = x;
  }
  const range = maxX - minX;
  if (range < 100) return false; // line starts all clustered in one column

  // Bin into 5 horizontal slices; multi-column shows up as mass at the
  // left AND somewhere right-of-center, with the middle largely empty.
  const bins = [0, 0, 0, 0, 0];
  for (const x of lineStartXs) {
    let idx = Math.floor(((x - minX) / range) * 5);
    if (idx > 4) idx = 4;
    bins[idx]++;
  }
  const total = lineStartXs.length;
  const leftHeavy = bins[0] > total * 0.2;
  const rightHeavy = bins[3] + bins[4] > total * 0.2;
  const middleLight = bins[2] < total * 0.1;
  return leftHeavy && rightHeavy && middleLight;
}

// Decides whether the structural issues from analyzePdfPages are severe
// enough to refuse the extraction and tell the parent. Returns null if
// the PDF looks OK to send to the model, or a parent-friendly string if
// we should stop.
//
// Design note: per the project priority, a parent who gets no result is
// far better off than a parent who gets a confidently wrong result. So
// the thresholds here are intentionally cautious — false positives ("I
// can't read this, please paste the key parts") are acceptable; false
// negatives (feeding garbled text into Haiku and presenting the output
// as a real review) are not.
function pdfQualityBlocker(extractionResult) {
  const { pageCount, issues } = extractionResult;
  if (pageCount === 0) return null;

  const lines = [];

  // Mixed scanned/typed: even one fully-empty page in the middle of a
  // typed IEP means the parent is missing whatever was on that page.
  if (issues.scannedPages.length > 0) {
    const fraction = issues.scannedPages.length / pageCount;
    // A 1-page header/title page with no text isn't worth blocking on.
    // More than ~15% of pages, or 2+ pages on a short IEP, is.
    if (fraction > 0.15 || issues.scannedPages.length >= 2) {
      lines.push(
        issues.scannedPages.length +
          " of " +
          pageCount +
          " pages had no readable text (" +
          describePageList(issues.scannedPages) +
          ") — those pages are likely scans or images, and I'd have to skip them entirely."
      );
    }
  }

  if (issues.rotatedPages.length > 0) {
    lines.push(
      issues.rotatedPages.length +
        " page(s) are rotated (" +
        describePageList(issues.rotatedPages) +
        ") — text on rotated pages often comes out in the wrong order."
    );
  }

  // Multi-column is only a blocker if a meaningful fraction of pages look
  // that way — a single multi-column cover sheet on a 30-page IEP isn't
  // worth refusing over.
  if (issues.multiColumnPages.length > 0) {
    const fraction = issues.multiColumnPages.length / pageCount;
    if (fraction > 0.3) {
      lines.push(
        "Most pages (" +
          describePageList(issues.multiColumnPages) +
          ") use a multi-column layout, which I can't reliably read in order — the text often comes out jumbled."
      );
    }
  }

  if (lines.length === 0) return null;

  return (
    "I'm worried I'd misread this IEP rather than give you nothing:\n\n• " +
    lines.join("\n• ") +
    "\n\nRather than risk a confidently wrong analysis, I'd rather you tell me about the IEP in the chat — services, goals, classification, placement — and I'll work from that."
  );
}

// Compact "1, 2, 4-7, 10" formatting for a sorted list of page numbers.
function describePageList(pages) {
  if (!pages || pages.length === 0) return "";
  const sorted = [...pages].sort((a, b) => a - b);
  const ranges = [];
  let start = sorted[0];
  let prev = sorted[0];
  for (let i = 1; i < sorted.length; i++) {
    const n = sorted[i];
    if (n === prev + 1) {
      prev = n;
      continue;
    }
    ranges.push(start === prev ? String(start) : start + "-" + prev);
    start = n;
    prev = n;
  }
  ranges.push(start === prev ? String(start) : start + "-" + prev);
  return "page" + (sorted.length === 1 ? " " : "s ") + ranges.join(", ");
}

// Walk the text tracking string state and brace depth to find a complete,
// balanced JSON object. Much more robust than first-{ to last-} slicing.
function extractBalancedJSON(text) {
  const start = text.indexOf("{");
  if (start === -1) return null;
  let depth = 0;
  let inString = false;
  let escape = false;
  for (let i = start; i < text.length; i++) {
    const c = text[i];
    if (escape) { escape = false; continue; }
    if (c === "\\") { escape = true; continue; }
    if (c === '"') { inString = !inString; continue; }
    if (inString) continue;
    if (c === "{") depth++;
    else if (c === "}") {
      depth--;
      if (depth === 0) return text.slice(start, i + 1);
    }
  }
  return null;
}

function parseJSON(text) {
  if (!text) throw new Error("Empty response");
  // Try direct parse first
  try { return JSON.parse(text); } catch {}
  // Try code-fenced
  const fenced = text.match(/```(?:json)?\s*([\s\S]*?)\s*```/);
  if (fenced) {
    try { return JSON.parse(fenced[1]); } catch {}
  }
  // Try brace-balanced extraction (handles prose around JSON, nested objects, etc.)
  const balanced = extractBalancedJSON(text);
  if (balanced) {
    try { return JSON.parse(balanced); } catch {}
  }
  // Last-ditch: try to recover at least chat_reply via regex so the user sees something
  const replyMatch = text.match(/"chat_reply"\s*:\s*"((?:[^"\\]|\\.)*)"/);
  if (replyMatch) {
    return {
      chat_reply: replyMatch[1].replace(/\\n/g, "\n").replace(/\\"/g, '"'),
      _partial: true,
    };
  }
  throw new Error("Could not parse JSON from model response");
}

function mergeIntake(current, updates) {
  if (!updates) return current;
  const merged = { ...current };
  for (const [k, v] of Object.entries(updates)) {
    if (v === null || v === undefined) continue;
    if (Array.isArray(v)) {
      const ex = Array.isArray(merged[k]) ? merged[k] : [];
      merged[k] = Array.from(new Set([...ex, ...v]));
    } else if (v && typeof v === "object") {
      // Nested objects (e.g. key_dates) merge field-by-field so a turn that
      // updates one sub-field doesn't clobber the others.
      const ex = merged[k] && typeof merged[k] === "object" && !Array.isArray(merged[k]) ? merged[k] : {};
      merged[k] = mergeIntake(ex, v);
    } else {
      merged[k] = v;
    }
  }
  return merged;
}

// Render attached documents into the block we append to the chat system prompt.
// Applies the per-document and total character caps; when a document is cut, it
// gets a marker the model is told to act on (ask the parent to point at the
// missing section). Returns "" when there are no documents.
function formatDocsForPrompt(docs) {
  if (!docs || docs.length === 0) return "";
  let total = 0;
  const blocks = docs.map((d) => {
    let text = d.text || "";
    let truncated = false;
    if (text.length > DOC_CHAR_CAP) {
      text = text.slice(0, DOC_CHAR_CAP);
      truncated = true;
    }
    if (total + text.length > DOC_TOTAL_CHAR_CAP) {
      text = text.slice(0, Math.max(0, DOC_TOTAL_CHAR_CAP - total));
      truncated = true;
    }
    total += text.length;
    const marker = truncated
      ? " [truncated — tell the parent you've read most of it and ask them to point you to a specific section if you need more]"
      : "";
    return `Document: ${d.name}${marker}\n${text}`;
  });
  return blocks.join("\n\n");
}

// ============================================================================
// STEP 3 — docs_reviewed ledger (shallow headlines of uploaded documents)
// ============================================================================
// PRIVACY INVARIANT: the raw upload text is NEVER written to Supabase. It lives
// only in the in-tab `uploadedDocs` state for the active session (powering the
// live chat) and dies with the tab. ONLY the shallow headline below reaches the
// server. "Discard the raw file" = we simply never persist it. See
// docs/accounts-persistence.md Section 7.
//
// Both helpers are module-level (no React deps beyond the global `sb`) so the
// deferred Step 5 anonymous->account upgrade can replay them over the in-tab
// docs at save time.

// Generate the shallow headline for one uploaded document. Returns a ledger
// entry, or null on any failure — a failed headline must never block the chat
// or fabricate detail.
async function extractHeadlineForDoc(filename, text) {
  if (!text || !text.trim()) return null;
  try {
    const h = await callClaudeForJSON(
      HEADLINE_EXTRACT_PROMPT,
      "Produce the shallow headline for this document. Return only the JSON object.\n\n" +
        text.slice(0, DOC_CHAR_CAP)
    );
    return {
      filename,
      date_reviewed: new Date().toISOString().slice(0, 10),
      doc_type: (h && h.doc_type) || "Document",
      date_conducted: (h && h.date_conducted) || null,
      source: (h && h.source) || null,
      headline_extraction: (h && h.headline_findings) || "",
    };
  } catch (e) {
    return null;
  }
}

// Append one headline entry to this user's docs_reviewed ledger (read-merge-
// write, under the user's own RLS-scoped session). De-dupes on filename so
// re-attaching the same file replaces rather than piles up. Auth is the
// caller's responsibility; this is silent-on-failure (the ledger is a
// convenience and must never block the chat).
async function appendDocReviewed(userId, entry) {
  if (!sb || !userId || !entry) return;
  try {
    const { data } = await sb.from("cases")
      .select("docs_reviewed")
      .eq("user_id", userId)
      .maybeSingle();
    const existing = data && Array.isArray(data.docs_reviewed) ? data.docs_reviewed : [];
    const merged = existing.filter((d) => d.filename !== entry.filename).concat([entry]);
    await sb.from("cases").upsert(
      { user_id: userId, docs_reviewed: merged, updated_at: new Date().toISOString() },
      { onConflict: "user_id" }
    );
  } catch (e) {
    /* silent — never blocks the chat */
  }
}

// Normalize typographic characters to ASCII for the PDF only. jsPDF's standard
// fonts are WinAnsi-encoded and render em-dashes / curly quotes / ellipses as
// garbage. We do this ONLY for the string handed to jsPDF — on-screen text and
// the Copy action keep the original smart punctuation.
function normalizeForPdf(text) {
  return String(text)
    .replace(/\r\n/g, "\n")
    .replace(/[‘’‚‛]/g, "'")
    .replace(/[“”„‟]/g, '"')
    .replace(/[–—―]/g, "-")
    .replace(/…/g, "...")
    .replace(/ /g, " ")
    .replace(/•/g, "*");
}

// Build a clean, plain business-letter jsPDF doc from text. No branding — this
// is the parent's document. Preserves the source's line breaks (address blocks,
// signature blocks) and wraps long lines, paginating as needed. Returns the
// jsPDF doc, or null if jsPDF failed to load. Shared by the on-screen download
// and the Step 3 bucket-storage path, so the stored file is byte-identical to
// what the parent downloads.
function buildPdfDoc(text) {
  const JsPDF = window.jspdf && window.jspdf.jsPDF;
  if (!JsPDF) return null;
  const doc = new JsPDF({ unit: "pt", format: "letter" });
  const margin = 72; // 1 inch
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const maxWidth = pageWidth - margin * 2;
  const fontSize = 11;
  const lineHeight = fontSize * 1.45;
  doc.setFont("times", "normal");
  doc.setFontSize(fontSize);
  const sourceLines = normalizeForPdf(text).split("\n");
  let y = margin;
  for (const srcLine of sourceLines) {
    const wrapped = srcLine.length ? doc.splitTextToSize(srcLine, maxWidth) : [""];
    for (const wline of wrapped) {
      if (y + lineHeight > pageHeight - margin) {
        doc.addPage();
        y = margin;
      }
      doc.text(wline, margin, y);
      y += lineHeight;
    }
  }
  return doc;
}

// Generate and download the PDF. Returns the rendered PDF Blob (so callers can
// also persist the exact same bytes), or null if jsPDF was unavailable (in
// which case we fall back to copying the text to the clipboard).
function downloadPdf(text, filename) {
  const doc = buildPdfDoc(text);
  if (!doc) {
    try { navigator.clipboard.writeText(text); } catch (e) {}
    alert("PDF export isn't available right now — I've copied the text to your clipboard instead, so you can paste it into a document or email.");
    return null;
  }
  doc.save(filename);
  return doc.output("blob");
}

// Render a PDF Blob from text without triggering a download (used to store a
// generated document at generation time). Returns null if jsPDF is unavailable.
function pdfBlobFromText(text) {
  const doc = buildPdfDoc(text);
  return doc ? doc.output("blob") : null;
}

// ============================================================================
// STEP 3 — generated-doc storage (private per-user bucket)
// ============================================================================
// Store a generated document (complaint, letter) as a PDF Blob in the private
// 'generated-docs' bucket, under the user's own uid folder so the storage RLS
// policies scope it to them (the storage twin of the table RLS — see
// supabase/storage.sql). These ARE sensitive (a complaint quotes the child's
// classification and services); data-minimization does not make them
// non-sensitive, so they get the same per-user protection as everything else.
//
// upsert by stable filename: regenerating a doc overwrites the prior version
// rather than spawning orphans. Auth is the caller's responsibility; silent on
// failure (the on-screen download still works regardless). Module-level so the
// deferred Step 5 upgrade path can replay it over in-tab generated docs.
async function saveGeneratedDoc(userId, filename, blob) {
  if (!sb || !blob) return;
  // A generated doc must ALWAYS nest under the user's own uid folder — the
  // storage RLS policies key on (storage.foldername(name))[1] = auth.uid()::text,
  // so a root-level object (no uid segment) falls OUTSIDE the per-user
  // protection. Refuse to write anything that wouldn't nest under "<uid>/".
  const uid = typeof userId === "string" ? userId.trim().replace(/^\/+|\/+$/g, "") : "";
  const name = typeof filename === "string" ? filename.trim().replace(/^\/+/, "") : "";
  if (!uid || !name || name.indexOf("/") !== -1) return; // no uid, no name, or a path-bearing name
  const path = `${uid}/${name}`;
  // Belt-and-suspenders: the first path segment MUST be the uid folder, or we
  // don't write at all (never the bucket root).
  if (path.split("/")[0] !== uid) return;
  try {
    await sb.storage.from("generated-docs").upload(path, blob, {
      contentType: "application/pdf",
      upsert: true,
    });
  } catch (e) {
    /* silent — local download is unaffected */
  }
}

// PRESERVED — the "What we're seeing" verdict panel. Not mounted in the chat
// flow as of clean-output-handoff; reserved with TRIAGE_PROMPT for the future
// "Quick IEP assessment" entry point. See CLAUDE.md. Do not delete as dead code.
function TriageSection({ result, loading }) {
  if (loading) {
    return (
      <div className="stage-block">
        <div className="stage-eyebrow">Reviewing your situation</div>
        <div className="checklist-loading">
          <span className="spinner" style={{ width: 16, height: 16, borderWidth: 2 }} />
          <span>Identifying which kinds of claim your situation fits…</span>
        </div>
      </div>
    );
  }
  if (!result) return null;

  const isColorable = result.claim_assessment === "colorable";
  return (
    <div className="stage-block">
      <div className="stage-eyebrow">What we're seeing</div>
      <h3 className="stage-title">
        {isColorable ? "Yes — this is worth filing." : "Let's narrow it down."}
      </h3>
      <div className="triage-card">
        <p className="triage-summary">{result.summary_for_parent}</p>
        {result.identified_categories?.map((c, i) => (
          <div key={i} className="triage-cat">
            <div className="triage-cat-label">{c.category?.replace(/_/g, " ")}</div>
            <p className="triage-cat-why">{c.why_it_fits_in_plain_language}</p>
            {c.key_facts_from_intake?.length > 0 && (
              <ul style={{ margin: "4px 0 0 16px", color: "var(--ink-muted)", fontSize: 13.5 }}>
                {c.key_facts_from_intake.map((f, j) => (
                  <li key={j}>{f}</li>
                ))}
              </ul>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

function DraftReview({ draft, edited, onEditChange, checks, onCheckChange, onRegenerate, drafting, onSavePdf }) {
  const [editing, setEditing] = useState(false);
  if (drafting) {
    return (
      <div className="stage-block">
        <div className="stage-eyebrow">Drafting your complaint</div>
        <div className="checklist-loading">
          <span className="spinner" style={{ width: 16, height: 16, borderWidth: 2 }} />
          <span>Drafting your complaint…</span>
        </div>
      </div>
    );
  }
  if (!draft) return null;

  const finalText = edited != null ? edited : draft;
  const allChecked = checks.accuracy && checks.dates && checks.remedy;

  const downloadAsPdf = () => {
    const blob = downloadPdf(finalText, "due-process-complaint.pdf");
    if (blob && onSavePdf) onSavePdf(blob, "due-process-complaint.pdf");
  };
  const copyToClipboard = () => {
    navigator.clipboard.writeText(finalText).then(() => alert("Copied."));
  };

  return (
    <div className="stage-block">
      <div className="stage-eyebrow">Your draft</div>
      <h3 className="stage-title">A draft complaint, in your voice.</h3>
      <p className="stage-lede">
        Read through carefully. Anywhere you see [PARENT TO ADD: …] is a spot
        you need to fill in before filing. Click "Edit directly" to make changes.
      </p>
      <p className="help">
        Please review this draft and make sure it is accurate and covers what you
        want to achieve. If the tone or approach sounds off to you, let me know and
        I can revise.
      </p>

      <div className="filing-help">
        <strong>Once it's ready, here's how to send it in:</strong>{" "}
        <a href="/how-to-file/" target="_blank" rel="noopener">
          How to file your complaint →
        </a>
      </div>

      {editing ? (
        <div className="draft-paper">
          <textarea
            value={finalText}
            onChange={(e) => onEditChange(e.target.value)}
            autoFocus
          />
        </div>
      ) : (
        <div className="draft-paper">{finalText}</div>
      )}

      <div style={{ display: "flex", gap: 10, marginTop: 12, flexWrap: "wrap" }}>
        <button className="btn btn-ghost" onClick={() => setEditing((e) => !e)}>
          {editing ? "Done editing" : "Edit directly"}
        </button>
        <button className="btn btn-ghost" onClick={onRegenerate}>
          Regenerate draft
        </button>
      </div>

      <div className="review-checks">
        <h4 style={{ fontFamily: "Fraunces, serif", fontWeight: 500, fontSize: 16, margin: "0 0 4px" }}>
          Before you file — final check
        </h4>
        <p style={{ fontSize: 13, color: "var(--ink-soft)", margin: "0 0 10px" }}>
          Once filed, this becomes part of a real legal proceeding. Confirm each.
        </p>
        <label className="review-check">
          <input type="checkbox" checked={checks.accuracy} onChange={(e) => onCheckChange("accuracy", e.target.checked)} />
          <span className="review-check-body">
            <strong>I read every paragraph.</strong> Everything accurately describes what's happened. Nothing was invented or misstated.
          </span>
        </label>
        <label className="review-check">
          <input type="checkbox" checked={checks.dates} onChange={(e) => onCheckChange("dates", e.target.checked)} />
          <span className="review-check-body">
            <strong>Dates and numbers are correct.</strong> IEP dates, meeting dates, service amounts, dollar figures — I checked them.
          </span>
        </label>
        <label className="review-check">
          <input type="checkbox" checked={checks.remedy} onChange={(e) => onCheckChange("remedy", e.target.checked)} />
          <span className="review-check-body">
            <strong>The remedy section says what I actually want.</strong>
          </span>
        </label>
      </div>

      {allChecked && (
        <div className="ready-card">
          <h4>Ready. Here's what to do next.</h4>
          <p>
            Download or copy the draft, then attach it to the official NYSED
            cover form and mail it — the original to your school district and one
            copy to NYSED — by certified mail, and keep a copy for yourself. The
            full steps are here:{" "}
            <a href="/how-to-file/" target="_blank" rel="noopener">How to file your complaint</a>.
          </p>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            <button className="btn btn-primary" onClick={downloadAsPdf}>Download PDF</button>
            <button className="btn btn-ghost" onClick={copyToClipboard}>Copy to clipboard</button>
          </div>
        </div>
      )}
    </div>
  );
}

// Exact-spelling identity inputs. These are the only things collected by a form;
// every substantive fact lives in the chat-gathered intake.
const FORMAL_FIELD_DEFS = {
  parent_full_name: { label: "Your full legal name", placeholder: "e.g., Sarah Goldberg" },
  parent_address: { label: "Your mailing address", placeholder: "123 Main St, New Rochelle, NY 10801" },
  parent_email: { label: "Email", type: "email" },
  parent_phone: { label: "Phone" },
  child_full_name: { label: "Your child's full legal name", placeholder: "e.g., Jacob Goldberg" },
  child_dob: { label: "Your child's date of birth", type: "date" },
};

// One form for both the lighter letters (two names) and the full complaint (the
// full signature-block set). mode="letters" | "complaint" selects the field set,
// the required subset, and the framing copy. Writes into the shared formalFields
// store, so a name typed for a letter pre-populates the complaint and vice versa.
function FormalFieldsForm({ values, onChange, onSubmit, onCancel, mode, neededFor, childFirstName }) {
  const set = (k, v) => onChange((p) => ({ ...p, [k]: v }));

  const fields = mode === "complaint"
    ? ["parent_full_name", "parent_address", "parent_email", "parent_phone", "child_full_name", "child_dob"]
    : ["parent_full_name", "child_full_name"];
  const required = mode === "complaint"
    ? ["parent_full_name", "parent_address", "child_full_name"]
    : ["parent_full_name", "child_full_name"];
  const canSubmit = required.every((k) => (values[k] || "").trim());

  // Pre-fill child's full name with the first name from chat, if blank.
  useEffect(() => {
    if (childFirstName && !values.child_full_name) set("child_full_name", childFirstName + " ");
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [childFirstName]);

  const renderField = (k) => {
    const def = FORMAL_FIELD_DEFS[k];
    let label = def.label;
    let placeholder = def.placeholder;
    if (k === "child_full_name" && childFirstName) {
      label = childFirstName + "'s full legal name";
      placeholder = `${childFirstName} Goldberg`;
    }
    if (k === "child_dob" && childFirstName) label = childFirstName + "'s date of birth";
    return (
      <div className="field" key={k}>
        <label>{label}</label>
        <input
          type={def.type || "text"}
          value={values[k] || ""}
          onChange={(e) => set(k, e.target.value)}
          placeholder={placeholder}
        />
      </div>
    );
  };

  if (mode === "complaint") {
    return (
      <div className="stage-block">
        <div className="stage-eyebrow">Last step before drafting</div>
        <h3 className="stage-title">A few formal details.</h3>
        <p className="stage-lede">
          We need these for the caption and signature block of the complaint —
          the exact names and contact details that go on a filed document. The
          remedy and everything else we've already worked out in the chat. P.O.
          box is fine for the address.
        </p>
        <div className="drafter-form">
          <div className="drafter-section">
            <h4>For the caption and signature</h4>
            <p className="help">Required by NY procedure to identify who is filing on whose behalf.</p>
            {fields.map(renderField)}
          </div>
          <div style={{ display: "flex", gap: 10, marginTop: 16 }}>
            <button className="btn btn-primary" onClick={onSubmit} disabled={!canSubmit}>
              Generate the draft
            </button>
            {onCancel && (
              <button className="btn btn-ghost" onClick={onCancel}>Cancel</button>
            )}
          </div>
        </div>
      </div>
    );
  }

  const labelList = (neededFor || []).map((id) => OUTPUT_LIBRARY[id]?.label).filter(Boolean).join(", ");
  return (
    <div className="letter-fields-card">
      <h4>One last thing — full legal names for the letterhead</h4>
      <p className="help">
        I have {childFirstName || "your child"}'s first name from our chat, but for letters that get sent to the district, I want to make sure I have full legal names — both yours and {childFirstName ? childFirstName + "'s" : "your child's"}. This is the only piece I'll need that wasn't covered above.
      </p>
      <p className="help" style={{ marginTop: -8 }}>
        For: {labelList}.
      </p>
      {fields.map(renderField)}
      <button className="btn btn-primary" onClick={onSubmit} disabled={!canSubmit}>
        Generate the documents
      </button>
    </div>
  );
}

function OutputCard({ id, def, content, loading, onRegenerate, onSavePdf }) {
  const [open, setOpen] = useState(true);
  const [editingText, setEditingText] = useState(null);
  const [editing, setEditing] = useState(false);

  const isError = content && typeof content === "object" && content.error;
  const isLetter = ["ten_day_notice", "iee_request", "evaluation_request", "cse_followup", "iep_rejection", "records_request"].includes(id);
  const isSummary = id === "claim_summary";
  const isChecklist = id === "document_checklist";
  const isActions = id === "action_recommendations";

  let status = "loading";
  let statusText = "preparing";
  if (isError) { status = "error"; statusText = "error"; }
  else if (content) { status = "ready"; statusText = "ready"; }

  const currentText = editingText != null ? editingText : (typeof content === "string" ? content : "");

  const downloadAsPdf = () => {
    const fn = `${id.replace(/_/g, "-")}.pdf`;
    const blob = downloadPdf(currentText, fn);
    if (blob && onSavePdf) onSavePdf(blob, fn);
  };
  const copyText = () => {
    navigator.clipboard.writeText(currentText).then(() => alert("Copied."));
  };

  return (
    <div className="output-card">
      <div className="output-head" onClick={() => setOpen((o) => !o)}>
        <div className="output-head-text">
          <p className="output-label">{def.label}</p>
          <p className="output-short">{def.short}</p>
        </div>
        <span className={`output-status ${status}`}>{statusText}</span>
        <span className={`output-chevron ${open ? "open" : ""}`}>▾</span>
      </div>

      {open && (
        <div className="output-body">
          {loading && (
            <div className="checklist-loading" style={{ marginTop: 0 }}>
              <span className="spinner" style={{ width: 14, height: 14, borderWidth: 2 }} />
              <span>Drafting…</span>
            </div>
          )}

          {isError && (
            <div style={{ color: "var(--warn-deep)", fontSize: 14 }}>
              {content.error}
              <button
                className="output-action-btn"
                style={{ marginLeft: 12 }}
                onClick={() => onRegenerate(id)}
              >
                Try again
              </button>
            </div>
          )}

          {!loading && !isError && content && (
            <>
              {(isLetter || isSummary) && (() => {
                const missing = extractPlaceholderLabels(currentText);
                return (
                <>

function Checklist({ data, checked, onToggle, loading }) {
  if (loading) {
    return (
      <div className="checklist-loading">
        <span className="spinner" style={{ width: 16, height: 16, borderWidth: 2 }} />
        <span>Putting together a personalized document checklist for your case…</span>
      </div>
    );
  }
  if (!data || !data.groups) return null;

  const allItems = data.groups.flatMap((g) => g.items || []);
  const totalCount = allItems.length;
  const haveCount = allItems.filter(
    (it) => it.already_have || checked[it.id]
  ).length;

  return (
    <div className="checklist">
      <div className="checklist-head">
        <h3 className="checklist-title">Documents to gather</h3>
        <span className="checklist-progress">
          {haveCount} of {totalCount} ready
        </span>
      </div>
      {data.intro && <p className="checklist-intro">{data.intro}</p>}
      {data.groups.map((g, gi) => (
        <div key={gi} className="checklist-group">
          <h4>{g.title}</h4>
          {g.description && <p className="checklist-group-desc">{g.description}</p>}
          {g.items?.map((it) => {
            const isChecked = it.already_have || !!checked[it.id];
            return (
              <label
                key={it.id}
                className={`checklist-item ${isChecked ? "checked" : ""}`}
              >
                <input
                  type="checkbox"
                  checked={isChecked}
                  onChange={() => onToggle(it.id, !isChecked)}
                />
                <div className="checklist-item-body">
                  <div className="checklist-item-label">{it.label}</div>
                  {it.why && <div className="checklist-item-why">{it.why}</div>}
                </div>
              </label>
            );
          })}
        </div>
      ))}
    </div>
  );
}

function IEPSection({
  fileName,
  extraction,
  flags,
  flagAnswers,
  setFlagAnswers,
  processing,
  error,
  onUpload,
  onClear,
  onSubmitAnswers,
  onClose,
  childFirstName,

  const [dragActive, setDragActive] = useState(false);
  const inputRef = useRef(null);

  const handleFile = (file) => {
    if (!file) return;
    if (file.type !== "application/pdf" && !file.name.toLowerCase().endsWith(".pdf")) {
      alert("Please upload a PDF file.");
      return;
    }
    onUpload(file);
  };

  const handleDrop = (e) => {
    e.preventDefault();
    setDragActive(false);
    const f = e.dataTransfer?.files?.[0];
    if (f) handleFile(f);
  };

  const handleDragOver = (e) => { e.preventDefault(); setDragActive(true); };
  const handleDragLeave = (e) => { e.preventDefault(); setDragActive(false); };

  const noFile = !fileName && !processing && !error;
  const showResults = flags && flags.flags;

  return (
    <div className="iep-section">

        classification, placement — and flag the things worth a closer look. Most
        of what I flag will come with a question I'll ask you, since the IEP
        alone usually can't tell us whether something is actually a problem.
      </p>

      {noFile && (
        <>
          <div
            className={`iep-upload-zone ${dragActive ? "drag-active" : ""}`}
            onClick={() => inputRef.current?.click()}
            onDrop={handleDrop}
            onDragOver={handleDragOver}
            onDragLeave={handleDragLeave}
          >
            <div className="iep-upload-icon">↑</div>
            <p className="iep-upload-title">Drop a PDF here, or click to browse</p>
            <p className="iep-upload-sub">PDF only · read in your browser, only the text is sent for analysis · max 4MB</p>
          </div>
          <input
            ref={inputRef}
            type="file"
            accept="application/pdf,.pdf"
            style={{ display: "none" }}

        <div className="iep-processing">
          <span className="spinner" style={{ width: 16, height: 16, borderWidth: 2 }} />
          <div>

            </span>
          </div>
        </div>
      )}

      {error && (
        <>
          <div className="iep-error">{error}</div>
          <div className="iep-trigger-row">
            <button className="btn btn-secondary" onClick={onClear}>Try a different file</button>
            <button className="btn btn-secondary" onClick={onClose}>Skip for now</button>
          </div>

      )}

      {showResults && (
        <>
          {flags.summary_for_parent && (
            <div className="iep-flags-summary">
              <p>{flags.summary_for_parent}</p>

          )}

          {flags.flags && flags.flags.length > 0 && (
            <div style={{ marginTop: 14 }}>
              <h4 style={{ fontFamily: "Fraunces, serif", fontWeight: 500, fontSize: 17, margin: "0 0 10px", color: "var(--ink)" }}>
                What I'd look at

              {flags.flags.map((f, i) => (

                    <div className="iep-flag-cats">

            </div>
          )}

          {flags.questions_to_strengthen_any_claim && flags.questions_to_strengthen_any_claim.length > 0 && (
            <div className="iep-aux">
              <h4>A few more general questions</h4>
              <ul>
                {flags.questions_to_strengthen_any_claim.map((q, i) => <li key={i}>{q}</li>)}
              </ul>
            </div>
          )}

          {flags.extraction_gaps_affecting_review && flags.extraction_gaps_affecting_review.length > 0 && (
            <div className="iep-aux" style={{ background: "var(--warn-soft)" }}>
              <h4>What I couldn't read clearly</h4>
              <ul>
                {flags.extraction_gaps_affecting_review.map((g, i) => <li key={i}>{g}</li>)}
              </ul>

          <div className="iep-trigger-row" style={{ marginTop: 18 }}>
            <button className="btn btn-primary" onClick={onSubmitAnswers}>
              Use my answers in the draft
            </button>
            <button className="btn btn-secondary" onClick={onClear}>Upload a different IEP</button>
          </div>
          <p style={{ fontSize: 13, color: "var(--ink-soft)", marginTop: 8 }}>
            Your answers will get folded into the captured intake. The complaint draft will be able to reference specific facts from the IEP — service amounts, goal language, dates — alongside what you've told me.
          </p>
        </>
      )}
    </div>
  );
}
