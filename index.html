  useEffect(() => {
    if (!loaded) return;
    if (outputsRequested.length === 0) return;
    const pendingLetters = outputsRequested.filter(
      (id) => outputNeedsLetterFields(id) && !outputs[id] && !outputsLoading[id]
    );
    if (pendingLetters.length > 0 && !formalFieldsCollected) return;
    for (const id of outputsRequested) {
      if (id === "full_complaint") continue;
      if (!outputs[id] && !outputsLoading[id]) {
        generateOutput(id);
      }
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [outputsRequested, formalFieldsCollected, loaded]);

  // ============================================================================
  // IEP UPLOAD PROCESSING
  // PRESERVED — Stage A + Stage B structured assessment. As of chat-as-primary
  // this is intentionally not called from the chat flow (no UI mounts it).
  // Reserved for a future "Quick IEP assessment" entry point. See CLAUDE.md.
  // processIEP, submitIepAnswers, and clearIEP below all belong to this
  // preserved pipeline. Do not delete as dead code.
  // ============================================================================

  const processIEP = async (file) => {
    setIepError(null);
    setIepFileName(file.name);
    setIepProcessing("extracting");
    try {
      if (file.size > MAX_PDF_BYTES) {
        const limitMB = (MAX_PDF_BYTES / (1024 * 1024)).toFixed(1);
        throw new Error(
          `PDF is too large (limit ${limitMB}MB). Many free online tools — Adobe Compress PDF, ilovepdf.com — will shrink it.`
        );
      }

      // Step 1 — extract the PDF text IN THE BROWSER with PDF.js. This is the
      // heavy part, and it runs on the user's machine with no server time
      // limit. The server only ever sees plain text after this.
      const extractionResult = await extractPdfText(file);
      const { text: pdfText, hadTextLayer } = extractionResult;

      if (!hadTextLayer) {
        throw userFacingError(
          "This looks like a scanned or photographed IEP — there's no readable text in the file, just images. I can't read those automatically. The easiest path: open the IEP and type or paste the key details (services, goals, classification, placement) into the chat, and I'll work from that."
        );
      }

      // Structural quality check: if pages are mixed scanned/typed, rotated,
      // or laid out in multiple columns, the reconstructed text is likely
      // jumbled or partial. Refuse rather than feed bad input to Haiku and
      // hand the parent a confidently wrong review.
      const blocker = pdfQualityBlocker(extractionResult);
      if (blocker) {
        throw userFacingError(blocker);
      }

      // Step 2 — extraction call. Send the TEXT (not the PDF) to Claude. Text
      // analysis is fast, so this stays well under the function time limit.
      // 4000-token budget: a long IEP with many goals/services/accommodations
      // can plausibly fill 2500-3500 tokens of structured output, and a
      // truncated extraction silently breaks Stage B. strictMaxTokens means
      // the call throws (with a parent-friendly message) instead of returning
      // a half-extracted IEP.
      const extraction = await callClaudeForJSON(
        IEP_EXTRACT_PROMPT,
        "Here is the full text extracted from a parent's IEP PDF. Extract it into the structured schema described in the system prompt. Return ONLY the JSON object.\n\nIEP TEXT:\n" +
          pdfText,
        FAST_MODEL,
        4000,
        { strictMaxTokens: true }
      );

      // Post-extraction self-report: the IEP_EXTRACT prompt asks Haiku to
      // rate its own completeness. If it says "low", don't paper over that
      // by running Stage B on shaky structured data — surface it.
      const completeness = extraction && extraction.extraction_quality && extraction.extraction_quality.completeness;
      if (completeness === "low") {
        const missing = (extraction.extraction_quality.unclear_or_missing || []).slice(0, 3);
        const detail = missing.length > 0 ? " Specifically: " + missing.join("; ") + "." : "";
        throw userFacingError(
          "I tried, but I couldn't reliably read this IEP — too much of it came through unclear." +
            detail +
            " Rather than guess at things and hand you a wrong analysis, please tell me the key details (services, goals, classification, placement) in the chat and I'll work from that."
        );
      }

      setIepExtraction(extraction);

      // Now flagging — show that stage in the spinner.
      setIepProcessing("flagging");

      const parentContext = {
        concerns_freetext: intake.concerns_summary || "",
        considering_private_placement: intake.private_placement_status === "considering",
        already_in_private_placement: intake.private_placement_status === "enrolled",
        child_making_progress: intake.child_making_progress || "unsure",
        services_actually_happening: intake.services_actually_happening || "unsure",
        has_private_evaluation: (intake.evidence_available || []).includes("private_evaluation"),
        triage_categories: triageResult?.identified_categories?.map((c) => c.category) || [],
      };

      // Step 3 — flagging call. Text only, on Haiku for speed, with a bounded
      // token budget so the structured output stays small enough to finish
      // under the 26s function limit. strictMaxTokens so a truncated flag
      // list surfaces as an error the parent can act on.
      const flags = await callClaudeForJSON(
        IEP_FLAG_PROMPT,
        "Identify the most relevant facts in this IEP that could support a colorable due process claim, and pair each with a question for the parent.\n\n" +
          "iep_extraction:\n" +
          JSON.stringify(extraction, null, 2) +
          "\n\nparent_context:\n" +
          JSON.stringify(parentContext, null, 2),
        FAST_MODEL,
        2500,
        { strictMaxTokens: true }
      );
      setIepFlags(flags);
      setIepProcessing(null);
    } catch (e) {
      const msg = (e && e.message) || "unknown error";
      const isTimeout = /timeout|timed out|504|502|gateway/i.test(msg);
      setIepError(
        isTimeout
          ? "The analysis took too long. Try a shorter IEP, or skip this step and just tell me about the IEP in the chat."
          : e && e.userFacing
          ? msg // already a parent-friendly message from the detection layer
          : "Couldn't process the IEP — " + msg + ". You can try again, try a different file, or skip this step."
      );
      setIepProcessing(null);
    }
  };

  // When the parent answers an IEP follow-up question, append the answer to
  // the chat's intake notes so it flows into the drafter.
  const submitIepAnswers = () => {
    const lines = [];
    if (iepFlags?.flags) {
      iepFlags.flags.forEach((f, i) => {
        const ans = iepFlagAnswers[i];
        if (!ans || !ans.trim()) return;
        lines.push(`Re: ${f.what_the_iep_shows}\nQ: ${f.question_for_parent}\nA: ${ans.trim()}`);
      });
    }
    if (lines.length === 0) {
      // Just close the panel without enriching intake
      setIepUploadVisible(false);
      return;
    }
    const combined = lines.join("\n\n");
    // Merge into intake.concerns_summary so the drafter can see it
    setIntake((prev) => ({
      ...prev,
      concerns_summary:
        (prev.concerns_summary || "") +
        "\n\n[ADDITIONAL CONTEXT FROM IEP REVIEW]\n" +
        combined,
      iep_review_notes: combined, // also store separately for clarity
    }));
    setIepUploadVisible(false);
  };

  const clearIEP = () => {
    setIepFileName(null);
    setIepExtraction(null);
    setIepFlags(null);
    setIepFlagAnswers({});
    setIepError(null);
    setIepProcessing(null);
  };

  const runDrafter = async () => {
    setError(null);
    setDrafting(true);
    try {
      const today = new Date().toISOString().slice(0, 10);
      const fullPayload = {
        today,
        // Identity from the form (exact spelling); everything else from intake.
        parent: {
          full_name: formalFields.parent_full_name,
          address: formalFields.parent_address,
          email: formalFields.parent_email,
          phone: formalFields.parent_phone,
        },
        student: {
          full_name: formalFields.child_full_name,
          date_of_birth: formalFields.child_dob,
          first_name: intake.student_first_name,
          age: intake.student_age,
          grade: intake.student_grade,
          school: intake.student_school,
          classification: intake.student_classification,
        },
        district: {
          name: intake.district_name || "[PARENT TO ADD: district name]",
          is_nyc_doe: intake.is_nyc_doe,
        },
        captured_intake: intake,
        triage_categories: triageResult?.identified_categories,
        iep_extraction: iepExtraction || null,
        iep_flags: iepFlags?.flags || null,
        iep_flag_answers: Object.keys(iepFlagAnswers).length > 0 ? iepFlagAnswers : null,
        chat_transcript_excerpt: messages
          .slice(-30)
          .map((m) => `${m.role === "user" ? "Parent" : "Assistant"}: ${m.content}`)
          .join("\n\n"),
        // Substantive content now comes from the chat-gathered intake, not the
        // form — the form collects only exact-spelling identity (see Commit 4).
        remedy: intake.remedy_sought,
        prior_written_communications: intake.prior_written_detail,
        evidence_parent_has: intake.evidence_available || [],
        pendency_assertion: intake.pendency_assertion,
        pendency_details: intake.pendency_details,
        key_dates: intake.key_dates || null,
      };

      // Stage 1: generate draft. 6000 tokens — a long multi-issue complaint can
      // approach the old 4000 cap and silently truncate mid-sentence.
      const stage1 = await callClaudeForText(
        DRAFTER_PROMPT,
        "Draft the due process complaint based on the following information. Return only the letter text.\n\n" +
          JSON.stringify(fullPayload, null, 2),
        6000
      );

      // Stage 2: de-lawyer — plain text, not JSON. The cleaned draft is returned
      // directly, so there's no JSON round-trip to truncate or mis-escape (the
      // old "Could not parse JSON" failure on the headline output). Same budget
      // as stage 1, since it reproduces the whole draft.
      const cleaned = await callClaudeForText(DELAWYER_PROMPT, stage1, 6000);

      setDraft(cleaned || stage1);
      setDraftEdited(null);
      setReviewChecks({ accuracy: false, dates: false, remedy: false });
    } catch (e) {
      setError("Couldn't generate the draft — " + (e.message || "unknown error"));
    } finally {
      setDrafting(false);
    }
  };

  // Auto-resume on load: if the thread ends with a user message that never got
  // a response (e.g., reload while the API call was in flight), kick off the
  // call now so the user isn't stuck looking at their own unanswered message.
  useEffect(() => {
    if (!loaded || loading) return;
    if (messages.length === 0) return;
    const last = messages[messages.length - 1];
    if (last.role !== "user") return;

    (async () => {
      setLoading(true);
      try {
        await processCall(messages);
      } catch (e) {
        setError(
          (e.message || "Couldn't reach the assistant.") +
            " — Click retry below or send a new message."
        );
        setLastFailedMessage(last.content);
      } finally {
        setLoading(false);
      }
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loaded]);

  useEffect(() => {
    if (threadRef.current) threadRef.current.scrollTop = threadRef.current.scrollHeight;
  }, [messages, loading]);

  useEffect(() => {
    inputRef.current?.focus();
  }, [loading, chatState]);

  // Run a Claude call against the given message history and update state with the result.
  // Used by both send() (for new messages) and retryLast() (for retrying after an error).
  const processCall = async (msgs, docsOverride = null) => {
    // docsOverride lets a freshly-attached document reach this turn's prompt
    // without waiting for the uploadedDocs state update to flush.
    const docs = docsOverride || uploadedDocs;
    let baseSystem =
      CHAT_ADVOCATE_PROMPT +
      "\n\n--- INTAKE STATE SO FAR ---\n" +
      JSON.stringify(intake, null, 2);
    // Formal identity fields the parent already typed into a form this session.
    // Surface them so the chat doesn't re-ask — and so it doesn't ask in chat
    // for the ones the form (not the chat) is responsible for collecting.
    const collectedFormal = [
      ["Parent's full name", formalFields.parent_full_name],
      ["Parent's address", formalFields.parent_address],
      ["Parent's email", formalFields.parent_email],
      ["Parent's phone", formalFields.parent_phone],
      ["Child's full name", formalFields.child_full_name],
      ["Child's date of birth", formalFields.child_dob],
    ].filter(([, v]) => v && String(v).trim());
    if (collectedFormal.length > 0) {
      baseSystem +=
        "\n\n--- ALREADY COLLECTED (do not re-ask these — the parent typed them into the form) ---\n" +
        collectedFormal.map(([k, v]) => `- ${k}: ${v}`).join("\n") +
        "\nIf you need other identity fields for a specific output, the form below will collect them; do not ask for them in chat.";
    }
    const docsBlock = formatDocsForPrompt(docs);
    if (docsBlock) {
      baseSystem += "\n\n--- UPLOADED DOCUMENTS ---\n" + docsBlock;
    }

    let parsed;
    try {
      parsed = await callClaude(msgs, baseSystem);
    } catch (firstErr) {
      // One silent retry
      parsed = await callClaude(msgs, baseSystem);
    }

    const updatedIntake = mergeIntake(intake, parsed.intake_updates || {});
    setIntake(updatedIntake);
    setChatState(parsed.state || "continuing");

    // Once the parent requests the assessment, latch it on permanently.
    if (parsed.parent_requested_assessment === true) {
      setAssessmentRequested(true);
    }

    // Merge any new outputs the parent has asked for. Don't replace — append.
    if (Array.isArray(parsed.outputs_to_generate) && parsed.outputs_to_generate.length > 0) {
      setOutputsRequested((existing) => {
        const valid = parsed.outputs_to_generate.filter((id) => OUTPUT_LIBRARY[id]);
        return Array.from(new Set([...existing, ...valid]));
      });
    }

    // Validate wait-check against whitelist — model occasionally returns "null"
    // as a string or other invalid values that shouldn't display.
    const validWaitCheck = VALID_WAIT_CHECKS.includes(parsed.wait_check_just_surfaced)
      ? parsed.wait_check_just_surfaced
      : null;
    if (validWaitCheck) {
      setWaitChecks((w) => Array.from(new Set([...w, validWaitCheck])));
    }

    setMessages((current) => [
      ...current,
      {
        role: "assistant",
        content: parsed.chat_reply || "(no reply)",
        waitCheck: validWaitCheck,
      },
    ]);
  };

  // Parent attaches a document in the chat. We extract the text in the browser
  // (same PDF.js path the preserved IEP pipeline uses) and add it to
  // uploadedDocs, then send a short user turn so the assistant acknowledges it.
  // We do NOT run the structured IEP assessment here — that pipeline is reserved
  // for a separate future entry point.
  const handleAttach = async (file) => {
    if (!file || loading || attaching) return;
    setAttachError(null);
    if (file.type !== "application/pdf" && !file.name.toLowerCase().endsWith(".pdf")) {
      setAttachError("Please attach a PDF file.");
      return;
    }
    if (file.size > MAX_PDF_BYTES) {
      const limitMB = (MAX_PDF_BYTES / (1024 * 1024)).toFixed(1);
      setAttachError(`That PDF is too large (limit ${limitMB}MB). Free tools like ilovepdf.com can shrink it.`);
      return;
    }
    setAttaching(true);
    try {
      const extractionResult = await extractPdfText(file);
      const { text, hadTextLayer } = extractionResult;
      if (!hadTextLayer) {
        setAttachError(
          "That looks like a scanned or photographed PDF — there's no readable text in it, just images. Type the key details into the chat instead and I'll work from that."
        );
        return;
      }
      const blocker = pdfQualityBlocker(extractionResult);
      if (blocker) {
        setAttachError(blocker);
        return;
      }
      const newDocs = [...uploadedDocs, { name: file.name, text }];
      setUploadedDocs(newDocs);

      const newMsgs = [...messages, { role: "user", content: `I've attached a document: ${file.name}` }];
      setMessages(newMsgs);
      setLoading(true);
      try {
        await processCall(newMsgs, newDocs);
      } catch (e) {
        setError(
          (e.message || "Couldn't reach the assistant.") +
            " — Click retry below or send a new message."
        );
        setLastFailedMessage(newMsgs[newMsgs.length - 1].content);
      } finally {
        setLoading(false);
      }
    } catch (e) {
      const msg = (e && e.message) || "unknown error";
      setAttachError(
        e && e.userFacing ? msg : "Couldn't read that PDF — " + msg + ". Try a different file or type the details into the chat."
      );
    } finally {
      setAttaching(false);
    }
  };

  const send = async (textOverride = null) => {
    const text = (textOverride ?? input).trim();
    if (!text || loading) return;
    setError(null);
    setLastFailedMessage(null);

    const newMsgs = [...messages, { role: "user", content: text }];
    setMessages(newMsgs);
    setInput("");
    setLoading(true);

    try {
      await processCall(newMsgs);
    } catch (e) {
      setError(
        (e.message || "Couldn't reach the assistant.") +
          " — Click retry below or send a new message."
      );
      setLastFailedMessage(text);
    } finally {
      setLoading(false);
    }
  };

  const retryLast = async () => {
    if (loading) return;
    setError(null);
    setLoading(true);
    try {
      // The user message is already in the thread — just retry the API call against it
      await processCall(messages);
      setLastFailedMessage(null);
    } catch (e) {
      setError(
        (e.message || "Still couldn't reach the assistant.") +
          " — Try again or send a new message."
      );
    } finally {
      setLoading(false);
    }
  };

  const continueChat = () => {
    setChatState("continuing");
    inputRef.current?.focus();
  };

  const reset = async () => {
    if (!confirm("Start fresh? This clears the saved conversation.")) return;

    // Reset all React state immediately so the user sees clean state even
    // before the storage delete completes.
    setMessages([{ role: "assistant", content: OPENING }]);
    setIntake({});
    setChatState("continuing");
    setWaitChecks([]);
    setError(null);
    setLastFailedMessage(null);
    setChecklist(null);
    setCheckedItems({});
    setTriageResult(null);
    setFullComplaintFormOpen(false);
    setDraft(null);
    setDraftEdited(null);
    setReviewChecks({ accuracy: false, dates: false, remedy: false });
    setAssessmentRequested(false);
    setOutputsRequested([]);
    setOutputs({});
    setOutputsLoading({});
    setFormalFields({
      parent_full_name: "", parent_address: "", parent_email: "",
      parent_phone: "", child_full_name: "", child_dob: "",
    });
    setFormalFieldsCollected(false);
    setIepFileName(null);
    setIepExtraction(null);
    setIepFlags(null);
    setIepFlagAnswers({});
    setIepError(null);
    setIepProcessing(null);
    setIepUploadVisible(false);
    setUploadedDocs([]);
    setAttachError(null);
    setAttaching(false);
    outputsScrolledRef.current = false;

    // Clear all saved state across both storage backends and any key version.
    try {
      if (typeof window !== "undefined" && window.storage) {
        await window.storage.delete(STORAGE_KEY).catch(() => {});
        await window.storage.delete("filing_path_demo:state_v1").catch(() => {});
        await window.storage.delete("filing_path_demo:state_v2").catch(() => {});
        // Enumerate and delete anything else with our prefixes
        for (const prefix of ["plainly:", "filing_path_demo:"]) {
          try {
            const result = await window.storage.list(prefix);
            if (result && result.keys) {
              for (const k of result.keys) {
                await window.storage.delete(k).catch(() => {});
              }
            }
          } catch {}
        }
      }
      // Also wipe any stale entries left in localStorage by older versions
      if (typeof localStorage !== "undefined") {
        const stale = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && (k.indexOf("plainly:") === 0 || k.indexOf("filing_path_demo:") === 0)) {
            stale.push(k);
          }
        }
        stale.forEach((k) => localStorage.removeItem(k));
      }
    } catch {}

    // Force a full page reload so any in-flight effects can't restore old state
    setTimeout(() => {
      try { window.location.reload(); } catch {}
    }, 100);
  };

  return (
    <>
      <style>{CHAT_STYLES}</style>
      <div className="shell">
        <div className="head">
          <div className="brand" style={{ fontFamily: "Fraunces, serif", fontSize: 16, fontWeight: 500, color: "var(--ink-muted)" }}>
            Conversation
          </div>
          <button
            onClick={reset}
            style={{
              marginLeft: "auto",
              background: "transparent",
              border: "none",
              color: "var(--ink-soft)",
              fontSize: 12,
              fontFamily: "inherit",
              cursor: "pointer",
              textDecoration: "underline",
              textUnderlineOffset: 3,
              padding: 0,
            }}
            title="Clear the saved conversation and start over"
          >
            Start fresh
          </button>
        </div>

        <h1>
          Tell me what's <em>going on</em>.
        </h1>
        <p className="lede">
          Describe your situation in your own words. I'll help you make sense of
          it, flag anything time-sensitive right away, and put together letters or
          documents when they'd help. Attach the IEP or any document any time.
        </p>

        <div className="thread" ref={threadRef}>
          {messages.map((m, i) => (
            <div
              key={i}
              style={{
                display: "flex",
                flexDirection: "column",
                alignItems: m.role === "user" ? "flex-end" : "flex-start",
              }}
            >
              <div className={`bubble ${m.role === "user" ? "parent" : "assistant"}`}>
                {renderMessageText(m.content)}
              </div>
              {m.waitCheck && (
                <div className="wait-flag">
                  Wait-check fired: {m.waitCheck.replace(/_/g, " ")}
                </div>
              )}
            </div>
          ))}
          {loading && (
            <div className="typing">
              <span className="tdot" />
              <span className="tdot" />
              <span className="tdot" />
            </div>
          )}
        </div>

        {error && (
          <div className="error">
            <div style={{ marginBottom: 8 }}>{error}</div>
            {lastFailedMessage && (
              <button
                className="btn btn-ghost"
                style={{ fontSize: 13, padding: "6px 12px", marginRight: 0 }}
                onClick={retryLast}
              >
                Retry that message
              </button>
            )}
          </div>
        )}

        {chatState === "thin_offer_guidance" && (
          <div className="thin">
            <h3>Worth gathering more information first</h3>
            <p style={{ margin: 0, color: "var(--warn-deep)" }}>
              The chat above has specific suggestions. You can keep talking if
              there's more to share, or come back when you have more documents
              in hand.
            </p>
            <div style={{ marginTop: 12 }}>
              <button className="btn btn-ghost" onClick={continueChat}>
                Keep chatting — I have more
              </button>
            </div>
          </div>
        )}

        {uploadedDocs.length > 0 && (
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, margin: "0 0 8px" }}>
            {uploadedDocs.map((d, i) => (
              <span
                key={i}
                style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 12.5, color: "var(--ink-muted)", background: "var(--surface-2)", borderRadius: 6, padding: "3px 8px" }}
              >
                📎 {d.name}
                <a
                  href="#"
                  onClick={(e) => { e.preventDefault(); setUploadedDocs((docs) => docs.filter((_, j) => j !== i)); }}
                  style={{ color: "var(--ink-soft)", textDecoration: "none", fontWeight: 600 }}
                  title="Remove this document"
                >
                  ×
                </a>
              </span>
            ))}
          </div>
        )}

        {attachError && (
          <div className="error" style={{ marginBottom: 8 }}>{attachError}</div>
        )}

        <div className="composer">
            <input
              ref={attachRef}
              type="file"
              accept="application/pdf,.pdf"
              style={{ display: "none" }}
              onChange={(e) => { handleAttach(e.target.files?.[0]); e.target.value = ""; }}
            />
            <button
              className="send"
              onClick={() => attachRef.current?.click()}
              disabled={loading || attaching}
              aria-label="Attach a document"
              title="Attach a PDF (IEP, evaluation, notice, anything)"
              style={{ background: "transparent", color: "var(--ink-soft)" }}
            >
              {attaching ? (
                <span className="spinner" style={{ width: 14, height: 14, borderWidth: 2 }} />
              ) : (
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
                </svg>
              )}
            </button>
            <textarea
              ref={inputRef}
              value={input}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={(e) => {
                if (e.key === "Enter" && !e.shiftKey) {
                  e.preventDefault();
                  send();
                }
              }}
              placeholder={
                loading ? "Thinking..." : "Type your message... (Enter to send)"
              }
              rows={1}
              disabled={loading}
            />
            <button
              className="send"
              onClick={() => send()}
              disabled={!input.trim() || loading}
              aria-label="Send"
            >
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
                <line x1="22" y1="2" x2="11" y2="13" />
                <polygon points="22 2 15 22 11 13 2 9 22 2" />
              </svg>
            </button>
          </div>

        {/* LETTER FIELDS PROMPT — first, so the parent can complete and see outputs ASAP */}
        {assessmentRequested && !formalFieldsCollected && (() => {
          const pending = outputsRequested.filter(
            (id) => OUTPUT_LIBRARY[id]?.min_fields?.length > 0 && id !== "full_complaint" && !outputs[id] && !outputsLoading[id]
          );
          if (pending.length === 0) return null;
          return (
            <FormalFieldsForm
              mode="letters"
              values={formalFields}
              onChange={setFormalFields}
              onSubmit={() => setFormalFieldsCollected(true)}
              neededFor={pending}
              childFirstName={intake.student_first_name}
            />
          );
        })()}

        {/* OUTPUTS PANEL — appears immediately when parent requests outputs */}
        {assessmentRequested && outputsRequested.length > 0 && (
          <div ref={outputsScrollRef}>
            <OutputsPanel
              requested={outputsRequested}
              outputs={outputs}
              loading={outputsLoading}
              onRegenerate={(id) => {
                setOutputs((o) => {
                  const newO = { ...o };
                  delete newO[id];
                  return newO;
                });
                setTimeout(() => generateOutput(id), 50);
              }}
            />
          </div>
        )}

        {/* The "What we're seeing" triage verdict (TriageSection) was removed from
            the chat flow — the chat does this conversationally now. The component
            is preserved for the future "Quick IEP assessment" entry point. */}

        {/* FULL COMPLAINT FLOW — triggered when full_complaint is requested. The
            remedy and substance are gathered + confirmed in the chat; the form
            below collects only the exact-spelling signature-block identity. */}
        {assessmentRequested && outputsRequested.includes("full_complaint") && !fullComplaintFormOpen && !draft && !drafting && (
          <div className="ready-card" style={{ marginTop: 20 }}>
            <h4>Ready to prepare the full complaint?</h4>
            <p>
              I have what you're asking for and the rest of your situation from
              our chat. For the filed document I just need a few exact details —
              your full name, address, email and phone, and your child's full
              name and date of birth.
            </p>
            <button className="btn btn-primary" onClick={() => setFullComplaintFormOpen(true)}>
              Continue
            </button>
          </div>
        )}

        {fullComplaintFormOpen && !draft && !drafting && (
          <FormalFieldsForm
            mode="complaint"
            values={formalFields}
            onChange={setFormalFields}
            onSubmit={() => runDrafter()}
            onCancel={() => setFullComplaintFormOpen(false)}
            childFirstName={intake.student_first_name}
          />
        )}

        {(drafting || draft) && (
          <DraftReview
            draft={draft}
            edited={draftEdited}
            onEditChange={setDraftEdited}
            checks={reviewChecks}
            onCheckChange={(k, v) => setReviewChecks((r) => ({ ...r, [k]: v }))}
            onRegenerate={() => runDrafter()}
            drafting={drafting}
          />
        )}

        {/* The IEP structured-assessment UI (upload button → IEPSection →
            "What I'd look at" panel) was intentionally disconnected here. The
            chat now takes documents through the generic attach affordance in
            the composer above. The assessment pipeline (processIEP, IEPSection,
            IEP_EXTRACT_PROMPT, IEP_FLAG_PROMPT) is PRESERVED for a future
            "Quick IEP assessment" entry point — see CLAUDE.md. Do not delete. */}

        {waitChecks.filter((w) => VALID_WAIT_CHECKS.includes(w)).length > 0 && (
          <div style={{ marginTop: 12, fontSize: 12, color: "var(--ink-soft)" }}>
            Wait-checks fired this session:{" "}
            <span style={{ color: "var(--warn-deep)", fontWeight: 500 }}>
              {waitChecks
                .filter((w) => VALID_WAIT_CHECKS.includes(w))
                .join(", ")
                .replace(/_/g, " ")}
            </span>
          </div>
        )}

        <div className="disclaimer">
          This is a conversational guide, not a lawyer, and nothing here is legal
          advice. Attach documents and ask questions; I'll help you think it
          through and prepare what you need.
        </div>
      </div>
    </>
  );
}

function StartPage() {
  return (
    <div className="page-wide fade-in" style={{ paddingTop: 24, paddingBottom: 60 }}>
      <ChatTool />
    </div>
  );
}

// ============================================================================
// 404
// ============================================================================

function NotFoundPage() {
  return (
    <div className="page fade-in" style={{ textAlign: "center" }}>
      <div className="eyebrow">Not found</div>
      <h1 className="display" style={{ fontSize: 42 }}>That page doesn't exist.</h1>
      <p className="lede">Try one of these instead:</p>
      <div className="btn-row" style={{ justifyContent: "center" }}>
        <button className="btn btn-primary" onClick={() => go("/")}>Home</button>
        <button className="btn btn-secondary" onClick={() => go("/start")}>Start the chat</button>
      </div>
    </div>
  );
}

// ============================================================================
// MAIN APP
// ============================================================================

function App() {
  const route = useRoute();

  let page;
  switch (route) {
    case "/": page = <HomePage />; break;
    case "/start": page = <StartPage />; break;
    case "/how": page = <HowPage />; break;
    case "/who": page = <WhoPage />; break;
    case "/faq": page = <FaqPage />; break;
    case "/resources": page = <ResourcesPage />; break;
    case "/about": page = <AboutPage />; break;
    case "/contact": page = <ContactPage />; break;
    case "/privacy": page = <PrivacyPage />; break;
    default: page = <NotFoundPage />;
  }

  return (
    <>
      <style>{STYLES}</style>
      <div className="app-root">
        <Header route={route} />
        {page}
        <Footer />
      </div>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
