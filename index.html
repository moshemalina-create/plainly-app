  gap: 8px;
  align-items: flex-end;
}
.composer textarea {
  flex: 1;
  font-family: 'Newsreader', serif;
  font-size: 15px;
  border: none;
  background: transparent;
  resize: none;
  outline: none;
  color: var(--ink);
  padding: 6px;
  line-height: 1.5;
  min-height: 24px;
  max-height: 140px;
}
.send {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--accent);
  color: white;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.send:disabled { background: var(--border); cursor: not-allowed; }

.affirm {
  margin-top: 14px;
  padding: 16px;
  background: var(--accent-soft);
  border: 1px solid var(--accent);
  border-radius: 10px;
}
.affirm p { margin: 0 0 12px; font-weight: 500; }

.btn {
  font-family: 'Newsreader', serif;
  font-size: 15px;
  font-weight: 500;
  padding: 9px 18px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  margin-right: 8px;
}
.btn-primary {
  background: var(--accent);
  color: white;
}
.btn-primary:hover { background: var(--accent-deep); }
.btn-ghost {
  background: transparent;
  color: var(--ink-muted);
  border: 1px solid var(--border);
}

.thin {
  margin-top: 14px;
  padding: 16px;
  background: var(--warn-soft);
  border: 1px solid #E5C8B7;
  border-left: 3px solid var(--warn);
  border-radius: 8px;
}
.thin h3 {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 16px;
  margin: 0 0 6px;
  color: var(--warn-deep);
}

.complete {
  margin-top: 18px;
  padding: 20px;
  background: var(--accent-soft);
  border: 1px solid var(--accent);
  border-left: 4px solid var(--accent);
  border-radius: 10px;
}
.complete h3 {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 18px;
  margin: 0 0 10px;
  color: var(--accent-deep);
}

.intake-panel {
  margin-top: 20px;
  background: var(--surface-2);
  border: 1px dashed var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  font-size: 13px;
}
.intake-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  user-select: none;
}
.intake-title {
  font-weight: 500;
  color: var(--ink-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-size: 11px;
}
.intake-count {
  font-size: 11px;
  color: var(--ink-soft);
}
.intake-body {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border-soft);
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 12px;
  color: var(--ink-muted);
  line-height: 1.6;
  white-space: pre-wrap;
  word-wrap: break-word;
  max-height: 280px;
  overflow-y: auto;
}
.intake-row {
  display: flex;
  gap: 8px;
  padding: 2px 0;
}
.intake-key {
  color: var(--accent-deep);
  font-weight: 500;
  flex-shrink: 0;
}
.intake-val {
  color: var(--ink);
}
.intake-empty {
  color: var(--ink-soft);
  font-style: italic;
  font-family: 'Newsreader', serif;
  font-size: 13px;
}

.error {
  margin-top: 12px;
  padding: 12px 14px;
  background: var(--warn-soft);
  border: 1px solid var(--warn);
  border-radius: 6px;
  font-size: 14px;
  color: var(--warn-deep);
}

.disclaimer {
  margin-top: 32px;
  padding-top: 16px;
  border-top: 1px solid var(--border-soft);
  font-size: 12px;
  color: var(--ink-soft);
  line-height: 1.5;
}

.transition-card {
  margin-top: 14px;
  padding: 18px 20px;
  background: var(--accent-soft);
  border: 1px solid var(--accent);
  border-left: 4px solid var(--accent);
  border-radius: 10px;
}
.transition-card h3 {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 17px;
  margin: 0 0 8px;
  color: var(--accent-deep);
}
.transition-card p {
  margin: 0 0 8px;
  font-size: 14.5px;
  color: var(--ink-muted);
  line-height: 1.55;
}
.transition-card p:last-child { margin-bottom: 0; }

.checklist {
  margin-top: 24px;
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: 12px;
  padding: 20px;
}
.checklist-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 4px;
}
.checklist-title {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 18px;
  color: var(--ink);
  margin: 0;
}
.checklist-progress {
  font-size: 12px;
  color: var(--ink-soft);
  letter-spacing: 0.05em;
}
.checklist-intro {
  margin: 4px 0 16px;
  color: var(--ink-muted);
  font-size: 14.5px;
  line-height: 1.55;
}
.checklist-group {
  margin-bottom: 18px;
  padding-top: 14px;
  border-top: 1px solid var(--border-soft);
}
.checklist-group:first-of-type { border-top: none; padding-top: 0; }
.checklist-group h4 {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 15px;
  margin: 0 0 4px;
  color: var(--ink);
}
.checklist-group-desc {
  font-size: 13px;
  color: var(--ink-soft);
  margin: 0 0 12px;
  font-style: italic;
}
.checklist-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 8px 0;
  cursor: pointer;
  user-select: none;
}
.checklist-item input[type="checkbox"] {
  margin-top: 4px;
  flex-shrink: 0;
  width: 16px;
  height: 16px;
  accent-color: var(--accent);
  cursor: pointer;
}
.checklist-item-body { flex: 1; }
.checklist-item-label {
  font-size: 14.5px;
  font-weight: 500;
  color: var(--ink);
}
.checklist-item.checked .checklist-item-label {
  text-decoration: line-through;
  color: var(--ink-soft);
}
.checklist-item-why {
  font-size: 13px;
  color: var(--ink-muted);
  margin-top: 2px;
  line-height: 1.45;
}
.checklist-loading {
  margin-top: 24px;
  padding: 18px;
  background: var(--surface);
  border: 1px dashed var(--border);
  border-radius: 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  color: var(--ink-muted);
}

/* Triage / drafter / draft review */
.stage-block {
  margin-top: 28px;
  padding-top: 24px;
  border-top: 2px solid var(--border-soft);
}
.stage-eyebrow {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 8px;
}
.stage-title {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 22px;
  color: var(--ink);
  margin: 0 0 6px;
  letter-spacing: -0.01em;
}
.stage-lede {
  color: var(--ink-muted);
  font-size: 15px;
  margin: 0 0 16px;
  line-height: 1.55;
}

.triage-card {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-left: 3px solid var(--accent);
  border-radius: 10px;
  padding: 20px;
}
.triage-summary {
  font-size: 16px;
  color: var(--ink);
  margin: 0 0 14px;
  line-height: 1.55;
}
.triage-cat {
  padding: 12px 0;
  border-top: 1px solid var(--border-soft);
}
.triage-cat:first-of-type { border-top: none; padding-top: 4px; }
.triage-cat-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink-soft);
  font-weight: 600;
  margin-bottom: 4px;
}
.triage-cat-why {
  font-size: 14.5px;
  margin: 0 0 4px;
  color: var(--ink);
}

.drafter-form {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: 10px;
  padding: 20px;
}
.drafter-section {
  margin-bottom: 20px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border-soft);
}
.drafter-section:last-of-type { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
.drafter-section h4 {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 16px;
  margin: 0 0 4px;
  color: var(--ink);
}
.drafter-section .help {
  font-size: 13px;
  color: var(--ink-soft);
  margin: 0 0 12px;
  line-height: 1.5;
}
.field {
  margin-bottom: 12px;
}
.field label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  margin-bottom: 4px;
}
.field input, .field select, .field textarea {
  width: 100%;
  font-family: 'Newsreader', serif;
  font-size: 15px;
  color: var(--ink);
  background: white;
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 8px 10px;
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.field textarea { resize: vertical; line-height: 1.5; min-height: 70px; }
.row-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
@media (max-width: 540px) { .row-2 { grid-template-columns: 1fr; } }

.draft-paper {
  background: #FFFCF5;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 28px 32px;
  font-family: 'Newsreader', serif;
  font-size: 15px;
  line-height: 1.7;
  white-space: pre-wrap;
  color: var(--ink);
  box-shadow: 0 4px 24px rgba(31,42,55,0.06);
  cursor: text;
}
.draft-paper textarea {
  width: 100%;
  min-height: 480px;
  font-family: inherit;
  font-size: inherit;
  line-height: inherit;
  color: inherit;
  background: transparent;
  border: none;
  outline: none;
  resize: vertical;
  padding: 0;
}
.review-checks {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: 10px;
  padding: 18px 20px;
  margin-top: 16px;
}
.review-check {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 8px 0;
  cursor: pointer;
  user-select: none;
}
.review-check input[type="checkbox"] {
  width: 16px; height: 16px;
  accent-color: var(--accent);
  margin-top: 4px;
  cursor: pointer;
  flex-shrink: 0;
}
.review-check-body { font-size: 14.5px; color: var(--ink); }
.review-check-body strong { font-weight: 500; }

.ready-card {
  background: var(--accent-soft);
  border: 1px solid var(--accent);
  border-left: 4px solid var(--accent);
  border-radius: 10px;
  padding: 18px 20px;
  margin-top: 16px;
}
.ready-card h4 {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 17px;
  margin: 0 0 8px;
  color: var(--accent-deep);
}
.ready-card p {
  margin: 0 0 12px;
  color: var(--ink-muted);
  font-size: 14.5px;
}

/* Outputs library panel */
.outputs-panel {
  margin-top: 24px;
}
.output-card {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: 10px;
  margin-bottom: 12px;
  overflow: hidden;
}
.output-head {
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  user-select: none;
  gap: 12px;
}
.output-head:hover { background: var(--surface-2); }
.output-head-text { flex: 1; min-width: 0; }
.output-label {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 16px;
  color: var(--ink);
  margin: 0 0 2px;
}
.output-short {
  font-size: 13px;
  color: var(--ink-soft);
  line-height: 1.4;
  margin: 0;
}
.output-status {
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 3px;
  flex-shrink: 0;
}
.output-status.loading {
  background: var(--surface-2);
  color: var(--ink-soft);
}
.output-status.ready {
  background: var(--accent-soft);
  color: var(--accent-deep);
}
.output-status.error {
  background: var(--warn-soft);
  color: var(--warn-deep);
}
.output-chevron {
  color: var(--ink-soft);
  font-size: 13px;
  flex-shrink: 0;
  transition: transform 0.2s ease;
}
.output-chevron.open { transform: rotate(180deg); }
.output-body {
  border-top: 1px solid var(--border-soft);
  padding: 18px 22px;
  background: white;
}
.output-letter {
  font-family: 'Newsreader', serif;
  font-size: 14.5px;
  line-height: 1.65;
  white-space: pre-wrap;
  color: var(--ink);
  background: #FFFCF5;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 22px 26px;
}
.output-letter textarea {
  width: 100%;
  min-height: 360px;
  font-family: inherit;
  font-size: inherit;
  line-height: inherit;
  color: inherit;
  background: transparent;
  border: none;
  outline: none;
  resize: vertical;
  padding: 0;
}
.output-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  flex-wrap: wrap;
}
.output-action-btn {
  font-family: 'Newsreader', serif;
  font-size: 13.5px;
  padding: 6px 14px;
  border-radius: 5px;
  border: 1px solid var(--border);
  background: white;
  color: var(--ink);
  cursor: pointer;
}
.output-action-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}
.output-action-btn.primary {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}
.output-action-btn.primary:hover { background: var(--accent-deep); }

.output-summary {
  font-family: 'Newsreader', serif;
  font-size: 14.5px;
  line-height: 1.65;
  color: var(--ink);
  white-space: pre-wrap;
}
.actions-list { margin: 0; padding: 0; list-style: none; }
.actions-list li {
  padding: 10px 0;
  border-top: 1px solid var(--border-soft);
}
.actions-list li:first-child { border-top: none; }
.action-title {
  font-weight: 500;
  color: var(--ink);
  margin-bottom: 2px;
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.action-difficulty {
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 3px;
  background: var(--surface-2);
  color: var(--ink-soft);
}
.action-difficulty.easy { background: var(--accent-soft); color: var(--accent-deep); }
.action-difficulty.moderate { background: #F0E5D1; color: #6B5634; }
.action-difficulty.involved { background: var(--warn-soft); color: var(--warn-deep); }
.action-why {
  font-size: 13.5px;
  color: var(--ink-muted);
  line-height: 1.5;
}

/* Letter fields modal */
.letter-fields-card {
  margin-top: 18px;
  padding: 18px 20px;
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-left: 3px solid var(--accent);
  border-radius: 10px;
}
.letter-fields-card h4 {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 16px;
  margin: 0 0 4px;
  color: var(--ink);
}
.letter-fields-card p.help {
  font-size: 13px;
  color: var(--ink-soft);
  margin: 0 0 12px;
}

/* ===== IEP upload + review ===== */

.iep-section {
  margin-top: 28px;
  padding-top: 24px;
  border-top: 2px solid var(--border-soft);
}

.iep-upload-zone {
  border: 2px dashed var(--border);
  border-radius: 12px;
  padding: 36px 24px;
  text-align: center;
  background: var(--surface);
  cursor: pointer;
  transition: all 0.15s ease;
  margin-top: 12px;
}
.iep-upload-zone:hover {
  border-color: var(--accent);
  background: var(--surface-2);
}
.iep-upload-zone.has-file {
  border-style: solid;
  border-color: var(--accent);
  background: var(--accent-soft);
}
.iep-upload-zone.drag-active {
  border-color: var(--action);
  background: var(--action-soft);
}
.iep-upload-icon {
  font-family: 'Fraunces', serif;
  font-size: 28px;
  color: var(--accent);
  margin-bottom: 8px;
}
.iep-upload-title {
  font-family: 'Fraunces', serif;
  font-size: 18px;
  font-weight: 500;
  color: var(--ink);
  margin: 0 0 4px;
}
.iep-upload-sub {
  font-size: 13px;
  color: var(--ink-soft);
}

.iep-processing {
  margin-top: 14px;
  padding: 18px 22px;
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: 10px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.iep-processing-text {
  font-size: 14.5px;
  color: var(--ink);
}
.iep-processing-stage {
  display: block;
  font-size: 12px;
  color: var(--ink-soft);
  margin-top: 2px;
}

.iep-error {
  margin-top: 14px;
  padding: 14px 18px;
  background: var(--warn-soft);
  border: 1px solid var(--warn);
  border-radius: 8px;
  font-size: 14px;
  color: var(--warn-deep);
}

.iep-flags-summary {
  margin-top: 16px;
  padding: 18px 22px;
  background: var(--accent-soft);
  border: 1px solid var(--accent);
  border-left: 3px solid var(--accent);
  border-radius: 10px;
}
.iep-flags-summary p { margin: 0; font-size: 15.5px; line-height: 1.55; color: var(--ink); }

.iep-flag-card {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: 10px;
  padding: 18px 20px;
  margin-bottom: 12px;
  position: relative;
}
.iep-flag-card.high { border-left: 3px solid var(--action); }
.iep-flag-card.medium { border-left: 3px solid #C9A87C; }
.iep-flag-card.low { border-left: 3px solid var(--border); }

.iep-flag-pri {
  display: inline-block;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 3px;
  margin-bottom: 8px;
}
.iep-flag-pri.high { background: var(--action-soft); color: var(--action-deep); }
.iep-flag-pri.medium { background: #F0E5D1; color: #6B5634; }
.iep-flag-pri.low { background: var(--border-soft); color: var(--ink-muted); }

.iep-flag-cats {
  font-size: 11px;
  color: var(--ink-soft);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
}
.iep-flag-shows {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 16px;
  color: var(--ink);
  margin: 0 0 6px;
  line-height: 1.4;
}
.iep-flag-why {
  font-size: 14.5px;
  color: var(--ink-muted);
  margin: 0 0 10px;
  line-height: 1.5;
}
.iep-flag-question {
  background: var(--accent-soft);
  border-radius: 6px;
  padding: 10px 12px;
  margin-top: 10px;
  font-size: 14.5px;
  color: var(--ink);
}
.iep-flag-question::before {
  content: 'Question for you: ';
  font-weight: 600;
  color: var(--accent-deep);
}
.iep-flag-textarea {
  width: 100%;
  font-family: 'Newsreader', serif;
  font-size: 14.5px;
  color: var(--ink);
  background: white;
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 8px 10px;
  margin-top: 8px;
  resize: vertical;
  min-height: 60px;
  line-height: 1.5;
}
.iep-flag-textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-soft);
}

.iep-aux {
  margin-top: 14px;
  padding: 14px 18px;
  background: var(--surface-2);
  border-radius: 8px;
  font-size: 13.5px;
}
.iep-aux h4 {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 14px;
  margin: 0 0 6px;
  color: var(--ink);
}
.iep-aux ul { margin: 4px 0 0; padding-left: 18px; color: var(--ink-muted); }
.iep-aux li { margin-bottom: 3px; }

.iep-trigger-row {
  display: flex;
  gap: 10px;
  align-items: center;
  margin: 10px 0 0;
}
`;

// ============================================================================
// COMPONENTS
// ============================================================================

// PRESERVED — the "What we're seeing" verdict panel. Not mounted in the chat
// flow as of clean-output-handoff; reserved with TRIAGE_PROMPT for the future
// "Quick IEP assessment" entry point. See CLAUDE.md. Do not delete as dead code.
function TriageSection({ result, loading }) {
  if (loading) {
    return (
      <div className="stage-block">
        <div className="stage-eyebrow">Reviewing your situation</div>
        <div className="checklist-loading">
          <span className="spinner" style={{ width: 16, height: 16, borderWidth: 2 }} />
          <span>Identifying which kinds of claim your situation fits…</span>
        </div>
      </div>
    );
  }
  if (!result) return null;

  const isColorable = result.claim_assessment === "colorable";
  return (
    <div className="stage-block">
      <div className="stage-eyebrow">What we're seeing</div>
      <h3 className="stage-title">
        {isColorable ? "Yes — this is worth filing." : "Let's narrow it down."}
      </h3>
      <div className="triage-card">
        <p className="triage-summary">{result.summary_for_parent}</p>
        {result.identified_categories?.map((c, i) => (
          <div key={i} className="triage-cat">
            <div className="triage-cat-label">{c.category?.replace(/_/g, " ")}</div>
            <p className="triage-cat-why">{c.why_it_fits_in_plain_language}</p>
            {c.key_facts_from_intake?.length > 0 && (
              <ul style={{ margin: "4px 0 0 16px", color: "var(--ink-muted)", fontSize: 13.5 }}>
                {c.key_facts_from_intake.map((f, j) => (
                  <li key={j}>{f}</li>
                ))}
              </ul>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

function DraftReview({ draft, edited, onEditChange, checks, onCheckChange, onRegenerate, drafting }) {
  const [editing, setEditing] = useState(false);
  if (drafting) {
    return (
      <div className="stage-block">
        <div className="stage-eyebrow">Drafting your complaint</div>
        <div className="checklist-loading">
          <span className="spinner" style={{ width: 16, height: 16, borderWidth: 2 }} />
          <span>First pass: writing in your voice. Second pass: cleaning up any lawyerly language…</span>
        </div>
      </div>
    );
  }
  if (!draft) return null;

  const finalText = edited != null ? edited : draft;
  const allChecked = checks.accuracy && checks.dates && checks.remedy;

  const downloadAsPdf = () => downloadPdf(finalText, "due-process-complaint.pdf");
  const copyToClipboard = () => {
    navigator.clipboard.writeText(finalText).then(() => alert("Copied."));
  };

  return (
    <div className="stage-block">
      <div className="stage-eyebrow">Your draft</div>
      <h3 className="stage-title">A draft complaint, in your voice.</h3>
      <p className="stage-lede">
        Read through carefully. Anywhere you see [PARENT TO ADD: …] is a spot
        you need to fill in before filing. Click "Edit directly" to make changes.
      </p>
      <p className="help">
        This draft was run through a second pass to soften any legal jargon and
        keep it in your voice. Read it over and tell me if anything still sounds
        off — I can revise.
      </p>

      {editing ? (
        <div className="draft-paper">
          <textarea
            value={finalText}
            onChange={(e) => onEditChange(e.target.value)}
            autoFocus
          />
        </div>
      ) : (
        <div className="draft-paper">{finalText}</div>
      )}

      <div style={{ display: "flex", gap: 10, marginTop: 12, flexWrap: "wrap" }}>
        <button className="btn btn-ghost" onClick={() => setEditing((e) => !e)}>
          {editing ? "Done editing" : "Edit directly"}
        </button>
        <button className="btn btn-ghost" onClick={onRegenerate}>
          Regenerate draft
        </button>
      </div>

      <div className="review-checks">
        <h4 style={{ fontFamily: "Fraunces, serif", fontWeight: 500, fontSize: 16, margin: "0 0 4px" }}>
          Before you file — final check
        </h4>
        <p style={{ fontSize: 13, color: "var(--ink-soft)", margin: "0 0 10px" }}>
          Once filed, this becomes part of a real legal proceeding. Confirm each.
        </p>
        <label className="review-check">
          <input type="checkbox" checked={checks.accuracy} onChange={(e) => onCheckChange("accuracy", e.target.checked)} />
          <span className="review-check-body">
            <strong>I read every paragraph.</strong> Everything accurately describes what's happened. Nothing was invented or misstated.
          </span>
        </label>
        <label className="review-check">
          <input type="checkbox" checked={checks.dates} onChange={(e) => onCheckChange("dates", e.target.checked)} />
          <span className="review-check-body">
            <strong>Dates and numbers are correct.</strong> IEP dates, meeting dates, service amounts, dollar figures — I checked them.
          </span>
        </label>
        <label className="review-check">
          <input type="checkbox" checked={checks.remedy} onChange={(e) => onCheckChange("remedy", e.target.checked)} />
          <span className="review-check-body">
            <strong>The remedy section says what I actually want.</strong>
          </span>
        </label>
      </div>

      {allChecked && (
        <div className="ready-card">
          <h4>Ready. Here's what to do next.</h4>
          <p>
            Download or copy the draft. File it by sending to the district AND
            to NYSED's Office of Special Education at the same time. Most NY
            districts accept email or mail — check your district's procedure.
            NYC DOE has its own filing portal (Impartial Hearing Office).
          </p>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            <button className="btn btn-primary" onClick={downloadAsPdf}>Download PDF</button>
            <button className="btn btn-ghost" onClick={copyToClipboard}>Copy to clipboard</button>
          </div>
        </div>
      )}
    </div>
  );
}

// Exact-spelling identity inputs. These are the only things collected by a form;
// every substantive fact lives in the chat-gathered intake.
const FORMAL_FIELD_DEFS = {
  parent_full_name: { label: "Your full legal name", placeholder: "e.g., Sarah Goldberg" },
  parent_address: { label: "Your mailing address", placeholder: "123 Main St, New Rochelle, NY 10801" },
  parent_email: { label: "Email", type: "email" },
  parent_phone: { label: "Phone" },
  child_full_name: { label: "Your child's full legal name", placeholder: "e.g., Jacob Goldberg" },
  child_dob: { label: "Your child's date of birth", type: "date" },
};

// One form for both the lighter letters (two names) and the full complaint (the
// full signature-block set). mode="letters" | "complaint" selects the field set,
// the required subset, and the framing copy. Writes into the shared formalFields
// store, so a name typed for a letter pre-populates the complaint and vice versa.
function FormalFieldsForm({ values, onChange, onSubmit, onCancel, mode, neededFor, childFirstName }) {
  const set = (k, v) => onChange((p) => ({ ...p, [k]: v }));

  const fields = mode === "complaint"
    ? ["parent_full_name", "parent_address", "parent_email", "parent_phone", "child_full_name", "child_dob"]
    : ["parent_full_name", "child_full_name"];
  const required = mode === "complaint"
    ? ["parent_full_name", "parent_address", "child_full_name"]
    : ["parent_full_name", "child_full_name"];
  const canSubmit = required.every((k) => (values[k] || "").trim());

  // Pre-fill child's full name with the first name from chat, if blank.
  useEffect(() => {
    if (childFirstName && !values.child_full_name) set("child_full_name", childFirstName + " ");
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [childFirstName]);

  const renderField = (k) => {
    const def = FORMAL_FIELD_DEFS[k];
    let label = def.label;
    let placeholder = def.placeholder;
    if (k === "child_full_name" && childFirstName) {
      label = childFirstName + "'s full legal name";
      placeholder = `${childFirstName} Goldberg`;
    }
    if (k === "child_dob" && childFirstName) label = childFirstName + "'s date of birth";
    return (
      <div className="field" key={k}>
        <label>{label}</label>
        <input
          type={def.type || "text"}
          value={values[k] || ""}
          onChange={(e) => set(k, e.target.value)}
          placeholder={placeholder}
        />
      </div>
    );
  };

  if (mode === "complaint") {
    return (
      <div className="stage-block">
        <div className="stage-eyebrow">Last step before drafting</div>
        <h3 className="stage-title">A few formal details.</h3>
        <p className="stage-lede">
          We need these for the caption and signature block of the complaint —
          the exact names and contact details that go on a filed document. The
          remedy and everything else we've already worked out in the chat. P.O.
          box is fine for the address.
        </p>
        <div className="drafter-form">
          <div className="drafter-section">
            <h4>For the caption and signature</h4>
            <p className="help">Required by NY procedure to identify who is filing on whose behalf.</p>
            {fields.map(renderField)}
          </div>
          <div style={{ display: "flex", gap: 10, marginTop: 16 }}>
            <button className="btn btn-primary" onClick={onSubmit} disabled={!canSubmit}>
              Generate the draft
            </button>
            {onCancel && (
              <button className="btn btn-ghost" onClick={onCancel}>Cancel</button>
            )}
          </div>
        </div>
      </div>
    );
  }

  const labelList = (neededFor || []).map((id) => OUTPUT_LIBRARY[id]?.label).filter(Boolean).join(", ");
  return (
    <div className="letter-fields-card">
      <h4>One last thing — full legal names for the letterhead</h4>
      <p className="help">
        I have {childFirstName || "your child"}'s first name from our chat, but for letters that get sent to the district, I want to make sure I have full legal names — both yours and {childFirstName ? childFirstName + "'s" : "your child's"}. This is the only piece I'll need that wasn't covered above.
      </p>
      <p className="help" style={{ marginTop: -8 }}>
        For: {labelList}.
      </p>
      {fields.map(renderField)}
      <button className="btn btn-primary" onClick={onSubmit} disabled={!canSubmit}>
        Generate the documents
      </button>
    </div>
  );
}

function OutputCard({ id, def, content, loading, onRegenerate }) {
  const [open, setOpen] = useState(true);
  const [editingText, setEditingText] = useState(null);
  const [editing, setEditing] = useState(false);

  const isError = content && typeof content === "object" && content.error;
  const isLetter = ["ten_day_notice", "iee_request", "evaluation_request", "cse_followup", "iep_rejection", "records_request"].includes(id);
  const isSummary = id === "claim_summary";
  const isChecklist = id === "document_checklist";
  const isActions = id === "action_recommendations";

  let status = "loading";
  let statusText = "preparing";
  if (isError) { status = "error"; statusText = "error"; }
  else if (content) { status = "ready"; statusText = "ready"; }

  const currentText = editingText != null ? editingText : (typeof content === "string" ? content : "");

  const downloadAsPdf = () => downloadPdf(currentText, `${id.replace(/_/g, "-")}.pdf`);
  const copyText = () => {
    navigator.clipboard.writeText(currentText).then(() => alert("Copied."));
  };

  return (
    <div className="output-card">
      <div className="output-head" onClick={() => setOpen((o) => !o)}>
        <div className="output-head-text">
          <p className="output-label">{def.label}</p>
          <p className="output-short">{def.short}</p>
        </div>
        <span className={`output-status ${status}`}>{statusText}</span>
        <span className={`output-chevron ${open ? "open" : ""}`}>▾</span>
      </div>

      {open && (
        <div className="output-body">
          {loading && (
            <div className="checklist-loading" style={{ marginTop: 0 }}>
              <span className="spinner" style={{ width: 14, height: 14, borderWidth: 2 }} />
              <span>Drafting…</span>
            </div>
          )}

          {isError && (
            <div style={{ color: "var(--warn-deep)", fontSize: 14 }}>
              {content.error}
              <button
                className="output-action-btn"
                style={{ marginLeft: 12 }}
                onClick={() => onRegenerate(id)}
              >
                Try again
              </button>
            </div>
          )}

          {!loading && !isError && content && (
            <>
              {(isLetter || isSummary) && (() => {
                const missing = extractPlaceholderLabels(currentText);
                return (
                <>
                  {missing.length > 0 && !editing && (
                    <div
                      style={{
                        background: "#FFF7D6",
                        border: "1px solid #EBD98A",
                        borderRadius: 8,
                        padding: "10px 12px",
                        marginBottom: 12,
                        fontSize: 13.5,
                        color: "var(--ink)",
                      }}
                    >
                      <strong style={{ fontWeight: 500 }}>You still need to fill in:</strong>{" "}
                      {missing.join(", ")}. They're highlighted below — click Edit to type them in.
                    </div>
                  )}
                  {editing ? (
                    <div className="output-letter">
                      <textarea
                        value={currentText}
                        onChange={(e) => setEditingText(e.target.value)}
                        autoFocus
                      />
                    </div>
                  ) : (
                    <div className={isLetter ? "output-letter" : "output-summary"}>
                      {renderWithPlaceholders(currentText, "oc" + id)}
                    </div>
                  )}
                  <div className="output-actions">
                    <button
                      className="output-action-btn"
                      onClick={() => setEditing((e) => !e)}
                    >
                      {editing ? "Done editing" : "Edit"}
                    </button>
                    <button className="output-action-btn primary" onClick={downloadAsPdf}>
                      Download PDF
                    </button>
                    <button className="output-action-btn" onClick={copyText}>
                      Copy
                    </button>
                    <button className="output-action-btn" onClick={() => onRegenerate(id)}>
                      Regenerate
                    </button>
                  </div>
                </>
                );
              })()}

              {isChecklist && content.groups && (
                <>
                  {content.intro && (
                    <p style={{ margin: "0 0 14px", color: "var(--ink-muted)", fontSize: 14 }}>
                      {content.intro}
                    </p>
                  )}
                  {content.groups.map((g, gi) => (
                    <div key={gi} style={{ marginBottom: 14 }}>
                      <h4 style={{ fontFamily: "Fraunces, serif", fontWeight: 500, fontSize: 14, margin: "0 0 4px" }}>
                        {g.title}
                      </h4>
                      {g.description && (
                        <p style={{ fontSize: 12.5, color: "var(--ink-soft)", margin: "0 0 8px", fontStyle: "italic" }}>
                          {g.description}
                        </p>
                      )}
                      <ul style={{ margin: 0, paddingLeft: 18, fontSize: 14, color: "var(--ink)" }}>
                        {g.items?.map((it) => (
                          <li key={it.id} style={{ marginBottom: 6, color: it.already_have ? "var(--ink-soft)" : "var(--ink)" }}>
                            <strong style={{ fontWeight: 500 }}>
                              {it.already_have ? "✓ " : ""}{it.label}
                            </strong>
                            {it.why && (
                              <div style={{ fontSize: 13, color: "var(--ink-muted)", marginTop: 2 }}>
                                {it.why}
                              </div>
                            )}
                          </li>
                        ))}
                      </ul>
                    </div>
                  ))}
                </>
              )}

              {isActions && content.actions && (
                <>
                  {content.intro && (
                    <p style={{ margin: "0 0 14px", color: "var(--ink-muted)", fontSize: 14 }}>
                      {content.intro}
                    </p>
                  )}
                  <ul className="actions-list">
                    {content.actions.map((a, i) => (
                      <li key={i}>
                        <div className="action-title">
                          <span>{a.title}</span>
                          {a.difficulty && (
                            <span className={`action-difficulty ${a.difficulty}`}>
                              {a.difficulty}
                            </span>
                          )}
                        </div>
                        <div className="action-why">{a.why}</div>
                      </li>
                    ))}
                  </ul>
                </>
              )}
            </>
          )}
        </div>
      )}
    </div>
  );
}

function OutputsPanel({ requested, outputs, loading, onRegenerate }) {
  if (!requested || requested.length === 0) return null;
  // Filter out full_complaint — that has its own dedicated section
  const items = requested.filter((id) => id !== "full_complaint" && OUTPUT_LIBRARY[id]);
  if (items.length === 0) return null;
  return (
    <div className="outputs-panel">
      <div className="stage-eyebrow">Your documents</div>
      <h3 className="stage-title">Things to take with you.</h3>
      <p className="stage-lede">
        Here's what I put together. Each one is a draft you can edit, download,
        or send. They expand and collapse — click a header to peek inside.
      </p>
      {items.map((id) => (
        <OutputCard
          key={id}
          id={id}
          def={OUTPUT_LIBRARY[id]}
          content={outputs[id]}
          loading={loading[id]}
          onRegenerate={onRegenerate}
        />
      ))}
    </div>
  );
}

function Checklist({ data, checked, onToggle, loading }) {
  if (loading) {
    return (
      <div className="checklist-loading">
        <span className="spinner" style={{ width: 16, height: 16, borderWidth: 2 }} />
        <span>Putting together a personalized document checklist for your case…</span>
      </div>
    );
  }
  if (!data || !data.groups) return null;

  const allItems = data.groups.flatMap((g) => g.items || []);
  const totalCount = allItems.length;
  const haveCount = allItems.filter(
    (it) => it.already_have || checked[it.id]
  ).length;

  return (
    <div className="checklist">
      <div className="checklist-head">
        <h3 className="checklist-title">Documents to gather</h3>
        <span className="checklist-progress">
          {haveCount} of {totalCount} ready
        </span>
      </div>
      {data.intro && <p className="checklist-intro">{data.intro}</p>}
      {data.groups.map((g, gi) => (
        <div key={gi} className="checklist-group">
          <h4>{g.title}</h4>
          {g.description && <p className="checklist-group-desc">{g.description}</p>}
          {g.items?.map((it) => {
            const isChecked = it.already_have || !!checked[it.id];
            return (
              <label
                key={it.id}
                className={`checklist-item ${isChecked ? "checked" : ""}`}
              >
                <input
                  type="checkbox"
                  checked={isChecked}
                  onChange={() => onToggle(it.id, !isChecked)}
                />
                <div className="checklist-item-body">
                  <div className="checklist-item-label">{it.label}</div>
                  {it.why && <div className="checklist-item-why">{it.why}</div>}
                </div>
              </label>
            );
          })}
        </div>
      ))}
    </div>
  );
}

// ============================================================================
// IEP UPLOAD + REVIEW
// PRESERVED — part of the quick-assessment pipeline; intentionally NOT mounted
// in the chat flow as of chat-as-primary. Reserved for a future "Quick IEP
// assessment" entry point. See CLAUDE.md. Do not delete as dead code.
// ============================================================================

function IEPSection({
  fileName,
  extraction,
  flags,
  flagAnswers,
  setFlagAnswers,
  processing,
  error,
  onUpload,
  onClear,
  onSubmitAnswers,
  onClose,
  childFirstName,
}) {
  const [dragActive, setDragActive] = useState(false);
  const inputRef = useRef(null);

  const handleFile = (file) => {
    if (!file) return;
    if (file.type !== "application/pdf" && !file.name.toLowerCase().endsWith(".pdf")) {
      alert("Please upload a PDF file.");
      return;
    }
    onUpload(file);
  };

  const handleDrop = (e) => {
    e.preventDefault();
    setDragActive(false);
    const f = e.dataTransfer?.files?.[0];
    if (f) handleFile(f);
  };

  const handleDragOver = (e) => { e.preventDefault(); setDragActive(true); };
  const handleDragLeave = (e) => { e.preventDefault(); setDragActive(false); };

  const noFile = !fileName && !processing && !error;
  const showResults = flags && flags.flags;

  return (
    <div className="iep-section">
      <div className="stage-eyebrow">Upload your IEP (optional)</div>
      <h3 className="stage-title">Want me to read the IEP?</h3>
      <p className="stage-lede">
        If you upload a PDF of {childFirstName || "your child"}'s current IEP, I'll
        pull out the specific facts that matter — service amounts, goals,
        classification, placement — and flag the things worth a closer look. Most
        of what I flag will come with a question I'll ask you, since the IEP
        alone usually can't tell us whether something is actually a problem.
      </p>

      {noFile && (
        <>
          <div
            className={`iep-upload-zone ${dragActive ? "drag-active" : ""}`}
            onClick={() => inputRef.current?.click()}
            onDrop={handleDrop}
            onDragOver={handleDragOver}
            onDragLeave={handleDragLeave}
          >
            <div className="iep-upload-icon">↑</div>
            <p className="iep-upload-title">Drop a PDF here, or click to browse</p>
            <p className="iep-upload-sub">PDF only · read in your browser, only the text is sent for analysis · max 4MB</p>
          </div>
          <input
            ref={inputRef}
            type="file"
            accept="application/pdf,.pdf"
            style={{ display: "none" }}
            onChange={(e) => handleFile(e.target.files?.[0])}
          />
          <div style={{ marginTop: 10, fontSize: 13, color: "var(--ink-soft)" }}>
            Don't have a PDF handy? <a href="#" onClick={(e) => { e.preventDefault(); onClose(); }}>Skip this for now</a> — you can always come back.
          </div>
        </>
      )}

      {processing && (
        <div className="iep-processing">
          <span className="spinner" style={{ width: 16, height: 16, borderWidth: 2 }} />
          <div>
            <div className="iep-processing-text">
              {processing === "extracting" ? "Reading the IEP…" : "Reviewing for things worth a closer look…"}
            </div>
            <span className="iep-processing-stage">
              {processing === "extracting"
                ? "Pulling out structured information — services, goals, classification, placement."
                : "Flagging facts that connect to recognized claim categories."}
            </span>
          </div>
        </div>
      )}

      {error && (
        <>
          <div className="iep-error">{error}</div>
          <div className="iep-trigger-row">
            <button className="btn btn-secondary" onClick={onClear}>Try a different file</button>
            <button className="btn btn-secondary" onClick={onClose}>Skip for now</button>
          </div>
        </>
      )}

      {showResults && (
        <>
          {flags.summary_for_parent && (
            <div className="iep-flags-summary">
              <p>{flags.summary_for_parent}</p>
            </div>
          )}

          {flags.flags && flags.flags.length > 0 && (
            <div style={{ marginTop: 14 }}>
              <h4 style={{ fontFamily: "Fraunces, serif", fontWeight: 500, fontSize: 17, margin: "0 0 10px", color: "var(--ink)" }}>
                What I'd look at
              </h4>
              {flags.flags.map((f, i) => (
                <div key={i} className={`iep-flag-card ${f.priority || "medium"}`}>
                  <span className={`iep-flag-pri ${f.priority || "medium"}`}>{f.priority || "medium"} priority</span>
                  {f.claim_categories?.length > 0 && (
                    <div className="iep-flag-cats">
                      {f.claim_categories.map((c) => c.replace(/_/g, " ")).join(" · ")}
                    </div>
                  )}
                  <p className="iep-flag-shows">{f.what_the_iep_shows}</p>
                  <p className="iep-flag-why">{f.why_this_might_matter}</p>
                  {f.supporting_iep_facts && f.supporting_iep_facts.length > 0 && (
                    <ul style={{ margin: "0 0 10px 16px", padding: 0, fontSize: 13, color: "var(--ink-soft)" }}>
                      {f.supporting_iep_facts.map((s, j) => <li key={j} style={{ marginBottom: 2 }}>{s}</li>)}
                    </ul>
                  )}
                  {f.question_for_parent && (
                    <>
                      <div className="iep-flag-question">{f.question_for_parent}</div>
                      <textarea
                        className="iep-flag-textarea"
                        rows={2}
                        placeholder="Your answer (optional — but helpful for the draft)"
                        value={flagAnswers[i] || ""}
                        onChange={(e) => setFlagAnswers((prev) => ({ ...prev, [i]: e.target.value }))}
                      />
                    </>
                  )}
                </div>
              ))}
            </div>
          )}

          {flags.things_that_look_okay && flags.things_that_look_okay.length > 0 && (
            <div className="iep-aux">
              <h4>Things that look fine on the IEP</h4>
              <ul>
                {flags.things_that_look_okay.map((t, i) => <li key={i}>{t}</li>)}
              </ul>
            </div>
          )}

          {flags.questions_to_strengthen_any_claim && flags.questions_to_strengthen_any_claim.length > 0 && (
            <div className="iep-aux">
              <h4>A few more general questions</h4>
              <ul>
                {flags.questions_to_strengthen_any_claim.map((q, i) => <li key={i}>{q}</li>)}
              </ul>
            </div>
          )}

          {flags.extraction_gaps_affecting_review && flags.extraction_gaps_affecting_review.length > 0 && (
            <div className="iep-aux" style={{ background: "var(--warn-soft)" }}>
              <h4>What I couldn't read clearly</h4>
              <ul>
                {flags.extraction_gaps_affecting_review.map((g, i) => <li key={i}>{g}</li>)}
              </ul>
            </div>
          )}

          <div className="iep-trigger-row" style={{ marginTop: 18 }}>
            <button className="btn btn-primary" onClick={onSubmitAnswers}>
              Use my answers in the draft
            </button>
            <button className="btn btn-secondary" onClick={onClear}>Upload a different IEP</button>
          </div>
          <p style={{ fontSize: 13, color: "var(--ink-soft)", marginTop: 8 }}>
            Your answers will get folded into the captured intake. The complaint draft will be able to reference specific facts from the IEP — service amounts, goal language, dates — alongside what you've told me.
          </p>
        </>
      )}
    </div>
  );
}

const OPENING =
  "Hi. I'm here to help you make sense of what's going on with your child's special education — what their documents actually say, where the district may be falling short, and what you can do about it, whether that's pushing back, getting something in writing, or filing if it comes to that.\n\nNo form to fill out. Just tell me what's going on in your own words, and if you've got a document like the IEP, you can attach it any time and I'll take a look.\n\nTo start — what's your child's first name, and what's been worrying you?";

// Render a message string with real paragraph and line breaks. Splits on blank
// lines into <p> paragraphs, converts single newlines to <br>, and renders
// **bold** spans. Keeps everything as safe React elements (no dangerouslySetHTML).
function renderInlineBold(text, keyPrefix) {
  // Split on **bold** markers
  const parts = text.split(/(\*\*[^*]+\*\*)/g);
  return parts.map((part, i) => {
    if (/^\*\*[^*]+\*\*$/.test(part)) {
      return <strong key={keyPrefix + "-b" + i}>{part.slice(2, -2)}</strong>;
    }
    return part;
  });
}

const PLACEHOLDER_RE = /\[PARENT TO ADD:[^\]]*\]/g;

// Render document text with [PARENT TO ADD: …] placeholders loudly highlighted
// so a parent can't miss the spots they need to fill in. Read-mode only — the
// edit textarea shows raw text. Whitespace/newlines are preserved by the
// container's CSS (white-space), so we render inline spans here.
function renderWithPlaceholders(text, keyPrefix) {
  const parts = String(text).split(/(\[PARENT TO ADD:[^\]]*\])/g);
  return parts.map((part, i) =>
    /^\[PARENT TO ADD:[^\]]*\]$/.test(part) ? (
      <mark
        key={keyPrefix + "-ph" + i}
        style={{ background: "#FCE96A", color: "var(--ink)", padding: "0 3px", borderRadius: 2, fontWeight: 500 }}
      >
        {part}
      </mark>
    ) : (
      part
    )
  );
}

// Pull the distinct fill-in labels out of a document (the text after
// "[PARENT TO ADD:"), for the "you still need to fill in" summary.
function extractPlaceholderLabels(text) {
  const matches = String(text).match(PLACEHOLDER_RE) || [];
  const labels = matches.map((m) =>
    m.replace(/^\[PARENT TO ADD:\s*/, "").replace(/\]$/, "").trim()
  );
  return Array.from(new Set(labels.filter(Boolean)));
}

function renderMessageText(content) {
  if (content == null) return null;
  const normalized = String(content).replace(/\r\n/g, "\n");
  // Split into paragraphs on one-or-more blank lines
  const paragraphs = normalized.split(/\n{2,}/);
  return paragraphs.map((para, pi) => {
    const lines = para.split("\n");
    const isLast = pi === paragraphs.length - 1;
    return (
      <p key={"p" + pi} style={{ margin: 0, marginBottom: isLast ? 0 : 10 }}>
        {lines.map((line, li) => (
          <span key={"l" + pi + "-" + li}>
            {renderInlineBold(line, "p" + pi + "l" + li)}
            {li < lines.length - 1 ? <br /> : null}
          </span>
        ))}
      </p>
    );
  });
}

  // Save state to window.storage on every change (after initial load).

    })();
  }, [loaded, messages, intake, chatState, waitChecks, checklist, checkedItems, triageResult, fullComplaintFormOpen, draft, draftEdited, reviewChecks, assessmentRequested, outputsRequested, outputs, formalFields, formalFieldsCollected, iepFileName, iepExtraction, iepFlags, iepFlagAnswers, uploadedDocs]);

  // Note: the personalized document checklist is now generated as part of the
  // outputs library (id "document_checklist") when the parent requests it,

  // The auto-run triage analysis (TRIAGE_PROMPT -> "What we're seeing" verdict)

  // component are PRESERVED (banner-commented) for the future "Quick IEP
  // assessment" entry point, which will run triage and mount it itself.
  // triageResult/triageLoading state is kept (the preserved processIEP reads it).

  // Scroll to the outputs panel the FIRST time outputs appear, so the parent
  // doesn't have to hunt for them after the chat says "you'll see below."

  useEffect(() => {
    if (outputsScrolledRef.current) return;
    if (!assessmentRequested) return;

      (k) => outputs[k] && (typeof outputs[k] === "string" || (typeof outputs[k] === "object" && !outputs[k].error))
    );

      } catch {}

  // OUTPUT LIBRARY GENERATION
  // ============================================================================

  const outputNeedsLetterFields = (id) => {
    const def = OUTPUT_LIBRARY[id];
    if (!def) return false;
    if (id === "full_complaint") return false;

  const getOutputPromptAndPayload = (outputId) => {
    const today = new Date().toISOString().slice(0, 10);

      today,
      parent_full_name: formalFields.parent_full_name || "[PARENT TO ADD: full name]",
      child_full_name: formalFields.child_full_name || "[PARENT TO ADD: child's full name]",

        .slice(-30)
        .filter((m) => m.role === "user" || m.role === "assistant")
        .map((m) => `${m.role === "user" ? "Parent" : "Assistant"}: ${m.content}`)
        .join("\n\n"),
    };
    const userMsg =
      "Generate the output described in the system prompt for this parent's situation.\n\nCONTEXT:\n" +
      JSON.stringify(sharedContext, null, 2);

    const promptMap = {
      ten_day_notice: TEN_DAY_NOTICE_PROMPT,
      iee_request: IEE_REQUEST_PROMPT,
      evaluation_request: EVALUATION_REQUEST_PROMPT,
      cse_followup: CSE_FOLLOWUP_PROMPT,
      iep_rejection: IEP_REJECTION_PROMPT,
      records_request: RECORDS_REQUEST_PROMPT,
      claim_summary: CLAIM_SUMMARY_PROMPT,
    };
    return { systemPrompt: promptMap[outputId], userMsg };
  };

  const generateOutput = async (outputId) => {
    if (outputs[outputId] || outputsLoading[outputId]) return;
    setOutputsLoading((s) => ({ ...s, [outputId]: true }));
    try {
      let result;
      if (outputId === "document_checklist") {
        result = await callClaudeForJSON(
          CHECKLIST_PROMPT,
          "Generate the personalized document checklist.\n\nINTAKE:\n" + JSON.stringify(intake, null, 2)
        );
      } else if (outputId === "action_recommendations") {
        result = await callClaudeForJSON(
          ACTION_RECOMMENDATIONS_PROMPT,
          "Generate action recommendations.\n\nINTAKE:\n" + JSON.stringify(intake, null, 2)
        );
      } else if (outputId === "full_complaint") {
        return; // handled by drafter form, not auto-generated
      } else {
        const { systemPrompt, userMsg } = getOutputPromptAndPayload(outputId);
        if (!systemPrompt) throw new Error("Unknown output type: " + outputId);
        result = await callClaudeForText(systemPrompt, userMsg);
      }
      setOutputs((o) => ({ ...o, [outputId]: result }));
    } catch (e) {
      setOutputs((o) => ({
        ...o,
        [outputId]: { error: e.message || "Couldn't generate this output." },
      }));
    } finally {
      setOutputsLoading((s) => ({ ...s, [outputId]: false }));
    }
  };
