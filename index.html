function IEPSection({
  fileName,
  extraction,
  flags,
  flagAnswers,
  setFlagAnswers,
  processing,
  error,
  onUpload,
  onClear,
  onSubmitAnswers,
  onClose,
  childFirstName,
}) {
  const [dragActive, setDragActive] = useState(false);
  const inputRef = useRef(null);

  const handleFile = (file) => {
    if (!file) return;
    if (file.type !== "application/pdf" && !file.name.toLowerCase().endsWith(".pdf")) {
      alert("Please upload a PDF file.");
      return;
    }
    onUpload(file);
  };

  const handleDrop = (e) => {
    e.preventDefault();
    setDragActive(false);
    const f = e.dataTransfer?.files?.[0];
    if (f) handleFile(f);
  };

  const handleDragOver = (e) => { e.preventDefault(); setDragActive(true); };
  const handleDragLeave = (e) => { e.preventDefault(); setDragActive(false); };

  const noFile = !fileName && !processing && !error;
  const showResults = flags && flags.flags;

  return (
    <div className="iep-section">
      <div className="stage-eyebrow">Upload your IEP (optional)</div>
      <h3 className="stage-title">Want me to read the IEP?</h3>
      <p className="stage-lede">
        If you upload a PDF of {childFirstName || "your child"}'s current IEP, I'll
        pull out the specific facts that matter — service amounts, goals,
        classification, placement — and flag the things worth a closer look. Most
        of what I flag will come with a question I'll ask you, since the IEP
        alone usually can't tell us whether something is actually a problem.
      </p>

      {noFile && (
        <>
          <div
            className={`iep-upload-zone ${dragActive ? "drag-active" : ""}`}
            onClick={() => inputRef.current?.click()}
            onDrop={handleDrop}
            onDragOver={handleDragOver}
            onDragLeave={handleDragLeave}
          >
            <div className="iep-upload-icon">↑</div>
            <p className="iep-upload-title">Drop a PDF here, or click to browse</p>
            <p className="iep-upload-sub">PDF only · stays on your device until processed · max 32MB</p>
          </div>
          <input
            ref={inputRef}
            type="file"
            accept="application/pdf,.pdf"
            style={{ display: "none" }}
            onChange={(e) => handleFile(e.target.files?.[0])}
          />
          <div style={{ marginTop: 10, fontSize: 13, color: "var(--ink-soft)" }}>
            Don't have a PDF handy? <a href="#" onClick={(e) => { e.preventDefault(); onClose(); }}>Skip this for now</a> — you can always come back.
          </div>
        </>
      )}

      {processing && (
        <div className="iep-processing">
          <span className="spinner" style={{ width: 16, height: 16, borderWidth: 2 }} />
          <div>
            <div className="iep-processing-text">
              {processing === "extracting" ? "Reading the IEP…" : "Reviewing for things worth a closer look…"}
            </div>
            <span className="iep-processing-stage">
              {processing === "extracting"
                ? "Pulling out structured information — services, goals, classification, placement."
                : "Flagging facts that connect to recognized claim categories."}
            </span>
          </div>
        </div>
      )}

      {error && (
        <>
          <div className="iep-error">{error}</div>
          <div className="iep-trigger-row">
            <button className="btn btn-secondary" onClick={onClear}>Try a different file</button>
            <button className="btn btn-secondary" onClick={onClose}>Skip for now</button>
          </div>
        </>
      )}

      {showResults && (
        <>
          {flags.summary_for_parent && (
            <div className="iep-flags-summary">
              <p>{flags.summary_for_parent}</p>
            </div>
          )}

          {flags.flags && flags.flags.length > 0 && (
            <div style={{ marginTop: 14 }}>
              <h4 style={{ fontFamily: "Fraunces, serif", fontWeight: 500, fontSize: 17, margin: "0 0 10px", color: "var(--ink)" }}>
                What I'd look at
              </h4>
              {flags.flags.map((f, i) => (
                <div key={i} className={`iep-flag-card ${f.priority || "medium"}`}>
                  <span className={`iep-flag-pri ${f.priority || "medium"}`}>{f.priority || "medium"} priority</span>
                  {f.claim_categories?.length > 0 && (
                    <div className="iep-flag-cats">
                      {f.claim_categories.map((c) => c.replace(/_/g, " ")).join(" · ")}
                    </div>
                  )}
                  <p className="iep-flag-shows">{f.what_the_iep_shows}</p>
                  <p className="iep-flag-why">{f.why_this_might_matter}</p>
                  {f.supporting_iep_facts && f.supporting_iep_facts.length > 0 && (
                    <ul style={{ margin: "0 0 10px 16px", padding: 0, fontSize: 13, color: "var(--ink-soft)" }}>
                      {f.supporting_iep_facts.map((s, j) => <li key={j} style={{ marginBottom: 2 }}>{s}</li>)}
                    </ul>
                  )}
                  {f.question_for_parent && (
                    <>
                      <div className="iep-flag-question">{f.question_for_parent}</div>
                      <textarea
                        className="iep-flag-textarea"
                        rows={2}
                        placeholder="Your answer (optional — but helpful for the draft)"
                        value={flagAnswers[i] || ""}
                        onChange={(e) => setFlagAnswers((prev) => ({ ...prev, [i]: e.target.value }))}
                      />
                    </>
                  )}
                </div>
              ))}
            </div>
          )}

          {flags.things_that_look_okay && flags.things_that_look_okay.length > 0 && (
            <div className="iep-aux">
              <h4>Things that look fine on the IEP</h4>
              <ul>
                {flags.things_that_look_okay.map((t, i) => <li key={i}>{t}</li>)}
              </ul>
            </div>
          )}

          {flags.questions_to_strengthen_any_claim && flags.questions_to_strengthen_any_claim.length > 0 && (
            <div className="iep-aux">
              <h4>A few more general questions</h4>
              <ul>
                {flags.questions_to_strengthen_any_claim.map((q, i) => <li key={i}>{q}</li>)}
              </ul>
            </div>
          )}

          {flags.extraction_gaps_affecting_review && flags.extraction_gaps_affecting_review.length > 0 && (
            <div className="iep-aux" style={{ background: "var(--warn-soft)" }}>
              <h4>What I couldn't read clearly</h4>
              <ul>
                {flags.extraction_gaps_affecting_review.map((g, i) => <li key={i}>{g}</li>)}
              </ul>
            </div>
          )}

          <div className="iep-trigger-row" style={{ marginTop: 18 }}>
            <button className="btn btn-primary" onClick={onSubmitAnswers}>
              Use my answers in the draft
            </button>
            <button className="btn btn-secondary" onClick={onClear}>Upload a different IEP</button>
          </div>
          <p style={{ fontSize: 13, color: "var(--ink-soft)", marginTop: 8 }}>
            Your answers will get folded into the captured intake. The complaint draft will be able to reference specific facts from the IEP — service amounts, goal language, dates — alongside what you've told me.
          </p>
        </>
      )}
    </div>
  );
}

const OPENING =
  "Hi. I'm here to help you figure out whether your child's situation supports a due process complaint, and if it does, to help draft one.\n\nNo form to fill out. We can save the formal details — full name, address, school district, and so on — for later if it makes sense to move forward. For now, I just need enough to assess whether there's a viable claim here.\n\nCan you tell me your child's first name, age, and what grade they're in?";

// Render a message string with real paragraph and line breaks. Splits on blank
// lines into <p> paragraphs, converts single newlines to <br>, and renders
// **bold** spans. Keeps everything as safe React elements (no dangerouslySetHTML).
function renderInlineBold(text, keyPrefix) {
  // Split on **bold** markers
  const parts = text.split(/(\*\*[^*]+\*\*)/g);
  return parts.map((part, i) => {
    if (/^\*\*[^*]+\*\*$/.test(part)) {
      return <strong key={keyPrefix + "-b" + i}>{part.slice(2, -2)}</strong>;
    }
    return part;
  });
}

function renderMessageText(content) {
  if (content == null) return null;
  const normalized = String(content).replace(/\r\n/g, "\n");
  // Split into paragraphs on one-or-more blank lines
  const paragraphs = normalized.split(/\n{2,}/);
  return paragraphs.map((para, pi) => {
    const lines = para.split("\n");
    const isLast = pi === paragraphs.length - 1;
    return (
      <p key={"p" + pi} style={{ margin: 0, marginBottom: isLast ? 0 : 10 }}>
        {lines.map((line, li) => (
          <span key={"l" + pi + "-" + li}>
            {renderInlineBold(line, "p" + pi + "l" + li)}
            {li < lines.length - 1 ? <br /> : null}
          </span>
        ))}
      </p>
    );
  });
}

function ChatTool() {
  const [messages, setMessages] = useState([
    { role: "assistant", content: OPENING },
  ]);
  const [intake, setIntake] = useState({});
  const [phase, setPhase] = useState("child");
  const [chatState, setChatState] = useState("continuing");
  const [waitChecks, setWaitChecks] = useState([]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [lastFailedMessage, setLastFailedMessage] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [checklist, setChecklist] = useState(null);
  const [checklistLoading, setChecklistLoading] = useState(false);
  const [checkedItems, setCheckedItems] = useState({});
  const [assessmentRequested, setAssessmentRequested] = useState(false);

  // Library outputs: outputs_to_generate is the parent-requested set; outputs is
  // the generated content keyed by output id; outputsLoading is per-id loading.
  const [outputsRequested, setOutputsRequested] = useState([]);
  const [outputs, setOutputs] = useState({});
  const [outputsLoading, setOutputsLoading] = useState({});
  // Minimum fields the parent provides for letter outputs (full name, etc.)
  const [letterFields, setLetterFields] = useState({
    parent_full_name: "",
    child_full_name: "",
  });
  const [letterFieldsCollected, setLetterFieldsCollected] = useState(false);

  // IEP upload + review
  const [iepFileName, setIepFileName] = useState(null);
  const [iepExtraction, setIepExtraction] = useState(null);
  const [iepFlags, setIepFlags] = useState(null);
  const [iepProcessing, setIepProcessing] = useState(null); // "extracting" | "flagging" | null
  const [iepError, setIepError] = useState(null);
  const [iepFlagAnswers, setIepFlagAnswers] = useState({}); // { flagIndex: "answer text" }
  const [iepUploadVisible, setIepUploadVisible] = useState(false);

  // Triage stage
  const [triageResult, setTriageResult] = useState(null);
  const [triageLoading, setTriageLoading] = useState(false);

  // Drafter stage
  const [drafterFormOpen, setDrafterFormOpen] = useState(false);
  const [drafterForm, setDrafterForm] = useState({
    parentName: "",
    parentAddress: "",
    parentEmail: "",
    parentPhone: "",
    studentFullName: "",
    studentDOB: "",
    districtName: "",
    remedy: "",
    priorWritten: "",
    evidence: [],
    pendency: "not_asserting",
    pendencyDetails: "",
  });
  const [drafting, setDrafting] = useState(false);
  const [draft, setDraft] = useState(null);
  const [draftChangelog, setDraftChangelog] = useState([]);
  const [draftEdited, setDraftEdited] = useState(null); // user edits override
  const [reviewChecks, setReviewChecks] = useState({
    accuracy: false,
    dates: false,
    remedy: false,
  });

  const threadRef = useRef();
  const inputRef = useRef();
  const outputsScrollRef = useRef();

  // Load saved state from window.storage on mount.
  useEffect(() => {
    let canceled = false;
    (async () => {
      try {
        if (typeof window !== "undefined" && window.storage) {
          const result = await window.storage.get(STORAGE_KEY);
          if (!canceled && result && result.value) {
            const saved = JSON.parse(result.value);
            if (saved.messages && saved.messages.length > 0) setMessages(saved.messages);
            if (saved.intake) setIntake(saved.intake);
            if (saved.phase) setPhase(saved.phase);
            if (saved.chatState) setChatState(saved.chatState);
            if (saved.waitChecks) {
              // Filter out any invalid wait-check values left over from earlier
              // sessions before the validation was added.
              setWaitChecks(saved.waitChecks.filter((w) => VALID_WAIT_CHECKS.includes(w)));
            }
            if (saved.checklist) setChecklist(saved.checklist);
            if (saved.checkedItems) setCheckedItems(saved.checkedItems);
            if (saved.assessmentRequested) setAssessmentRequested(saved.assessmentRequested);
            if (saved.outputsRequested) setOutputsRequested(saved.outputsRequested);
            if (saved.outputs) setOutputs(saved.outputs);
            if (saved.letterFields) setLetterFields((f) => ({ ...f, ...saved.letterFields }));
            if (saved.letterFieldsCollected) setLetterFieldsCollected(saved.letterFieldsCollected);
            if (saved.iepFileName) setIepFileName(saved.iepFileName);
            if (saved.iepExtraction) setIepExtraction(saved.iepExtraction);
            if (saved.iepFlags) setIepFlags(saved.iepFlags);
            if (saved.iepFlagAnswers) setIepFlagAnswers(saved.iepFlagAnswers);
            if (saved.triageResult) setTriageResult(saved.triageResult);
            if (saved.drafterFormOpen) setDrafterFormOpen(saved.drafterFormOpen);
            if (saved.drafterForm) setDrafterForm((d) => ({ ...d, ...saved.drafterForm }));
            if (saved.draft) setDraft(saved.draft);
            if (saved.draftChangelog) setDraftChangelog(saved.draftChangelog);
            if (saved.draftEdited) setDraftEdited(saved.draftEdited);
            if (saved.reviewChecks) setReviewChecks((r) => ({ ...r, ...saved.reviewChecks }));
          }
        }
      } catch (e) {
        // Storage miss or parse error — start fresh
      } finally {
        if (!canceled) setLoaded(true);
      }
    })();
    return () => { canceled = true; };
  }, []);

  // Save state to window.storage on every change (after initial load).
  useEffect(() => {
    if (!loaded) return;
    (async () => {
      try {
        if (typeof window !== "undefined" && window.storage) {
          await window.storage.set(
            STORAGE_KEY,
            JSON.stringify({
              messages, intake, phase, chatState, waitChecks, checklist, checkedItems,
              triageResult, drafterFormOpen, drafterForm, draft, draftChangelog, draftEdited, reviewChecks,
              assessmentRequested,
              outputsRequested, outputs, letterFields, letterFieldsCollected,
              iepFileName, iepExtraction, iepFlags, iepFlagAnswers,
            })
          );
        }
      } catch (e) {
        // Save failed — silent
      }
    })();
  }, [loaded, messages, intake, phase, chatState, waitChecks, checklist, checkedItems, triageResult, drafterFormOpen, drafterForm, draft, draftChangelog, draftEdited, reviewChecks, assessmentRequested, outputsRequested, outputs, letterFields, letterFieldsCollected, iepFileName, iepExtraction, iepFlags, iepFlagAnswers]);

  // Note: the personalized document checklist is now generated as part of the
  // outputs library (id "document_checklist") when the parent requests it,
  // not auto-generated on intake completion.

  // Auto-run triage analysis when parent has explicitly requested the assessment.
  useEffect(() => {
    if (!loaded) return;
    if (!assessmentRequested) return;
    if (triageResult || triageLoading) return;

    (async () => {
      setTriageLoading(true);
      try {
        const result = await callClaudeForJSON(
          TRIAGE_PROMPT,
          "Analyze this captured intake and identify the colorable claim categories.\n\nINTAKE:\n" +
            JSON.stringify(intake, null, 2)
        );
        setTriageResult(result);
      } catch (e) {
        // Silent fail; the user can still proceed
      } finally {
        setTriageLoading(false);
      }
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [assessmentRequested, loaded]);

  // Scroll to the outputs panel the FIRST time outputs appear, so the parent
  // doesn't have to hunt for them after the chat says "you'll see below."
  // Only triggers once when the first output completes — not on every change.
  const outputsScrolledRef = useRef(false);
  useEffect(() => {
    if (outputsScrolledRef.current) return;
    if (!assessmentRequested) return;
    const hasAtLeastOneOutput = Object.keys(outputs).some(
      (k) => outputs[k] && (typeof outputs[k] === "string" || (typeof outputs[k] === "object" && !outputs[k].error))
    );
    if (!hasAtLeastOneOutput) return;
    if (!outputsScrollRef.current) return;
    outputsScrolledRef.current = true;
    // Small delay so the DOM has the new content before we scroll
    setTimeout(() => {
      try {
        outputsScrollRef.current?.scrollIntoView({ behavior: "smooth", block: "start" });
      } catch {}
    }, 200);
  }, [outputs, assessmentRequested]);

  // Pre-fill drafter form with what we already know when it first opens
  useEffect(() => {
    if (!drafterFormOpen) return;
    setDrafterForm((d) => ({
      ...d,
      districtName: d.districtName || intake.district_name || "",
      studentFullName: d.studentFullName ||
        (intake.student_first_name ? intake.student_first_name + " " : ""),
      evidence: d.evidence.length > 0 ? d.evidence : (intake.evidence_available || []),
    }));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [drafterFormOpen]);

  // ============================================================================
  // OUTPUT LIBRARY GENERATION
  // ============================================================================

  const outputNeedsLetterFields = (id) => {
    const def = OUTPUT_LIBRARY[id];
    if (!def) return false;
    if (id === "full_complaint") return false;
    return def.min_fields && def.min_fields.length > 0;
  };

  const getOutputPromptAndPayload = (outputId) => {
    const today = new Date().toISOString().slice(0, 10);
    const sharedContext = {
      today,
      parent_full_name: letterFields.parent_full_name || "[PARENT TO ADD: full name]",
      child_full_name: letterFields.child_full_name || "[PARENT TO ADD: child's full name]",
      captured_intake: intake,
      district_name: intake.district_name || "[PARENT TO ADD: district name]",
      chat_excerpt: messages
        .slice(-30)
        .filter((m) => m.role === "user" || m.role === "assistant")
        .map((m) => `${m.role === "user" ? "Parent" : "Assistant"}: ${m.content}`)
        .join("\n\n"),
    };
    const userMsg =
      "Generate the output described in the system prompt for this parent's situation.\n\nCONTEXT:\n" +
      JSON.stringify(sharedContext, null, 2);

    const promptMap = {
      ten_day_notice: TEN_DAY_NOTICE_PROMPT,
      iee_request: IEE_REQUEST_PROMPT,
      evaluation_request: EVALUATION_REQUEST_PROMPT,
      cse_followup: CSE_FOLLOWUP_PROMPT,
      iep_rejection: IEP_REJECTION_PROMPT,
      records_request: RECORDS_REQUEST_PROMPT,
      claim_summary: CLAIM_SUMMARY_PROMPT,
    };
    return { systemPrompt: promptMap[outputId], userMsg };
  };

  const generateOutput = async (outputId) => {
    if (outputs[outputId] || outputsLoading[outputId]) return;
    setOutputsLoading((s) => ({ ...s, [outputId]: true }));
    try {
      let result;
      if (outputId === "document_checklist") {
        result = await callClaudeForJSON(
          CHECKLIST_PROMPT,
          "Generate the personalized document checklist.\n\nINTAKE:\n" + JSON.stringify(intake, null, 2)
        );
      } else if (outputId === "action_recommendations") {
        result = await callClaudeForJSON(
          ACTION_RECOMMENDATIONS_PROMPT,
          "Generate action recommendations.\n\nINTAKE:\n" + JSON.stringify(intake, null, 2)
        );
      } else if (outputId === "full_complaint") {
        return; // handled by drafter form, not auto-generated
      } else {
        const { systemPrompt, userMsg } = getOutputPromptAndPayload(outputId);
        if (!systemPrompt) throw new Error("Unknown output type: " + outputId);
        result = await callClaudeForText(systemPrompt, userMsg);
      }
      setOutputs((o) => ({ ...o, [outputId]: result }));
    } catch (e) {
      setOutputs((o) => ({
        ...o,
        [outputId]: { error: e.message || "Couldn't generate this output." },
      }));
    } finally {
      setOutputsLoading((s) => ({ ...s, [outputId]: false }));
    }
  };

  // When outputsRequested changes (and letter fields are collected if needed),
  // generate any pending outputs.
  useEffect(() => {
    if (!loaded) return;
    if (outputsRequested.length === 0) return;
    const pendingLetters = outputsRequested.filter(
      (id) => outputNeedsLetterFields(id) && !outputs[id] && !outputsLoading[id]
    );
    if (pendingLetters.length > 0 && !letterFieldsCollected) return;
    for (const id of outputsRequested) {
      if (id === "full_complaint") continue;
      if (!outputs[id] && !outputsLoading[id]) {
        generateOutput(id);
      }
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [outputsRequested, letterFieldsCollected, loaded]);

  // ============================================================================
  // IEP UPLOAD PROCESSING
  // ============================================================================

  const processIEP = async (file) => {
    setIepError(null);
    setIepFileName(file.name);
    setIepProcessing("extracting");
    try {
      if (file.size > MAX_PDF_BYTES) {
        const limitMB = (MAX_PDF_BYTES / (1024 * 1024)).toFixed(1);
        throw new Error(
          `PDF is too large (limit ${limitMB}MB). Many free online tools — Adobe Compress PDF, ilovepdf.com — will shrink it.`
        );
      }
      const base64 = await fileToBase64(file);

      // Stage A — extraction. One call to claude.js with the PDF. ~15-25s.
      const extraction = await callClaudeWithPDF(
        IEP_EXTRACT_PROMPT,
        base64,
        "Extract this IEP into the structured schema described in the system prompt. Return ONLY the JSON object."
      );
      setIepExtraction(extraction);

      // Now flagging — show that stage in the spinner.
      setIepProcessing("flagging");

      // Build parent context from existing intake + chat.
      const parentContext = {
        concerns_freetext: intake.concerns_summary || "",
        considering_private_placement: intake.private_placement_status === "considering",
        already_in_private_placement: intake.private_placement_status === "enrolled",
        child_making_progress: intake.child_making_progress || "unsure",
        services_actually_happening: intake.services_actually_happening || "unsure",
        has_private_evaluation: (intake.evidence_available || []).includes("private_evaluation"),
        triage_categories: triageResult?.identified_categories?.map((c) => c.category) || [],
      };

      // Stage B — flagging. A second, separate call to claude.js (text only). ~10-20s.
      // Splitting extraction and flagging into two requests keeps each one well
      // under the 30s function limit.
      const flags = await callClaudeForJSON(
        IEP_FLAG_PROMPT,
        "Identify the most relevant facts in this IEP that could support a colorable due process claim, and pair each with a question for the parent.\n\n" +
          "iep_extraction:\n" +
          JSON.stringify(extraction, null, 2) +
          "\n\nparent_context:\n" +
          JSON.stringify(parentContext, null, 2)
      );
      setIepFlags(flags);
      setIepProcessing(null);
    } catch (e) {
      const msg = (e && e.message) || "unknown error";
      // Give a more specific hint if it looks like a timeout
      const isTimeout = /timeout|timed out|504|502|gateway/i.test(msg);
      setIepError(
        isTimeout
          ? "The IEP took too long to process — this usually means the file is very large or has many pages. Try a smaller or compressed PDF, or skip this step and just tell me about the IEP in the chat."
          : "Couldn't process the IEP — " + msg + ". You can try again, try a different file, or skip this step."
      );
      setIepProcessing(null);
    }
  };

  // When the parent answers an IEP follow-up question, append the answer to
  // the chat's intake notes so it flows into the drafter.
  const submitIepAnswers = () => {
    const lines = [];
    if (iepFlags?.flags) {
      iepFlags.flags.forEach((f, i) => {
        const ans = iepFlagAnswers[i];
        if (!ans || !ans.trim()) return;
        lines.push(`Re: ${f.what_the_iep_shows}\nQ: ${f.question_for_parent}\nA: ${ans.trim()}`);
      });
    }
    if (lines.length === 0) {
      // Just close the panel without enriching intake
      setIepUploadVisible(false);
      return;
    }
    const combined = lines.join("\n\n");
    // Merge into intake.concerns_summary so the drafter can see it
    setIntake((prev) => ({
      ...prev,
      concerns_summary:
        (prev.concerns_summary || "") +
        "\n\n[ADDITIONAL CONTEXT FROM IEP REVIEW]\n" +
        combined,
      iep_review_notes: combined, // also store separately for clarity
    }));
    setIepUploadVisible(false);
  };

  const clearIEP = () => {
    setIepFileName(null);
    setIepExtraction(null);
    setIepFlags(null);
    setIepFlagAnswers({});
    setIepError(null);
    setIepProcessing(null);
  };

  const runDrafter = async (formData) => {
    setError(null);
    setDrafting(true);
    try {
      const today = new Date().toISOString().slice(0, 10);
      const fullPayload = {
        today,
        parent: {
          full_name: formData.parentName,
          address: formData.parentAddress,
          email: formData.parentEmail,
          phone: formData.parentPhone,
        },
        student: {
          full_name: formData.studentFullName,
          date_of_birth: formData.studentDOB,
          first_name: intake.student_first_name,
          age: intake.student_age,
          grade: intake.student_grade,
          school: intake.student_school,
          classification: intake.student_classification,
        },
        district: {
          name: formData.districtName,
          is_nyc_doe: intake.is_nyc_doe,
        },
        captured_intake: intake,
        triage_categories: triageResult?.identified_categories,
        iep_extraction: iepExtraction || null,
        iep_flags: iepFlags?.flags || null,
        iep_flag_answers: Object.keys(iepFlagAnswers).length > 0 ? iepFlagAnswers : null,
        chat_transcript_excerpt: messages
          .slice(-30)
          .map((m) => `${m.role === "user" ? "Parent" : "Assistant"}: ${m.content}`)
          .join("\n\n"),
        remedy: formData.remedy,
        prior_written_communications: formData.priorWritten,
        evidence_parent_has: formData.evidence,
        pendency_assertion: formData.pendency,
        pendency_details: formData.pendencyDetails,
      };

      // Stage 1: generate draft
      const stage1 = await callClaudeForText(
        DRAFTER_PROMPT,
        "Draft the due process complaint based on the following information. Return only the letter text.\n\n" +
          JSON.stringify(fullPayload, null, 2)
      );

      // Stage 2: de-lawyer
      const cleaned = await callClaudeForJSON(DELAWYER_PROMPT, stage1);

      setDraft(cleaned.cleaned_draft || stage1);
      setDraftChangelog(cleaned.changes_made || []);
      setDraftEdited(null);
      setReviewChecks({ accuracy: false, dates: false, remedy: false });
    } catch (e) {
      setError("Couldn't generate the draft — " + (e.message || "unknown error"));
    } finally {
      setDrafting(false);
    }
  };

  // Auto-resume on load: if the thread ends with a user message that never got
  // a response (e.g., reload while the API call was in flight), kick off the
  // call now so the user isn't stuck looking at their own unanswered message.
  useEffect(() => {
    if (!loaded || loading) return;
    if (messages.length === 0) return;
    const last = messages[messages.length - 1];
    if (last.role !== "user") return;

    (async () => {
      setLoading(true);
      try {
        await processCall(messages);
      } catch (e) {
        setError(
          (e.message || "Couldn't reach the assistant.") +
            " — Click retry below or send a new message."
        );
        setLastFailedMessage(last.content);
      } finally {
        setLoading(false);
      }
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loaded]);

  useEffect(() => {
    if (threadRef.current) threadRef.current.scrollTop = threadRef.current.scrollHeight;
  }, [messages, loading]);

  useEffect(() => {
    inputRef.current?.focus();
  }, [loading, chatState]);

  // Run a Claude call against the given message history and update state with the result.
  // Used by both send() (for new messages) and retryLast() (for retrying after an error).
  const processCall = async (msgs) => {
    const baseSystem =
      CHAT_INTAKE_PROMPT +
      "\n\n--- INTAKE STATE SO FAR ---\n" +
      JSON.stringify(intake, null, 2);

    let parsed;
    try {
      parsed = await callClaude(msgs, baseSystem);
    } catch (firstErr) {
      // One silent retry
      parsed = await callClaude(msgs, baseSystem);
    }

    const updatedIntake = mergeIntake(intake, parsed.intake_updates || {});
    setIntake(updatedIntake);
    if (parsed.current_phase) setPhase(parsed.current_phase);
    setChatState(parsed.state || "continuing");

    // Once the parent requests the assessment, latch it on permanently.
    if (parsed.parent_requested_assessment === true) {
      setAssessmentRequested(true);
    }

    // Merge any new outputs the parent has asked for. Don't replace — append.
    if (Array.isArray(parsed.outputs_to_generate) && parsed.outputs_to_generate.length > 0) {
      setOutputsRequested((existing) => {
        const valid = parsed.outputs_to_generate.filter((id) => OUTPUT_LIBRARY[id]);
        return Array.from(new Set([...existing, ...valid]));
      });
    }

    // Validate wait-check against whitelist — model occasionally returns "null"
    // as a string or other invalid values that shouldn't display.
    const validWaitCheck = VALID_WAIT_CHECKS.includes(parsed.wait_check_just_surfaced)
      ? parsed.wait_check_just_surfaced
      : null;
    if (validWaitCheck) {
      setWaitChecks((w) => Array.from(new Set([...w, validWaitCheck])));
    }

    setMessages((current) => [
      ...current,
      {
        role: "assistant",
        content: parsed.chat_reply || "(no reply)",
        waitCheck: validWaitCheck,
      },
    ]);
  };

  const send = async (textOverride = null) => {
    const text = (textOverride ?? input).trim();
    if (!text || loading) return;
    setError(null);
    setLastFailedMessage(null);

    const newMsgs = [...messages, { role: "user", content: text }];
    setMessages(newMsgs);
    setInput("");
    setLoading(true);

    try {
      await processCall(newMsgs);
    } catch (e) {
      setError(
        (e.message || "Couldn't reach the assistant.") +
          " — Click retry below or send a new message."
      );
      setLastFailedMessage(text);
    } finally {
      setLoading(false);
    }
  };

  const retryLast = async () => {
    if (loading) return;
    setError(null);
    setLoading(true);
    try {
      // The user message is already in the thread — just retry the API call against it
      await processCall(messages);
      setLastFailedMessage(null);
    } catch (e) {
      setError(
        (e.message || "Still couldn't reach the assistant.") +
          " — Try again or send a new message."
      );
    } finally {
      setLoading(false);
    }
  };

  const affirmRecap = () => send("Yes, that all looks right.");
  const continueChat = () => {
    setChatState("continuing");
    inputRef.current?.focus();
  };

  const reset = async () => {
    if (!confirm("Start fresh? This clears the saved conversation.")) return;

    // Reset all React state immediately so the user sees clean state even
    // before the storage delete completes.
    setMessages([{ role: "assistant", content: OPENING }]);
    setIntake({});
    setPhase("child");
    setChatState("continuing");
    setWaitChecks([]);
    setError(null);
    setLastFailedMessage(null);
    setChecklist(null);
    setCheckedItems({});
    setTriageResult(null);
    setDrafterFormOpen(false);
    setDrafterForm({
      parentName: "", parentAddress: "", parentEmail: "", parentPhone: "",
      studentFullName: "", studentDOB: "", districtName: "",
      remedy: "", priorWritten: "", evidence: [],
      pendency: "not_asserting", pendencyDetails: "",
    });
    setDraft(null);
    setDraftChangelog([]);
    setDraftEdited(null);
    setReviewChecks({ accuracy: false, dates: false, remedy: false });
    setAssessmentRequested(false);
    setOutputsRequested([]);
    setOutputs({});
    setOutputsLoading({});
    setLetterFields({ parent_full_name: "", child_full_name: "" });
    setLetterFieldsCollected(false);
    setIepFileName(null);
    setIepExtraction(null);
    setIepFlags(null);
    setIepFlagAnswers({});
    setIepError(null);
    setIepProcessing(null);
    setIepUploadVisible(false);
    outputsScrolledRef.current = false;

    // Clear all saved state across both storage backends and any key version.
    try {
      if (typeof window !== "undefined" && window.storage) {
        await window.storage.delete(STORAGE_KEY).catch(() => {});
        await window.storage.delete("filing_path_demo:state_v1").catch(() => {});
        await window.storage.delete("filing_path_demo:state_v2").catch(() => {});
        // Enumerate and delete anything else with our prefixes
        for (const prefix of ["plainly:", "filing_path_demo:"]) {
          try {
            const result = await window.storage.list(prefix);
            if (result && result.keys) {
              for (const k of result.keys) {
                await window.storage.delete(k).catch(() => {});
              }
            }
          } catch {}
        }
      }
      // Also wipe any stale entries left in localStorage by older versions
      if (typeof localStorage !== "undefined") {
        const stale = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && (k.indexOf("plainly:") === 0 || k.indexOf("filing_path_demo:") === 0)) {
            stale.push(k);
          }
        }
        stale.forEach((k) => localStorage.removeItem(k));
      }
    } catch {}

    // Force a full page reload so any in-flight effects can't restore old state
    setTimeout(() => {
      try { window.location.reload(); } catch {}
    }, 100);
  };

  return (
    <>
      <style>{CHAT_STYLES}</style>
      <div className="shell">
        <div className="head">
          <div className="brand" style={{ fontFamily: "Fraunces, serif", fontSize: 16, fontWeight: 500, color: "var(--ink-muted)" }}>
            Guided intake
          </div>
          <button
            onClick={reset}
            style={{
              marginLeft: "auto",
              background: "transparent",
              border: "none",
              color: "var(--ink-soft)",
              fontSize: 12,
              fontFamily: "inherit",
              cursor: "pointer",
              textDecoration: "underline",
              textUnderlineOffset: 3,
              padding: 0,
            }}
            title="Clear the saved conversation and start over"
          >
            Start fresh
          </button>
        </div>

        <h1>
          Tell me what's <em>going on</em>.
        </h1>
        <p className="lede">
          Describe your situation in your own words. I'll ask questions, flag
          anything time-sensitive right away, and put together documents you
          can use when I have enough.
        </p>

        <PhaseBar phase={phase} />

        <div className="thread" ref={threadRef}>
          {messages.map((m, i) => (
            <div
              key={i}
              style={{
                display: "flex",
                flexDirection: "column",
                alignItems: m.role === "user" ? "flex-end" : "flex-start",
              }}
            >
              <div className={`bubble ${m.role === "user" ? "parent" : "assistant"}`}>
                {renderMessageText(m.content)}
              </div>
              {m.waitCheck && (
                <div className="wait-flag">
                  Wait-check fired: {m.waitCheck.replace(/_/g, " ")}
                </div>
              )}
            </div>
          ))}
          {loading && (
            <div className="typing">
              <span className="tdot" />
              <span className="tdot" />
              <span className="tdot" />
            </div>
          )}
        </div>

        {error && (
          <div className="error">
            <div style={{ marginBottom: 8 }}>{error}</div>
            {lastFailedMessage && (
              <button
                className="btn btn-ghost"
                style={{ fontSize: 13, padding: "6px 12px", marginRight: 0 }}
                onClick={retryLast}
              >
                Retry that message
              </button>
            )}
          </div>
        )}

        {chatState === "ready_to_recap" && (
          <div className="affirm">
            <p>Does that summary look right? Or keep typing below if there's more.</p>
            <button className="btn btn-primary" onClick={affirmRecap}>
              Yes, that's right
            </button>
            <button className="btn btn-ghost" onClick={continueChat}>
              No, let me add something
            </button>
          </div>
        )}

        {chatState === "thin_offer_guidance" && (
          <div className="thin">
            <h3>Worth gathering more information first</h3>
            <p style={{ margin: 0, color: "var(--warn-deep)" }}>
              The chat above has specific suggestions. You can keep talking if
              there's more to share, or come back when you have more documents
              in hand.
            </p>
            <div style={{ marginTop: 12 }}>
              <button className="btn btn-ghost" onClick={continueChat}>
                Keep chatting — I have more
              </button>
            </div>
          </div>
        )}

        <div className="composer">
            <textarea
              ref={inputRef}
              value={input}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={(e) => {
                if (e.key === "Enter" && !e.shiftKey) {
                  e.preventDefault();
                  send();
                }
              }}
              placeholder={
                loading
                  ? "Thinking..."
                  : chatState === "complete"
                  ? "Ask a question about filing, timing, or alternatives..."
                  : "Type your message... (Enter to send)"
              }
              rows={1}
              disabled={loading}
            />
            <button
              className="send"
              onClick={() => send()}
              disabled={!input.trim() || loading}
              aria-label="Send"
            >
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
                <line x1="22" y1="2" x2="11" y2="13" />
                <polygon points="22 2 15 22 11 13 2 9 22 2" />
              </svg>
            </button>
          </div>

        {/* LETTER FIELDS PROMPT — first, so the parent can complete and see outputs ASAP */}
        {assessmentRequested && !letterFieldsCollected && (() => {
          const pending = outputsRequested.filter(
            (id) => OUTPUT_LIBRARY[id]?.min_fields?.length > 0 && id !== "full_complaint" && !outputs[id] && !outputsLoading[id]
          );
          if (pending.length === 0) return null;
          return (
            <LetterFieldsForm
              values={letterFields}
              onChange={setLetterFields}
              onSubmit={() => setLetterFieldsCollected(true)}
              neededFor={pending}
              childFirstName={intake.student_first_name}
            />
          );
        })()}

        {/* OUTPUTS PANEL — appears immediately when parent requests outputs */}
        {assessmentRequested && outputsRequested.length > 0 && (
          <div ref={outputsScrollRef}>
            <OutputsPanel
              requested={outputsRequested}
              outputs={outputs}
              loading={outputsLoading}
              onRegenerate={(id) => {
                setOutputs((o) => {
                  const newO = { ...o };
                  delete newO[id];
                  return newO;
                });
                setTimeout(() => generateOutput(id), 50);
              }}
            />
          </div>
        )}

        {/* TRIAGE — supporting context, below outputs */}
        {assessmentRequested && (
          <TriageSection result={triageResult} loading={triageLoading} />
        )}

        {/* FULL COMPLAINT FLOW — triggered when full_complaint is requested */}
        {assessmentRequested && outputsRequested.includes("full_complaint") && !drafterFormOpen && !draft && !drafting && (
          <div className="ready-card" style={{ marginTop: 20 }}>
            <h4>Ready to prepare the full complaint?</h4>
            <p>
              For the full draft I'll need a few formal details — your full
              name, address, your child's full name and DOB, and a clear
              statement of what you're asking for.
            </p>
            <button className="btn btn-primary" onClick={() => setDrafterFormOpen(true)}>
              Continue
            </button>
          </div>
        )}

        {drafterFormOpen && !draft && !drafting && (
          <DrafterForm
            values={drafterForm}
            onChange={setDrafterForm}
            onSubmit={() => runDrafter(drafterForm)}
            onCancel={() => setDrafterFormOpen(false)}
          />
        )}

        {(drafting || draft) && (
          <DraftReview
            draft={draft}
            edited={draftEdited}
            onEditChange={setDraftEdited}
            changelog={draftChangelog}
            checks={reviewChecks}
            onCheckChange={(k, v) => setReviewChecks((r) => ({ ...r, [k]: v }))}
            onRegenerate={() => runDrafter(drafterForm)}
            drafting={drafting}
          />
        )}

        <CapturedIntake intake={intake} />

        {!iepUploadVisible && !iepFlags && (
          <div style={{ marginTop: 14 }}>
            <button
              className="btn btn-secondary"
              onClick={() => setIepUploadVisible(true)}
              style={{ fontSize: 14 }}
            >
              📄 Upload {intake.student_first_name ? intake.student_first_name + "'s" : "your child's"} IEP for review
            </button>
          </div>
        )}

        {!iepUploadVisible && iepFlags && (
          <div style={{ marginTop: 14, padding: "10px 14px", background: "var(--accent-soft)", borderRadius: 6, fontSize: 13.5, color: "var(--ink-muted)" }}>
            ✓ IEP reviewed{iepFileName ? ` (${iepFileName})` : ""} — {iepFlags?.flags?.length || 0} item{iepFlags?.flags?.length === 1 ? "" : "s"} flagged.{" "}
            <a href="#" onClick={(e) => { e.preventDefault(); setIepUploadVisible(true); }} style={{ color: "var(--accent)" }}>View again</a>
          </div>
        )}

        {iepUploadVisible && (
          <IEPSection
            fileName={iepFileName}
            extraction={iepExtraction}
            flags={iepFlags}
            flagAnswers={iepFlagAnswers}
            setFlagAnswers={setIepFlagAnswers}
            processing={iepProcessing}
            error={iepError}
            onUpload={processIEP}
            onClear={clearIEP}
            onSubmitAnswers={submitIepAnswers}
            onClose={() => setIepUploadVisible(false)}
            childFirstName={intake.student_first_name}
          />
        )}

        {waitChecks.filter((w) => VALID_WAIT_CHECKS.includes(w)).length > 0 && (
          <div style={{ marginTop: 12, fontSize: 12, color: "var(--ink-soft)" }}>
            Wait-checks fired this session:{" "}
            <span style={{ color: "var(--warn-deep)", fontWeight: 500 }}>
              {waitChecks
                .filter((w) => VALID_WAIT_CHECKS.includes(w))
                .join(", ")
                .replace(/_/g, " ")}
            </span>
          </div>
        )}

        <div className="disclaimer">
          Demo of the chat intake stage only. The full app continues from here
          to triage analysis, IEP review, and complaint drafting. This tool is
          not legal advice.
        </div>
      </div>
    </>
  );
}

function StartPage() {
  return (
    <div className="page-wide fade-in" style={{ paddingTop: 24, paddingBottom: 60 }}>
      <ChatTool />
    </div>
  );
}

// ============================================================================
// 404
// ============================================================================

function NotFoundPage() {
  return (
    <div className="page fade-in" style={{ textAlign: "center" }}>
      <div className="eyebrow">Not found</div>
      <h1 className="display" style={{ fontSize: 42 }}>That page doesn't exist.</h1>
      <p className="lede">Try one of these instead:</p>
      <div className="btn-row" style={{ justifyContent: "center" }}>
        <button className="btn btn-primary" onClick={() => go("/")}>Home</button>
        <button className="btn btn-secondary" onClick={() => go("/start")}>Start the chat</button>
      </div>
    </div>
  );
}

// ============================================================================
// MAIN APP
// ============================================================================

function App() {
  const route = useRoute();

  let page;
  switch (route) {
    case "/": page = <HomePage />; break;
    case "/start": page = <StartPage />; break;
    case "/how": page = <HowPage />; break;
    case "/who": page = <WhoPage />; break;
    case "/faq": page = <FaqPage />; break;
    case "/resources": page = <ResourcesPage />; break;
    case "/about": page = <AboutPage />; break;
    case "/contact": page = <ContactPage />; break;
    case "/privacy": page = <PrivacyPage />; break;
    default: page = <NotFoundPage />;
  }

  return (
    <>
      <style>{STYLES}</style>
      <div className="app-root">
        <Header route={route} />
        {page}
        <Footer />
      </div>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
