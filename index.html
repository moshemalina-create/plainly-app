const OPENING =
  "Hi. I'm here to help you make sense of what's going on with your child's special education — what their documents actually say, where the district may be falling short, and what you can do about it, whether that's pushing back, getting something in writing, or filing if it comes to that.\n\nNo form to fill out. Just tell me what's going on in your own words, and if you've got a document like the IEP, you can attach it any time and I'll take a look.\n\nTo start — what's your child's first name, and what's been worrying you?";

// Spanish opening (item 5). Stated up front — the legal drafts are prepared in
// English (that's how districts process them) but explained in Spanish. Uses
// NYSED terms of art ("queja de debido proceso", "aviso por escrito de 10 días").
const OPENING_ES =
  "Hola. Estoy aquí para ayudarle a entender lo que está pasando con la educación especial de su hijo — lo que realmente dicen sus documentos, dónde el distrito podría estar fallando, y qué puede hacer al respecto, ya sea reclamar, obtener algo por escrito, o presentar una queja si llega a eso.\n\nNo hay ningún formulario que llenar. Solo cuénteme qué está pasando con sus propias palabras, y si tiene un documento como el IEP, puede adjuntarlo en cualquier momento y le echaré un vistazo.\n\nUna nota: los documentos legales que preparemos — la queja de debido proceso, las cartas al distrito, el aviso por escrito de 10 días — los redactaré en inglés, porque así es como los distritos y el Departamento de Educación del Estado los procesan. Pero le explicaré todo sobre ellos en español, en cada paso.\n\nPara empezar — ¿cuál es el nombre de su hijo y qué le ha estado preocupando?";

// The Spanish language directive appended to the chat's system prompt when the
// site language is ES (item 5). Drives Spanish conversation; the drafted legal
// documents themselves stay English. Full text mirrored in docs §5b.
const CHAT_LANGUAGE_ES = "\n\n--- LANGUAGE: SPANISH ---\nThe parent is using the site in Spanish. Conduct this entire conversation in warm, plain, natural Spanish — every message you write to the parent must be in Spanish, including greetings and follow-ups. Keep the site's voice: warm, direct, encouraging, plain-spoken, never bureaucratic. Do not switch to English unless the parent writes to you in English.\n\nFor special-education terms of art, use the Spanish terminology New York State uses in its parent materials, keeping the English acronym in parentheses on first use so the parent can recognize the term on district paperwork — e.g. \"IEP\" (Programa de Educación Individualizada), \"queja de debido proceso\" (due process complaint), \"reunión de resolución\", \"comité de educación especial (CSE)\", \"mediación\", \"reembolso de matrícula\".\n\nIMPORTANT — the legal documents you help prepare (the due-process complaint, letters to the district, the 10-day notice) are written in ENGLISH, because that is the language school districts and the State Education Department process them in. You will still explain everything about them — what each says, why it matters, what to do with it — in Spanish, at every step. When it comes up naturally (and briefly in your opening), say this warmly, as reassurance, not as a disclaimer. Never translate the drafted legal documents themselves into Spanish.";

// Honest, recap-derived opening for a returning parent's fresh chat: states what
// was done (the recap), is candid that we don't know what they did since, and
// invites an update. Thin-history fallback when there's no meaningful recap yet.
function buildReturnOpening(recap) {
  const r = (recap || "").trim();
  if (!r) {
    return "Welcome back. We'd started talking through your situation, but didn't get far enough last time for me to summarize it. Where would you like to pick up?";
  }
  return r + "\n\nI've got the context from our earlier conversations — but I don't know what's happened since we last talked. Tell me where things stand now, or what you'd like to work on, and we'll go from there.";
}

// Regenerate recap/narrative at most once per page load on an authenticated
// return (see AccountPage). Module-level so it survives account-page remounts
// within the same page load; a genuine return is a new page load.
let accountRegeneratedThisLoad = false;

// Render a message string with real paragraph and line breaks. Splits on blank
// lines into <p> paragraphs, converts single newlines to <br>, and renders
// **bold** spans. Keeps everything as safe React elements (no dangerouslySetHTML).
// Turn bare http/https URLs in a plain-text run into clickable <a> elements.
// Returns an array of strings + <a> React elements (NOT HTML) so it stays
// inside React's auto-escaping — no innerHTML, no injection surface. Links open
// in a new tab (users have in-progress chat/draft state) with noopener noreferrer.
// Only http(s) is linked; trailing sentence punctuation is peeled back out of the
// href so a period or closing paren ending the sentence isn't swallowed into it.
function linkify(text, keyPrefix) {
  const segments = String(text).split(/(https?:\/\/[^\s<]+)/g);
  return segments.map((seg, i) => {
    if (i % 2 === 0) return seg; // even segments are the surrounding text
    const trailing = (seg.match(/[.,;:!?)\]}'"]+$/) || [""])[0];
    const url = trailing ? seg.slice(0, seg.length - trailing.length) : seg;
    return (
      <React.Fragment key={keyPrefix + "-a" + i}>
        <a href={url} target="_blank" rel="noopener noreferrer" className="chat-link">{url}</a>
        {trailing}
      </React.Fragment>
    );
  });
}

function renderInlineBold(text, keyPrefix) {
  // Split on **bold** markers
  const parts = text.split(/(\*\*[^*]+\*\*)/g);
  return parts.map((part, i) => {
    if (/^\*\*[^*]+\*\*$/.test(part)) {
      return <strong key={keyPrefix + "-b" + i}>{part.slice(2, -2)}</strong>;
    }
    return linkify(part, keyPrefix + "-" + i);
  });
}

const PLACEHOLDER_RE = /\[PARENT TO ADD:[^\]]*\]/g;

// Render document text with [PARENT TO ADD: …] placeholders loudly highlighted
// so a parent can't miss the spots they need to fill in. Read-mode only — the
// edit textarea shows raw text. Whitespace/newlines are preserved by the
// container's CSS (white-space), so we render inline spans here.
function renderWithPlaceholders(text, keyPrefix) {
  const parts = String(text).split(/(\[PARENT TO ADD:[^\]]*\])/g);
  return parts.map((part, i) =>
    /^\[PARENT TO ADD:[^\]]*\]$/.test(part) ? (
      <mark
        key={keyPrefix + "-ph" + i}
        style={{ background: "#FCE96A", color: "var(--ink)", padding: "0 3px", borderRadius: 2, fontWeight: 500 }}
      >
        {part}
      </mark>
    ) : (
      part
    )
  );
}

// Pull the distinct fill-in labels out of a document (the text after
// "[PARENT TO ADD:"), for the "you still need to fill in" summary.
function extractPlaceholderLabels(text) {
  const matches = String(text).match(PLACEHOLDER_RE) || [];
  const labels = matches.map((m) =>
    m.replace(/^\[PARENT TO ADD:\s*/, "").replace(/\]$/, "").trim()
  );
  return Array.from(new Set(labels.filter(Boolean)));
}

function renderMessageText(content) {
  if (content == null) return null;
  const normalized = String(content).replace(/\r\n/g, "\n");
  // Split into paragraphs on one-or-more blank lines
  const paragraphs = normalized.split(/\n{2,}/);
  return paragraphs.map((para, pi) => {
    const lines = para.split("\n");
    const isLast = pi === paragraphs.length - 1;
    return (
      <p key={"p" + pi} style={{ margin: 0, marginBottom: isLast ? 0 : 10 }}>
        {lines.map((line, li) => (
          <span key={"l" + pi + "-" + li}>
            {renderInlineBold(line, "p" + pi + "l" + li)}
            {li < lines.length - 1 ? <br /> : null}
          </span>
        ))}
      </p>
    );
  });
}

function ChatTool() {
  const { lang } = useLang();
  // Fresh-chat greeting follows the site language (item 5). A restored session or
  // a returning-parent recap opening (below) overrides this; toggling mid-chat
  // never wipes an in-progress conversation — only new turns go Spanish.
  const [messages, setMessages] = useState([
    { role: "assistant", content: lang === "es" ? OPENING_ES : OPENING },
  ]);
  const [intake, setIntake] = useState({});
  const [chatState, setChatState] = useState("continuing");
  const [waitChecks, setWaitChecks] = useState([]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [lastFailedMessage, setLastFailedMessage] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [checklist, setChecklist] = useState(null);
  const [checklistLoading, setChecklistLoading] = useState(false);
  const [checkedItems, setCheckedItems] = useState({});
  const [assessmentRequested, setAssessmentRequested] = useState(false);

  // Library outputs: outputs_to_generate is the parent-requested set; outputs is
  // the generated content keyed by output id; outputsLoading is per-id loading.
  const [outputsRequested, setOutputsRequested] = useState([]);
  const [outputs, setOutputs] = useState({});
  const [outputsLoading, setOutputsLoading] = useState({});
  // Formal, exact-spelling identity fields the parent types into a form — never
  // gathered in chat (the canonical-intake split: substantive facts live in
  // `intake`, transcription-only identity lives here). Lighter outputs use the
  // two name fields; full_complaint uses all six. Injected read-only into the
  // chat's system context (see processCall) so the chat never re-asks them.
  const [formalFields, setFormalFields] = useState({
    parent_full_name: "",
    parent_address: "",
    parent_email: "",
    parent_phone: "",
    child_full_name: "",
    child_dob: "",
  });
  const [formalFieldsCollected, setFormalFieldsCollected] = useState(false);

  // --- Accounts (Step 2): durable per-user persistence to Supabase, layered on
  // top of the ephemeral sessionStorage mirror. Anonymous users never touch
  // Supabase — every path below is gated on `authUser`.
  const { user: authUser, authLoading } = useAuth();
  const [caseLoaded, setCaseLoaded] = useState(false);      // server case-load attempted
  const [caseSessionId, setCaseSessionId] = useState(null); // current sessions row id
  const [parentNotes, setParentNotes] = useState("");       // parent-authored notes (account page)
  const hadLocalSessionRef = useRef(false);                 // did this tab already hold a convo?
  const sessionCreatingRef = useRef(false);                 // guards concurrent session inserts

  // IEP upload + review
  const [iepFileName, setIepFileName] = useState(null);
  const [iepExtraction, setIepExtraction] = useState(null);
  const [iepFlags, setIepFlags] = useState(null);
  const [iepProcessing, setIepProcessing] = useState(null); // "extracting" | "flagging" | null
  const [iepError, setIepError] = useState(null);
  const [iepFlagAnswers, setIepFlagAnswers] = useState({}); // { flagIndex: "answer text" }
  const [iepUploadVisible, setIepUploadVisible] = useState(false);

  // Documents the parent has attached in the chat. Each is { name, text } where
  // text is the browser-extracted PDF text. This feeds the chat's system prompt
  // every turn (see processCall) so the assistant can reference the documents
  // naturally. Distinct from the preserved IEP-assessment pipeline (iep* state).
  const [uploadedDocs, setUploadedDocs] = useState([]);
  // Step 3: shallow headlines of documents reviewed in PRIOR sessions, loaded
  // from the server on return. Injected into the chat so it recognizes a
  // document it no longer holds in full and can ask for re-upload when a task
  // needs specifics (see processCall + CHAT_ADVOCATE_PROMPT).
  const [docsReviewed, setDocsReviewed] = useState([]);
  const [attachError, setAttachError] = useState(null);
  const [attaching, setAttaching] = useState(false);

  // Triage stage
  const [triageResult, setTriageResult] = useState(null);
  const [triageLoading, setTriageLoading] = useState(false);

  // Full-complaint stage. The identity fields live in formalFields (shared with
  // lighter outputs); this flag just toggles the formal-details form open.
  const [fullComplaintFormOpen, setFullComplaintFormOpen] = useState(false);
  const [drafting, setDrafting] = useState(false);
  const [draft, setDraft] = useState(null);
  const [draftEdited, setDraftEdited] = useState(null); // user edits override
  const [reviewChecks, setReviewChecks] = useState({
    accuracy: false,
    dates: false,
    remedy: false,
  });

  const threadRef = useRef();
  const inputRef = useRef();
  const outputsScrollRef = useRef();
  const attachRef = useRef();

  // Load saved state from window.storage on mount.
  useEffect(() => {
    // Return-chat handoff from the account page (Continue): start a FRESH session
    // whose first message is the honest, recap-derived opening, ignoring any
    // saved local chat. Supabase intake hydration (below) still runs, and the
    // narrative injects server-side on the first turn (Commit 3).
    let returnOpening = null;
    try { returnOpening = sessionStorage.getItem("plainly:return_opening"); } catch (e) {}
    if (returnOpening) {
      try { sessionStorage.removeItem("plainly:return_opening"); } catch (e) {}
      setMessages([{ role: "assistant", content: returnOpening }]);
      setCaseSessionId(null);              // first persist creates a new session row
      hadLocalSessionRef.current = false;  // allow Supabase intake/formalFields hydration
      setLoaded(true);
      return;
    }

    let canceled = false;
    (async () => {
      try {
        if (typeof window !== "undefined" && window.storage) {
          const result = await window.storage.get(STORAGE_KEY);
          if (!canceled && result && result.value) {
            const saved = JSON.parse(result.value);
            if (saved.messages && saved.messages.length > 0) {
              setMessages(saved.messages);
              hadLocalSessionRef.current = true;
            }
            if (saved.caseSessionId) setCaseSessionId(saved.caseSessionId);
            if (saved.intake) setIntake(saved.intake);
            if (saved.chatState) setChatState(saved.chatState);
            if (saved.waitChecks) {
              // Filter out any invalid wait-check values left over from earlier
              // sessions before the validation was added.
              setWaitChecks(saved.waitChecks.filter((w) => VALID_WAIT_CHECKS.includes(w)));
            }
            if (saved.checklist) setChecklist(saved.checklist);
            if (saved.checkedItems) setCheckedItems(saved.checkedItems);
            if (saved.assessmentRequested) setAssessmentRequested(saved.assessmentRequested);
            if (saved.outputsRequested) setOutputsRequested(saved.outputsRequested);
            if (saved.outputs) setOutputs(saved.outputs);
            // Migrate the pre-canonical-intake `letterFields` blob into formalFields.
            const savedFormal = saved.formalFields || saved.letterFields;
            if (savedFormal) setFormalFields((f) => ({ ...f, ...savedFormal }));
            if (saved.formalFieldsCollected || saved.letterFieldsCollected)
              setFormalFieldsCollected(saved.formalFieldsCollected || saved.letterFieldsCollected);
            if (saved.iepFileName) setIepFileName(saved.iepFileName);
            if (saved.iepExtraction) setIepExtraction(saved.iepExtraction);
            if (saved.iepFlags) setIepFlags(saved.iepFlags);
            if (saved.iepFlagAnswers) setIepFlagAnswers(saved.iepFlagAnswers);
            if (saved.uploadedDocs) setUploadedDocs(saved.uploadedDocs);
            if (saved.triageResult) setTriageResult(saved.triageResult);
            if (saved.fullComplaintFormOpen || saved.drafterFormOpen) setFullComplaintFormOpen(true);
            if (saved.draft) setDraft(saved.draft);
            if (saved.draftEdited) setDraftEdited(saved.draftEdited);
            if (saved.reviewChecks) setReviewChecks((r) => ({ ...r, ...saved.reviewChecks }));
          }
        }
      } catch (e) {
        // Storage miss or parse error — start fresh
      } finally {
        if (!canceled) setLoaded(true);
      }
    })();
    return () => { canceled = true; };
  }, []);

  // Save state to window.storage on every change (after initial load).
  useEffect(() => {
    if (!loaded) return;
    (async () => {
      try {
        if (typeof window !== "undefined" && window.storage) {
          await window.storage.set(
            STORAGE_KEY,
            JSON.stringify({
              messages, intake, chatState, waitChecks, checklist, checkedItems,
              triageResult, fullComplaintFormOpen, draft, draftEdited, reviewChecks,
              assessmentRequested,
              outputsRequested, outputs, formalFields, formalFieldsCollected,
              iepFileName, iepExtraction, iepFlags, iepFlagAnswers,
              uploadedDocs, caseSessionId,
            })
          );
        }
      } catch (e) {
        // Save failed — silent
      }
    })();
  }, [loaded, messages, intake, chatState, waitChecks, checklist, checkedItems, triageResult, fullComplaintFormOpen, draft, draftEdited, reviewChecks, assessmentRequested, outputsRequested, outputs, formalFields, formalFieldsCollected, iepFileName, iepExtraction, iepFlags, iepFlagAnswers, uploadedDocs, caseSessionId]);

  // --- Accounts (Step 2) — durable Supabase persistence for authenticated users.
  // Hydrate case facts on an authenticated return (a fresh tab/visit with no
  // in-tab conversation); mirror case state back on change. Anonymous users and
  // a missing/failed client skip all of it.
  useEffect(() => {
    if (!loaded || caseLoaded) return;
    if (authLoading) return;                                  // wait for auth to resolve
    if (!sb || !authUser) { setCaseLoaded(true); return; }    // anonymous → nothing to load
    let active = true;
    (async () => {
      try {
        const { data } = await sb.from("cases")
          .select("intake, formal_fields, parent_notes, docs_reviewed")
          .eq("user_id", authUser.id)
          .maybeSingle();
        if (active && data) {
          // parent_notes is case-level — load it regardless, so the chat can use it.
          if (typeof data.parent_notes === "string") setParentNotes(data.parent_notes);
          // docs_reviewed (shallow headlines) — also load regardless, so even a
          // mid-tab reload keeps the prior-document context the chat speaks to.
          if (Array.isArray(data.docs_reviewed)) setDocsReviewed(data.docs_reviewed);
          // Hydrate facts only on a genuine return (no live in-tab conversation);
          // a mid-tab reload keeps its in-tab state untouched.
          if (!hadLocalSessionRef.current) {
            if (data.intake && Object.keys(data.intake).length) setIntake(data.intake);
            if (data.formal_fields) setFormalFields((f) => ({ ...f, ...data.formal_fields }));
          }
        }
      } catch (e) { /* offline / no row yet — fall back to a fresh chat */ }
      if (active) setCaseLoaded(true);
    })();
    return () => { active = false; };
  }, [loaded, caseLoaded, authLoading, authUser]);

  // Mirror to Supabase (debounced). Writes only once there's a real conversation,
  // so logging in and looking around — or hitting "Start fresh" — never creates
  // an empty row or wipes a saved case.
  const caseSaveTimer = useRef(null);
  const persistCase = async () => {
    if (!sb || !authUser) return;
    const meaningful =
      (intake && Object.keys(intake).length > 0) || messages.some((m) => m.role === "user");
    if (!meaningful) return;
    const now = new Date().toISOString();
    try {
      await sb.from("cases").upsert(
        { user_id: authUser.id, intake, formal_fields: formalFields, updated_at: now },
        { onConflict: "user_id" }
      );
      if (caseSessionId) {
        await sb.from("sessions")
          .update({ transcript: messages, updated_at: now })
          .eq("id", caseSessionId);
      } else if (!sessionCreatingRef.current) {
        sessionCreatingRef.current = true;
        const { data, error } = await sb.from("sessions")
          .insert({ user_id: authUser.id, transcript: messages, updated_at: now })
          .select("id")
          .single();
        if (!error && data) setCaseSessionId(data.id);
        sessionCreatingRef.current = false;
      }
    } catch (e) {
      sessionCreatingRef.current = false;
      /* silent — the sessionStorage mirror still holds this turn */
    }
  };
  useEffect(() => {
    if (!loaded || !caseLoaded) return;
    if (!sb || !authUser) return;                             // anonymous → no Supabase writes
    if (caseSaveTimer.current) clearTimeout(caseSaveTimer.current);
    caseSaveTimer.current = setTimeout(persistCase, 1200);
    return () => { if (caseSaveTimer.current) clearTimeout(caseSaveTimer.current); };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loaded, caseLoaded, authUser, intake, formalFields, messages]);

  // Note: the personalized document checklist is now generated as part of the
  // outputs library (id "document_checklist") when the parent requests it,
  // not auto-generated on intake completion.

  // The auto-run triage analysis (TRIAGE_PROMPT -> "What we're seeing" verdict)
  // was removed here: under chat-as-primary the chat handles claim recognition
  // conversationally, so an unsolicited structured verdict is exactly the
  // pattern we removed from the upload flow. TRIAGE_PROMPT and the TriageSection
  // component are PRESERVED (banner-commented) for the future "Quick IEP
  // assessment" entry point, which will run triage and mount it itself.
  // triageResult/triageLoading state is kept (the preserved processIEP reads it).

  // Scroll to the outputs panel the FIRST time outputs appear, so the parent
  // doesn't have to hunt for them after the chat says "you'll see below."
  // Only triggers once when the first output completes — not on every change.
  const outputsScrolledRef = useRef(false);
  useEffect(() => {
    if (outputsScrolledRef.current) return;
    if (!assessmentRequested) return;
    const hasAtLeastOneOutput = Object.keys(outputs).some(
      (k) => outputs[k] && (typeof outputs[k] === "string" || (typeof outputs[k] === "object" && !outputs[k].error))
    );
    if (!hasAtLeastOneOutput) return;
    if (!outputsScrollRef.current) return;
    outputsScrolledRef.current = true;
    // Small delay so the DOM has the new content before we scroll
    setTimeout(() => {
      try {
        outputsScrollRef.current?.scrollIntoView({ behavior: "smooth", block: "start" });
      } catch {}
    }, 200);
  }, [outputs, assessmentRequested]);

  // ============================================================================
  // OUTPUT LIBRARY GENERATION
  // ============================================================================

  const outputNeedsLetterFields = (id) => {
    const def = OUTPUT_LIBRARY[id];
    if (!def) return false;
    if (id === "full_complaint") return false;
    return def.min_fields && def.min_fields.length > 0;
  };

  const getOutputPromptAndPayload = (outputId) => {
    const today = new Date().toISOString().slice(0, 10);
    const sharedContext = {
      today,
      parent_full_name: formalFields.parent_full_name || "[PARENT TO ADD: full name]",
      child_full_name: formalFields.child_full_name || "[PARENT TO ADD: child's full name]",
      captured_intake: intake,
      district_name: intake.district_name || "[PARENT TO ADD: district name]",
      chat_excerpt: messages
        .slice(-30)
        .filter((m) => m.role === "user" || m.role === "assistant")
        .map((m) => `${m.role === "user" ? "Parent" : "Assistant"}: ${m.content}`)
        .join("\n\n"),
    };
    const userMsg =
      "Generate the output described in the system prompt for this parent's situation.\n\nCONTEXT:\n" +
      JSON.stringify(sharedContext, null, 2);

    const promptMap = {
      ten_day_notice: TEN_DAY_NOTICE_PROMPT,
      iee_request: IEE_REQUEST_PROMPT,
      evaluation_request: EVALUATION_REQUEST_PROMPT,
      cse_followup: CSE_FOLLOWUP_PROMPT,
      iep_rejection: IEP_REJECTION_PROMPT,
      records_request: RECORDS_REQUEST_PROMPT,
      claim_summary: CLAIM_SUMMARY_PROMPT,
    };
    return { systemPrompt: promptMap[outputId], userMsg };
  };

  const generateOutput = async (outputId) => {
    if (outputs[outputId] || outputsLoading[outputId]) return;
    setOutputsLoading((s) => ({ ...s, [outputId]: true }));
    try {
      let result;
      if (outputId === "document_checklist") {
        result = await callClaudeForJSON(
          CHECKLIST_PROMPT,
          "Generate the personalized document checklist.\n\nINTAKE:\n" + JSON.stringify(intake, null, 2)
        );
      } else if (outputId === "action_recommendations") {
        result = await callClaudeForJSON(
          ACTION_RECOMMENDATIONS_PROMPT,
          "Generate action recommendations.\n\nINTAKE:\n" + JSON.stringify(intake, null, 2)
        );
      } else if (outputId === "full_complaint") {
        return; // handled by drafter form, not auto-generated
      } else {
        const { systemPrompt, userMsg } = getOutputPromptAndPayload(outputId);
        if (!systemPrompt) throw new Error("Unknown output type: " + outputId);
        result = await callClaudeForText(systemPrompt, userMsg);
      }
      setOutputs((o) => ({ ...o, [outputId]: result }));
      // Step 3: persist letter/summary outputs (string content → a PDF letter)
      // to the per-user bucket. Structured outputs (checklist, action
      // recommendations) are objects rendered as lists, not letter PDFs, so
      // they're skipped. Auth-only; filename matches OutputCard's download name.
      if (sb && authUser && typeof result === "string" && result.trim()) {
        const fn = `${outputId.replace(/_/g, "-")}.pdf`;
        const blob = pdfBlobFromText(result);
        if (blob) saveGeneratedDoc(authUser.id, fn, blob).catch(() => {});
      }
    } catch (e) {
      setOutputs((o) => ({
        ...o,
        [outputId]: { error: e.message || "Couldn't generate this output." },
      }));
    } finally {
      setOutputsLoading((s) => ({ ...s, [outputId]: false }));
    }
  };

  // When outputsRequested changes (and letter fields are collected if needed),
  // generate any pending outputs.
  useEffect(() => {
    if (!loaded) return;
    if (outputsRequested.length === 0) return;
    const pendingLetters = outputsRequested.filter(
      (id) => outputNeedsLetterFields(id) && !outputs[id] && !outputsLoading[id]
    );
    if (pendingLetters.length > 0 && !formalFieldsCollected) return;
    for (const id of outputsRequested) {
      if (id === "full_complaint") continue;
      if (!outputs[id] && !outputsLoading[id]) {
        generateOutput(id);
      }
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [outputsRequested, formalFieldsCollected, loaded]);

  // ============================================================================
  // IEP UPLOAD PROCESSING
  // PRESERVED — Stage A + Stage B structured assessment. As of chat-as-primary
  // this is intentionally not called from the chat flow (no UI mounts it).
  // Reserved for a future "Quick IEP assessment" entry point. See CLAUDE.md.
  // processIEP, submitIepAnswers, and clearIEP below all belong to this
  // preserved pipeline. Do not delete as dead code.
  // ============================================================================

  const processIEP = async (file) => {
    setIepError(null);
    setIepFileName(file.name);
    setIepProcessing("extracting");
    try {
      if (file.size > MAX_PDF_BYTES) {
        const limitMB = (MAX_PDF_BYTES / (1024 * 1024)).toFixed(1);
        throw new Error(
          `PDF is too large (limit ${limitMB}MB). Many free online tools — Adobe Compress PDF, ilovepdf.com — will shrink it.`
        );
      }

      // Step 1 — extract the PDF text IN THE BROWSER with PDF.js. This is the
      // heavy part, and it runs on the user's machine with no server time
      // limit. The server only ever sees plain text after this.
      const extractionResult = await extractPdfText(file);
      const { text: pdfText, hadTextLayer } = extractionResult;

      if (!hadTextLayer) {
        throw userFacingError(
          "This looks like a scanned or photographed IEP — there's no readable text in the file, just images. I can't read those automatically. The easiest path: open the IEP and type or paste the key details (services, goals, classification, placement) into the chat, and I'll work from that."
        );
      }

      // Structural quality check: if pages are mixed scanned/typed, rotated,
      // or laid out in multiple columns, the reconstructed text is likely
      // jumbled or partial. Refuse rather than feed bad input to Haiku and
      // hand the parent a confidently wrong review.
      const blocker = pdfQualityBlocker(extractionResult);
      if (blocker) {
        throw userFacingError(blocker);
      }

      // Step 2 — extraction call. Send the TEXT (not the PDF) to Claude. Text
      // analysis is fast, so this stays well under the function time limit.
      // 4000-token budget: a long IEP with many goals/services/accommodations
      // can plausibly fill 2500-3500 tokens of structured output, and a
      // truncated extraction silently breaks Stage B. strictMaxTokens means
      // the call throws (with a parent-friendly message) instead of returning
      // a half-extracted IEP.
      const extraction = await callClaudeForJSON(
        IEP_EXTRACT_PROMPT,
        "Here is the full text extracted from a parent's IEP PDF. Extract it into the structured schema described in the system prompt. Return ONLY the JSON object.\n\nIEP TEXT:\n" +
          pdfText,
        FAST_MODEL,
        4000,
        { strictMaxTokens: true }
      );

      // Post-extraction self-report: the IEP_EXTRACT prompt asks Haiku to
      // rate its own completeness. If it says "low", don't paper over that
      // by running Stage B on shaky structured data — surface it.
      const completeness = extraction && extraction.extraction_quality && extraction.extraction_quality.completeness;
      if (completeness === "low") {
        const missing = (extraction.extraction_quality.unclear_or_missing || []).slice(0, 3);
        const detail = missing.length > 0 ? " Specifically: " + missing.join("; ") + "." : "";
        throw userFacingError(
          "I tried, but I couldn't reliably read this IEP — too much of it came through unclear." +
            detail +
            " Rather than guess at things and hand you a wrong analysis, please tell me the key details (services, goals, classification, placement) in the chat and I'll work from that."
        );
      }

      setIepExtraction(extraction);

      // Now flagging — show that stage in the spinner.
      setIepProcessing("flagging");

      const parentContext = {
        concerns_freetext: intake.concerns_summary || "",
        considering_private_placement: intake.private_placement_status === "considering",
        already_in_private_placement: intake.private_placement_status === "enrolled",
        child_making_progress: intake.child_making_progress || "unsure",
        services_actually_happening: intake.services_actually_happening || "unsure",
        has_private_evaluation: (intake.evidence_available || []).includes("private_evaluation"),
        triage_categories: triageResult?.identified_categories?.map((c) => c.category) || [],
      };

      // Step 3 — flagging call. Text only, on Haiku for speed, with a bounded
      // token budget so the structured output stays small enough to finish
      // under the 26s function limit. strictMaxTokens so a truncated flag
      // list surfaces as an error the parent can act on.
      const flags = await callClaudeForJSON(
        IEP_FLAG_PROMPT,
        "Identify the most relevant facts in this IEP that could support a colorable due process claim, and pair each with a question for the parent.\n\n" +
          "iep_extraction:\n" +
          JSON.stringify(extraction, null, 2) +
          "\n\nparent_context:\n" +
          JSON.stringify(parentContext, null, 2),
        FAST_MODEL,
        2500,
        { strictMaxTokens: true }
      );
      setIepFlags(flags);
      setIepProcessing(null);
    } catch (e) {
      const msg = (e && e.message) || "unknown error";
      const isTimeout = /timeout|timed out|504|502|gateway/i.test(msg);
      setIepError(
        isTimeout
          ? "The analysis took too long. Try a shorter IEP, or skip this step and just tell me about the IEP in the chat."
          : e && e.userFacing
          ? msg // already a parent-friendly message from the detection layer
          : "Couldn't process the IEP — " + msg + ". You can try again, try a different file, or skip this step."
      );
      setIepProcessing(null);
    }
  };

  // When the parent answers an IEP follow-up question, append the answer to
  // the chat's intake notes so it flows into the drafter.
  const submitIepAnswers = () => {
    const lines = [];
    if (iepFlags?.flags) {
      iepFlags.flags.forEach((f, i) => {
        const ans = iepFlagAnswers[i];
        if (!ans || !ans.trim()) return;
        lines.push(`Re: ${f.what_the_iep_shows}\nQ: ${f.question_for_parent}\nA: ${ans.trim()}`);
      });
    }
    if (lines.length === 0) {
      // Just close the panel without enriching intake
      setIepUploadVisible(false);
      return;
    }
    const combined = lines.join("\n\n");
    // Merge into intake.concerns_summary so the drafter can see it
    setIntake((prev) => ({
      ...prev,
      concerns_summary:
        (prev.concerns_summary || "") +
        "\n\n[ADDITIONAL CONTEXT FROM IEP REVIEW]\n" +
        combined,
      iep_review_notes: combined, // also store separately for clarity
    }));
    setIepUploadVisible(false);
  };

  const clearIEP = () => {
    setIepFileName(null);
    setIepExtraction(null);
    setIepFlags(null);
    setIepFlagAnswers({});
    setIepError(null);
    setIepProcessing(null);
  };

  const runDrafter = async () => {
    setError(null);
    setDrafting(true);
    try {
      const today = new Date().toISOString().slice(0, 10);
      const fullPayload = {
        today,
        // Identity from the form (exact spelling); everything else from intake.
        parent: {
          full_name: formalFields.parent_full_name,
          address: formalFields.parent_address,
          email: formalFields.parent_email,
          phone: formalFields.parent_phone,
        },
        student: {
          full_name: formalFields.child_full_name,
          date_of_birth: formalFields.child_dob,
          first_name: intake.student_first_name,
          age: intake.student_age,
          grade: intake.student_grade,
          school: intake.student_school,
          classification: intake.student_classification,
        },
        district: {
          name: intake.district_name || "[PARENT TO ADD: district name]",
          is_nyc_doe: intake.is_nyc_doe,
        },
        captured_intake: intake,
        triage_categories: triageResult?.identified_categories,
        iep_extraction: iepExtraction || null,
        iep_flags: iepFlags?.flags || null,
        iep_flag_answers: Object.keys(iepFlagAnswers).length > 0 ? iepFlagAnswers : null,
        chat_transcript_excerpt: messages
          .slice(-30)
          .map((m) => `${m.role === "user" ? "Parent" : "Assistant"}: ${m.content}`)
          .join("\n\n"),
        // Substantive content now comes from the chat-gathered intake, not the
        // form — the form collects only exact-spelling identity (see Commit 4).
        remedy: intake.remedy_sought,
        prior_written_communications: intake.prior_written_detail,
        evidence_parent_has: intake.evidence_available || [],
        pendency_assertion: intake.pendency_assertion,
        pendency_details: intake.pendency_details,
        key_dates: intake.key_dates || null,
      };

      // Stage 1: generate draft. 6000 tokens — a long multi-issue complaint can
      // approach the old 4000 cap and silently truncate mid-sentence.
      const stage1 = await callClaudeForText(
        DRAFTER_PROMPT,
        "Draft the due process complaint based on the following information. Return only the letter text.\n\n" +
          JSON.stringify(fullPayload, null, 2),
        6000
      );

      // Stage 2: de-lawyer — plain text, not JSON. The cleaned draft is returned
      // directly, so there's no JSON round-trip to truncate or mis-escape (the
      // old "Could not parse JSON" failure on the headline output). Same budget
      // as stage 1, since it reproduces the whole draft.
      const cleaned = await callClaudeForText(DELAWYER_PROMPT, stage1, 6000);

      const finalDraft = cleaned || stage1;
      setDraft(finalDraft);
      setDraftEdited(null);
      setReviewChecks({ accuracy: false, dates: false, remedy: false });
      // Step 3: persist the generated complaint to the per-user bucket so it's
      // available from the account page even if the parent never clicks
      // download. Auth-only; anonymous generates nothing server-side. Edits made
      // in the review panel are captured separately on download (onSavePdf).
      if (sb && authUser) {
        const blob = pdfBlobFromText(finalDraft);
        if (blob) saveGeneratedDoc(authUser.id, "due-process-complaint.pdf", blob).catch(() => {});
      }
    } catch (e) {
      setError("Couldn't generate the draft — " + (e.message || "unknown error"));
    } finally {
      setDrafting(false);
    }
  };

  // Step 3: when the parent downloads a generated PDF, persist the exact same
  // bytes to the bucket (captures any edits they made in the panel, and keeps
  // the stored file byte-identical to what they took). Auth-only; the download
  // itself is unaffected for anonymous users.
  const savePdf = (blob, filename) => {
    if (sb && authUser && blob) saveGeneratedDoc(authUser.id, filename, blob).catch(() => {});
  };

  // Auto-resume on load: if the thread ends with a user message that never got
  // a response (e.g., reload while the API call was in flight), kick off the
  // call now so the user isn't stuck looking at their own unanswered message.
  useEffect(() => {
    if (!loaded || loading) return;
    if (messages.length === 0) return;
    const last = messages[messages.length - 1];
    if (last.role !== "user") return;

    (async () => {
      setLoading(true);
      try {
        await processCall(messages);
      } catch (e) {
        setError(
          (e.message || "Couldn't reach the assistant.") +
            " — Click retry below or send a new message."
        );
        setLastFailedMessage(last.content);
      } finally {
        setLoading(false);
      }
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loaded]);

  useEffect(() => {
    if (threadRef.current) threadRef.current.scrollTop = threadRef.current.scrollHeight;
  }, [messages, loading]);

  useEffect(() => {
    inputRef.current?.focus();
  }, [loading, chatState]);

  // Run a Claude call against the given message history and update state with the result.
  // Used by both send() (for new messages) and retryLast() (for retrying after an error).
  const processCall = async (msgs, docsOverride = null) => {
    // docsOverride lets a freshly-attached document reach this turn's prompt
    // without waiting for the uploadedDocs state update to flush.
    const docs = docsOverride || uploadedDocs;
    let baseSystem =
      CHAT_ADVOCATE_PROMPT +
      "\n\n--- INTAKE STATE SO FAR ---\n" +
      JSON.stringify(intake, null, 2);
    // Formal identity fields the parent already typed into a form this session.
    // Surface them so the chat doesn't re-ask — and so it doesn't ask in chat
    // for the ones the form (not the chat) is responsible for collecting.
    const collectedFormal = [
      ["Parent's full name", formalFields.parent_full_name],
      ["Parent's address", formalFields.parent_address],
      ["Parent's email", formalFields.parent_email],
      ["Parent's phone", formalFields.parent_phone],
      ["Child's full name", formalFields.child_full_name],
      ["Child's date of birth", formalFields.child_dob],
    ].filter(([, v]) => v && String(v).trim());
    if (collectedFormal.length > 0) {
      baseSystem +=
        "\n\n--- ALREADY COLLECTED (do not re-ask these — the parent typed them into the form) ---\n" +
        collectedFormal.map(([k, v]) => `- ${k}: ${v}`).join("\n") +
        "\nIf you need other identity fields for a specific output, the form below will collect them; do not ask for them in chat.";
    }
    // Parent's own notes (authored on the account page) — inject so the chat can
    // use them. Parent-authored and shown on the account page, so client-side
    // injection is fine; only context_narrative stays server-side.
    if (parentNotes && parentNotes.trim()) {
      baseSystem += "\n\n--- PARENT'S OWN NOTES (they wrote these for themselves; use them as context) ---\n" + parentNotes.trim();
    }
    // Auth state — so the post-generation save nudge can be tailored (never tell
    // an already-signed-in parent to create an account; their case is saved).
    baseSystem += authUser
      ? "\n\n--- ACCOUNT STATE ---\nThe parent is signed in; their case and drafts are already being saved. Do NOT suggest creating an account."
      : "\n\n--- ACCOUNT STATE ---\nThe parent is NOT signed in; nothing is being saved server-side.";
    // Language hint (item 5): when the site is in Spanish, direct the chat to open
    // and converse in Spanish. Appended to the system prompt client-side — the
    // serverless function forwards `system` verbatim, so no function change needed.
    // Drafted legal documents themselves stay English (runDrafter is untouched).
    if (lang === "es") {
      baseSystem += CHAT_LANGUAGE_ES;
    }
    const docsBlock = formatDocsForPrompt(docs);
    if (docsBlock) {
      baseSystem += "\n\n--- UPLOADED DOCUMENTS ---\n" + docsBlock;
    }
    // Step 3: shallow headlines of documents reviewed in PRIOR sessions. The
    // raw originals were discarded; only these gists remain. Exclude any doc
    // attached in full THIS turn (its full text is already above). The chat is
    // told (in CHAT_ADVOCATE_PROMPT) to recognize these, and to ask for a
    // re-upload ONLY when a task needs specifics the headline can't supply.
    const attachedNames = new Set((docs || []).map((d) => d.name));
    const priorHeadlines = (docsReviewed || []).filter((d) => d && !attachedNames.has(d.filename));
    if (priorHeadlines.length > 0) {
      baseSystem +=
        "\n\n--- PREVIOUSLY REVIEWED DOCUMENTS (headline only — the originals are NOT retained; you do NOT have their full text or specifics) ---\n" +
        priorHeadlines
          .map((d) => {
            const bits = [d.doc_type || "Document"];
            if (d.date_conducted) bits.push(`dated ${d.date_conducted}`);
            if (d.source) bits.push(`from ${d.source}`);
            const head = bits.join(", ");
            const findings = d.headline_extraction ? ` — ${d.headline_extraction}` : "";
            return `- ${d.filename}: ${head}${findings}`;
          })
          .join("\n");
    }

    let parsed;
    try {
      parsed = await callClaude(msgs, baseSystem);
    } catch (firstErr) {
      // One silent retry
      parsed = await callClaude(msgs, baseSystem);
    }

    const updatedIntake = mergeIntake(intake, parsed.intake_updates || {});
    setIntake(updatedIntake);
    setChatState(parsed.state || "continuing");

    // Once the parent requests the assessment, latch it on permanently.
    if (parsed.parent_requested_assessment === true) {
      setAssessmentRequested(true);
    }

    // Merge any new outputs the parent has asked for. Don't replace — append.
    if (Array.isArray(parsed.outputs_to_generate) && parsed.outputs_to_generate.length > 0) {
      setOutputsRequested((existing) => {
        const valid = parsed.outputs_to_generate.filter((id) => OUTPUT_LIBRARY[id]);
        return Array.from(new Set([...existing, ...valid]));
      });
    }

    // Validate wait-check against whitelist — model occasionally returns "null"
    // as a string or other invalid values that shouldn't display.
    const validWaitCheck = VALID_WAIT_CHECKS.includes(parsed.wait_check_just_surfaced)
      ? parsed.wait_check_just_surfaced
      : null;
    if (validWaitCheck) {
      setWaitChecks((w) => Array.from(new Set([...w, validWaitCheck])));
    }

    setMessages((current) => [
      ...current,
      {
        role: "assistant",
        content: parsed.chat_reply || "(no reply)",
        waitCheck: validWaitCheck,
      },
    ]);
  };

  // Parent attaches a document in the chat. We extract the text in the browser
  // (same PDF.js path the preserved IEP pipeline uses) and add it to
  // uploadedDocs, then send a short user turn so the assistant acknowledges it.
  // We do NOT run the structured IEP assessment here — that pipeline is reserved
  // for a separate future entry point.
  const handleAttach = async (file) => {
    if (!file || loading || attaching) return;
    setAttachError(null);
    if (file.type !== "application/pdf" && !file.name.toLowerCase().endsWith(".pdf")) {
      setAttachError("Please attach a PDF file.");
      return;
    }
    if (file.size > MAX_PDF_BYTES) {
      const limitMB = (MAX_PDF_BYTES / (1024 * 1024)).toFixed(1);
      setAttachError(`That PDF is too large (limit ${limitMB}MB). Free tools like ilovepdf.com can shrink it.`);
      return;
    }
    setAttaching(true);
    try {
      const extractionResult = await extractPdfText(file);
      const { text, hadTextLayer } = extractionResult;
      if (!hadTextLayer) {
        setAttachError(
          "That looks like a scanned or photographed PDF — there's no readable text in it, just images. Type the key details into the chat instead and I'll work from that."
        );
        return;
      }
      const blocker = pdfQualityBlocker(extractionResult);
      if (blocker) {
        setAttachError(blocker);
        return;
      }
      const newDocs = [...uploadedDocs, { name: file.name, text }];
      setUploadedDocs(newDocs);

      // Step 3: record a shallow headline of this upload in the parent's ledger,
      // so a future return recognizes the document (and can ask for re-upload
      // when specifics are needed). Auth-only — anonymous sessions write nothing
      // server-side. Raw `text` is NOT persisted; only the headline. Fire-and-
      // forget so it never gates this chat turn.
      if (sb && authUser) {
        extractHeadlineForDoc(file.name, text)
          .then((entry) => entry && appendDocReviewed(authUser.id, entry))
          .catch(() => {});
      }

      const newMsgs = [...messages, { role: "user", content: `I've attached a document: ${file.name}` }];
      setMessages(newMsgs);
      setLoading(true);
      try {
        await processCall(newMsgs, newDocs);
      } catch (e) {
        setError(
          (e.message || "Couldn't reach the assistant.") +
            " — Click retry below or send a new message."
        );
        setLastFailedMessage(newMsgs[newMsgs.length - 1].content);
      } finally {
        setLoading(false);
      }
    } catch (e) {
      const msg = (e && e.message) || "unknown error";
      setAttachError(
        e && e.userFacing ? msg : "Couldn't read that PDF — " + msg + ". Try a different file or type the details into the chat."
      );
    } finally {
      setAttaching(false);
    }
  };

  const send = async (textOverride = null) => {
    const text = (textOverride ?? input).trim();
    if (!text || loading) return;
    setError(null);
    setLastFailedMessage(null);

    const newMsgs = [...messages, { role: "user", content: text }];
    setMessages(newMsgs);
    setInput("");
    setLoading(true);

    try {
      await processCall(newMsgs);
    } catch (e) {
      setError(
        (e.message || "Couldn't reach the assistant.") +
          " — Click retry below or send a new message."
      );
      setLastFailedMessage(text);
    } finally {
      setLoading(false);
    }
  };

  const retryLast = async () => {
    if (loading) return;
    setError(null);
    setLoading(true);
    try {
      // The user message is already in the thread — just retry the API call against it
      await processCall(messages);
      setLastFailedMessage(null);
    } catch (e) {
      setError(
        (e.message || "Still couldn't reach the assistant.") +
          " — Try again or send a new message."
      );
    } finally {
      setLoading(false);
    }
  };

  const continueChat = () => {
    setChatState("continuing");
    inputRef.current?.focus();
  };

  const reset = async () => {
    if (!confirm("Start fresh? This clears the saved conversation.")) return;

    // Reset all React state immediately so the user sees clean state even
    // before the storage delete completes.
    setMessages([{ role: "assistant", content: lang === "es" ? OPENING_ES : OPENING }]);
    setIntake({});
    // New conversation = new session row next time something is persisted. The
    // server case row is left intact (the persist guard skips empty state), so
    // "Start fresh" never silently destroys a saved case.
    setCaseSessionId(null);
    setChatState("continuing");
    setWaitChecks([]);
    setError(null);
    setLastFailedMessage(null);
    setChecklist(null);
    setCheckedItems({});
    setTriageResult(null);
    setFullComplaintFormOpen(false);
    setDraft(null);
    setDraftEdited(null);
    setReviewChecks({ accuracy: false, dates: false, remedy: false });
    setAssessmentRequested(false);
    setOutputsRequested([]);
    setOutputs({});
    setOutputsLoading({});
    setFormalFields({
      parent_full_name: "", parent_address: "", parent_email: "",
      parent_phone: "", child_full_name: "", child_dob: "",
    });
    setFormalFieldsCollected(false);
    setIepFileName(null);
    setIepExtraction(null);
    setIepFlags(null);
    setIepFlagAnswers({});
    setIepError(null);
    setIepProcessing(null);
    setIepUploadVisible(false);
    setUploadedDocs([]);
    setAttachError(null);
    setAttaching(false);
    outputsScrolledRef.current = false;

    // Clear all saved state across both storage backends and any key version.
    try {
      if (typeof window !== "undefined" && window.storage) {
        await window.storage.delete(STORAGE_KEY).catch(() => {});
        await window.storage.delete("filing_path_demo:state_v1").catch(() => {});
        await window.storage.delete("filing_path_demo:state_v2").catch(() => {});
        // Enumerate and delete anything else with our prefixes
        for (const prefix of ["plainly:", "filing_path_demo:"]) {
          try {
            const result = await window.storage.list(prefix);
            if (result && result.keys) {
              for (const k of result.keys) {
                await window.storage.delete(k).catch(() => {});
              }
            }
          } catch {}
        }
      }
      // Also wipe any stale entries left in localStorage by older versions
      if (typeof localStorage !== "undefined") {
        const stale = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && (k.indexOf("plainly:") === 0 || k.indexOf("filing_path_demo:") === 0)) {
            stale.push(k);
          }
        }
        stale.forEach((k) => localStorage.removeItem(k));
      }
    } catch {}

    // Force a full page reload so any in-flight effects can't restore old state
    setTimeout(() => {
      try { window.location.reload(); } catch {}
    }, 100);
  };

  return (
    <>
      <style>{CHAT_STYLES}</style>
      <div className="shell">
        <div className="head">
          <div className="brand" style={{ fontFamily: "Fraunces, serif", fontSize: 16, fontWeight: 500, color: "var(--ink-muted)" }}>
            Conversation
          </div>
          <button
            onClick={reset}
            style={{
              marginLeft: "auto",
              background: "transparent",
              border: "none",
              color: "var(--ink-soft)",
              fontSize: 12,
              fontFamily: "inherit",
              cursor: "pointer",
              textDecoration: "underline",
              textUnderlineOffset: 3,
              padding: 0,
            }}
            title="Clear the saved conversation and start over"
          >
            Start fresh
          </button>
        </div>

        <h1>
          Tell me what's <em>going on</em>.
        </h1>
        <p className="lede">
          Describe your situation in your own words. I'll help you make sense of
          it, flag anything time-sensitive right away, and put together letters or
          documents when they'd help. Attach the IEP or any document any time.
        </p>

        <div className="thread" ref={threadRef}>
          {messages.map((m, i) => (
            <div
              key={i}
              style={{
                display: "flex",
                flexDirection: "column",
                alignItems: m.role === "user" ? "flex-end" : "flex-start",
              }}
            >
              <div className={`bubble ${m.role === "user" ? "parent" : "assistant"}`}>
                {renderMessageText(m.content)}
              </div>
            </div>
          ))}
          {loading && (
            <div className="typing">
              <span className="tdot" />
              <span className="tdot" />
              <span className="tdot" />
            </div>
          )}
        </div>

        {error && (
          <div className="error">
            <div style={{ marginBottom: 8 }}>{error}</div>
            {lastFailedMessage && (
              <button
                className="btn btn-ghost"
                style={{ fontSize: 13, padding: "6px 12px", marginRight: 0 }}
                onClick={retryLast}
              >
                Retry that message
              </button>
            )}
          </div>
        )}

        {chatState === "thin_offer_guidance" && (
          <div className="thin">
            <h3>Worth gathering more information first</h3>
            <p style={{ margin: 0, color: "var(--warn-deep)" }}>
              The chat above has specific suggestions. You can keep talking if
              there's more to share, or come back when you have more documents
              in hand.
            </p>
            <div style={{ marginTop: 12 }}>
              <button className="btn btn-ghost" onClick={continueChat}>
                Keep chatting — I have more
              </button>
            </div>
          </div>
        )}

        {uploadedDocs.length > 0 && (
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, margin: "0 0 8px" }}>
            {uploadedDocs.map((d, i) => (
              <span
                key={i}
                style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 12.5, color: "var(--ink-muted)", background: "var(--surface-2)", borderRadius: 6, padding: "3px 8px" }}
              >
                📎 {d.name}
                <a
                  href="#"
                  onClick={(e) => { e.preventDefault(); setUploadedDocs((docs) => docs.filter((_, j) => j !== i)); }}
                  style={{ color: "var(--ink-soft)", textDecoration: "none", fontWeight: 600 }}
                  title="Remove this document"
                >
                  ×
                </a>
              </span>
            ))}
          </div>
        )}

        {attachError && (
          <div className="error" style={{ marginBottom: 8 }}>{attachError}</div>
        )}

        <div className="composer">
            <input
              ref={attachRef}
              type="file"
              accept="application/pdf,.pdf"
              style={{ display: "none" }}
              onChange={(e) => { handleAttach(e.target.files?.[0]); e.target.value = ""; }}
            />
            <button
              className="send"
              onClick={() => attachRef.current?.click()}
              disabled={loading || attaching}
              aria-label="Attach a document"
              title="Attach a PDF (IEP, evaluation, notice, anything)"
              style={{ background: "transparent", color: "var(--ink-soft)" }}
            >
              {attaching ? (
                <span className="spinner" style={{ width: 14, height: 14, borderWidth: 2 }} />
              ) : (
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
                </svg>
              )}
            </button>
            <textarea
              ref={inputRef}
              value={input}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={(e) => {
                if (e.key === "Enter" && !e.shiftKey) {
                  e.preventDefault();
                  send();
                }
              }}
              placeholder={
                loading ? "Thinking..." : "Type your message... (Enter to send)"
              }
              rows={1}
              disabled={loading}
            />
            <button
              className="send"
              onClick={() => send()}
              disabled={!input.trim() || loading}
              aria-label="Send"
            >
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
                <line x1="22" y1="2" x2="11" y2="13" />
                <polygon points="22 2 15 22 11 13 2 9 22 2" />
              </svg>
            </button>
          </div>

        {/* LETTER FIELDS PROMPT — first, so the parent can complete and see outputs ASAP */}
        {assessmentRequested && !formalFieldsCollected && (() => {
          const pending = outputsRequested.filter(
            (id) => OUTPUT_LIBRARY[id]?.min_fields?.length > 0 && id !== "full_complaint" && !outputs[id] && !outputsLoading[id]
          );
          if (pending.length === 0) return null;
          return (
            <FormalFieldsForm
              mode="letters"
              values={formalFields}
              onChange={setFormalFields}
              onSubmit={() => setFormalFieldsCollected(true)}
              neededFor={pending}
              childFirstName={intake.student_first_name}
            />
          );
        })()}

        {/* OUTPUTS PANEL — appears immediately when parent requests outputs */}
        {assessmentRequested && outputsRequested.length > 0 && (
          <div ref={outputsScrollRef}>
            <OutputsPanel
              requested={outputsRequested}
              outputs={outputs}
              loading={outputsLoading}
              onRegenerate={(id) => {
                setOutputs((o) => {
                  const newO = { ...o };
                  delete newO[id];
                  return newO;
                });
                setTimeout(() => generateOutput(id), 50);
              }}
              onSavePdf={savePdf}
            />
          </div>
        )}

        {/* The "What we're seeing" triage verdict (TriageSection) was removed from
            the chat flow — the chat does this conversationally now. The component
            is preserved for the future "Quick IEP assessment" entry point. */}

        {/* FULL COMPLAINT FLOW — triggered when full_complaint is requested. The
            remedy and substance are gathered + confirmed in the chat; the form
            below collects only the exact-spelling signature-block identity. */}
        {assessmentRequested && outputsRequested.includes("full_complaint") && !fullComplaintFormOpen && !draft && !drafting && (
          <div className="ready-card" style={{ marginTop: 20 }}>
            <h4>Ready to prepare the full complaint?</h4>
            <p>
              I have what you're asking for and the rest of your situation from
              our chat. For the filed document I just need a few exact details —
              your full name, address, email and phone, and your child's full
              name and date of birth.
            </p>
            <button className="btn btn-primary" onClick={() => setFullComplaintFormOpen(true)}>
              Continue
            </button>
          </div>
        )}

        {fullComplaintFormOpen && !draft && !drafting && (
          <FormalFieldsForm
            mode="complaint"
            values={formalFields}
            onChange={setFormalFields}
            onSubmit={() => runDrafter()}
            onCancel={() => setFullComplaintFormOpen(false)}
            childFirstName={intake.student_first_name}
          />
        )}

        {(drafting || draft) && (
          <DraftReview
            draft={draft}
            edited={draftEdited}
            onEditChange={setDraftEdited}
            checks={reviewChecks}
            onCheckChange={(k, v) => setReviewChecks((r) => ({ ...r, [k]: v }))}
            onRegenerate={() => runDrafter()}
            drafting={drafting}
            onSavePdf={savePdf}
          />
        )}

        {/* The IEP structured-assessment UI (upload button → IEPSection →
            "What I'd look at" panel) was intentionally disconnected here. The
            chat now takes documents through the generic attach affordance in
            the composer above. The assessment pipeline (processIEP, IEPSection,
            IEP_EXTRACT_PROMPT, IEP_FLAG_PROMPT) is PRESERVED for a future
            "Quick IEP assessment" entry point — see CLAUDE.md. Do not delete. */}

        <div className="disclaimer">
          This is a conversational guide, not a lawyer, and nothing here is legal
          advice. Attach documents and ask questions; I'll help you think it
          through and prepare what you need.
        </div>
      </div>
    </>
  );
}

function StartPage() {
  return (
    <div className="page-wide fade-in" style={{ paddingTop: 24, paddingBottom: 60 }}>
      <ChatTool />
    </div>
  );
}
