// ============================================================================
// PAGE: LOGIN — magic-link request + consent gate (Step 1 auth)
// ============================================================================
function LoginPage() {
  const [email, setEmail] = useState("");
  const [agreed, setAgreed] = useState(false);
  const [status, setStatus] = useState("idle"); // idle | sending | sent | error
  const [errMsg, setErrMsg] = useState("");

  if (!authReady) {
    return (
      <div className="page fade-in">
        <div className="eyebrow">Accounts</div>
        <h1 className="display" style={{ fontSize: 38 }}>Accounts aren't available right now.</h1>
        <p className="lede">You can still use this tool without one — nothing about it requires an account.</p>
        <button className="btn btn-primary" onClick={() => go("/start")}>Start a conversation</button>
      </div>
    );
  }

  const canSend = !!email.trim() && agreed && status !== "sending";

  const send = async () => {
    if (!canSend) return;
    setStatus("sending");
    setErrMsg("");
    try {
      const { error } = await sb.auth.signInWithOtp({
        email: email.trim(),
        options: {
          // Return to whatever origin the request came from (prod or a preview).
          emailRedirectTo: window.location.origin,
          // Recorded as user_metadata only when the account is first created —
          // exactly "consent at account creation". Ignored for existing users.
          data: { consent_version: CONSENT_VERSION, consent_accepted_at: new Date().toISOString() },
        },
      });
      if (error) {
        setStatus("error");
        setErrMsg(error.message || "Couldn't send the link. Try again in a moment.");
      } else {
        setStatus("sent");
      }
    } catch (e) {
      setStatus("error");
      setErrMsg((e && e.message) || "Couldn't send the link. Try again in a moment.");
    }
  };

  if (status === "sent") {
    return (
      <div className="page fade-in">
        <div className="eyebrow">Check your email</div>
        <h1 className="display" style={{ fontSize: 38 }}>Your sign-in link is on its way.</h1>
        <p className="lede">
          We sent a one-time link to <strong>{email.trim()}</strong>. Open it to finish
          signing in — on this device or any other.
        </p>
        <p className="soft">
          Don't see it after a minute or two? Check your spam or junk folder — the link
          comes from Be Heard (login@beheard-specialeducation.com).
        </p>
        <button className="btn btn-ghost" onClick={() => setStatus("idle")}>Use a different email</button>
      </div>
    );
  }

  return (
    <div className="page fade-in">
      <div className="eyebrow">Save your case</div>
      <h1 className="display" style={{ fontSize: 38 }}>Log in or create an account.</h1>
      <p className="lede">
        Enter your email and we'll send a one-time sign-in link — no password to remember.
        New here? The same link creates your account.
      </p>
      <div className="card">
        <div className="field">
          <label>Email</label>
          <input
            type="email"
            value={email}
            onChange={(e) => setEmail(e.target.value)}
            placeholder="you@example.com"
            onKeyDown={(e) => { if (e.key === "Enter") send(); }}
          />
        </div>

        {/* CONSENT GATE (clickwrap) — required, unchecked by default; gates canSend.
            Assent is recorded in user_metadata at account creation (see send()). */}
        <label style={{ display: "flex", gap: 10, alignItems: "flex-start", margin: "4px 0 16px", fontSize: 14, lineHeight: 1.5, cursor: "pointer" }}>
          <input type="checkbox" checked={agreed} onChange={(e) => setAgreed(e.target.checked)} style={{ marginTop: 3 }} />
          <span>
            I have read and agree to the{" "}
            <a href="#/terms" target="_blank" rel="noopener" onClick={(e) => e.stopPropagation()}>Terms of Use</a>{" "}
            and{" "}
            <a href="#/privacy" target="_blank" rel="noopener" onClick={(e) => e.stopPropagation()}>Privacy Policy</a>. I also
            acknowledge and agree to the{" "}
            <a href="#/terms/section-18" target="_blank" rel="noopener" onClick={(e) => e.stopPropagation()}>Additional Terms and Limitations for Account Users (Section 18 of the Terms of Use)</a>,
            which describe what saving to an account stores — a summary of my situation and my
            drafts, not my full chat or uploaded documents — and the risks of storing that
            information.
          </span>
        </label>

        {status === "error" && (
          <p className="help" style={{ color: "var(--warn-deep)" }}>{errMsg}</p>
        )}

        <button className="btn btn-primary" onClick={send} disabled={!canSend}>
          {status === "sending" ? "Sending…" : "Email me a sign-in link"}
        </button>
      </div>
      <p className="muted" style={{ marginTop: 14 }}>
        Prefer not to make an account?{" "}
        <a href="#/start" onClick={(e) => { e.preventDefault(); go("/start"); }}>Continue without an account →</a>
      </p>
    </div>
  );
}

// Shown during the implicit-flow magic-link return while the client parses the
// session out of the URL hash. The App-level effect routes to /account on
// success; here we just hold the screen (and surface an expired/used-link error).
function AuthCallback() {
  const { user } = useAuth();
  const [slow, setSlow] = useState(false);
  const hash = (typeof window !== "undefined" && window.location.hash) || "";
  const hasError = hash.indexOf("error=") !== -1 || hash.indexOf("error_description=") !== -1;

  // Covers the race where the session is already parsed before App's SIGNED_IN
  // listener subscribed: as soon as a user is present on this screen, move on.
  useEffect(() => {
    if (user) go("/account");
  }, [user]);

  useEffect(() => {
    const t = setTimeout(() => setSlow(true), 8000);
    return () => clearTimeout(t);
  }, []);

  if (hasError) {
    return (
      <div className="page fade-in">
        <div className="eyebrow">Sign-in</div>
        <h1 className="display" style={{ fontSize: 34 }}>That link didn't work.</h1>
        <p className="lede">It may have expired or already been used. Request a fresh one and try again.</p>
        <button className="btn btn-primary" onClick={() => go("/login")}>Back to log in</button>
      </div>
    );
  }
  return (
    <div className="page fade-in">
      <div className="eyebrow">Signing you in</div>
      <h1 className="display" style={{ fontSize: 34 }}>One moment…</h1>
      <p className="lede">Finishing your sign-in.</p>
      {slow && (
        <p className="muted">
          Taking longer than expected?{" "}
          <a href="#/login" onClick={(e) => { e.preventDefault(); go("/login"); }}>Try logging in again</a>.
        </p>
      )}
    </div>
  );
}

// Account landing (Step 1 stub). No persistence yet — confirms sign-in, offers
// the conversation and logout. Real case overview arrives in Step 2+.
function AccountPage() {
  const { user, authLoading } = useAuth();
  const [phase, setPhase] = useState("loading"); // loading | preparing | ready
  const [caseRow, setCaseRow] = useState(null);
  const [notes, setNotes] = useState("");
  const [notesStatus, setNotesStatus] = useState("idle"); // idle | saving | saved
  const [docsReviewed, setDocsReviewed] = useState([]);   // headline ledger (read-only)
  const [genFiles, setGenFiles] = useState([]);           // generated docs in the bucket
  const [downloadingFile, setDownloadingFile] = useState(null); // filename currently downloading

  useEffect(() => {
    if (!authReady || authLoading || !user || !sb) return;
    let active = true;
    (async () => {
      // On a genuine return (first account mount this page load) regenerate, so
      // the recap reflects the most recent session BEFORE we show it. Lazy: this
      // is the return, never an exit. context_narrative is rebuilt too, ready for
      // the next Continue — but we never read it into the client here.
      if (!accountRegeneratedThisLoad) {
        accountRegeneratedThisLoad = true;
        if (active) setPhase("preparing");
        try {
          const { data: s } = await sb.auth.getSession();
          const tok = s && s.session && s.session.access_token;
          if (tok) {
            await fetch(API_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json", Authorization: "Bearer " + tok },
              body: JSON.stringify({ action: "regenerate" }),
            });
          }
        } catch (e) { /* regen failure → just show whatever recap exists */ }
      }
      // Read recap + notes + timestamps + the docs_reviewed ledger. NEVER select
      // context_narrative — the chat-facing briefing stays server-side per the
      // access posture.
      try {
        const { data } = await sb.from("cases")
          .select("recap, parent_notes, docs_reviewed, last_session_at, updated_at, created_at, intake, formal_fields")
          .eq("user_id", user.id)
          .maybeSingle();
        if (active) {
          setCaseRow(data || {});
          setNotes((data && data.parent_notes) || "");
          setDocsReviewed((data && Array.isArray(data.docs_reviewed)) ? data.docs_reviewed : []);
          setPhase("ready");
        }
      } catch (e) {
        if (active) { setCaseRow({}); setPhase("ready"); }
      }
      // List the parent's generated documents from their own bucket folder.
      // RLS-scoped to their uid folder; failure just leaves the list empty.
      try {
        const { data: files } = await sb.storage
          .from("generated-docs")
          .list(user.id, { limit: 100, sortBy: { column: "name", order: "asc" } });
        if (active && Array.isArray(files)) {
          setGenFiles(files.filter((f) => f && f.name && !f.name.startsWith(".")));
        }
      } catch (e) { /* no files / offline → empty list */ }
    })();
    return () => { active = false; };
  }, [authLoading, user]);

  // Download one generated document from the bucket (RLS-scoped to the user's
  // own folder) and save it locally.
  const downloadGenFile = async (name) => {
    if (!sb || !user) return;
    setDownloadingFile(name);
    try {
      const { data, error } = await sb.storage
        .from("generated-docs")
        .download(`${user.id}/${name}`);
      if (error || !data) throw error || new Error("no data");
      const url = URL.createObjectURL(data);
      const a = document.createElement("a");
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch (e) {
      alert("Couldn't download that document just now — please try again in a moment.");
    } finally {
      setDownloadingFile(null);
    }
  };

  if (!authReady) {
    return (
      <div className="page fade-in">
        <div className="eyebrow">Account</div>
        <h1 className="display" style={{ fontSize: 34 }}>Accounts aren't available right now.</h1>
        <button className="btn btn-primary" onClick={() => go("/start")}>Start a conversation</button>
      </div>
    );
  }
  if (authLoading) return <div className="page fade-in"><p className="lede">Loading…</p></div>;
  if (!user) {
    return (
      <div className="page fade-in">
        <div className="eyebrow">Account</div>
        <h1 className="display" style={{ fontSize: 34 }}>You're not signed in.</h1>
        <p className="lede">Sign in to pick up where you left off.</p>
        <button className="btn btn-primary" onClick={() => go("/login")}>Log in</button>
      </div>
    );
  }
  if (phase === "preparing" || phase === "loading") {
    return (
      <div className="page fade-in">
        <div className="eyebrow">Your case</div>
        <div className="checklist-loading">
          <span className="spinner" style={{ width: 16, height: 16, borderWidth: 2 }} />
          <span>{phase === "preparing" ? "Preparing your case…" : "Loading…"}</span>
        </div>
      </div>
    );
  }

  const recap = (caseRow && caseRow.recap) || "";
  const lastVisit = caseRow && (caseRow.last_session_at || caseRow.updated_at);
  let lastVisitStr = null;
  try {
    if (lastVisit) lastVisitStr = new Date(lastVisit).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
  } catch (e) {}

  const onContinue = () => {
    try { sessionStorage.setItem("plainly:return_opening", buildReturnOpening(recap)); } catch (e) {}
    go("/start");
  };
  const saveNotes = async () => {
    if (!sb || !user) return;
    setNotesStatus("saving");
    try {
      await sb.from("cases").upsert(
        { user_id: user.id, parent_notes: notes, updated_at: new Date().toISOString() },
        { onConflict: "user_id" }
      );
      setNotesStatus("saved");
      setTimeout(() => setNotesStatus("idle"), 2500);
    } catch (e) { setNotesStatus("idle"); }
  };

  // Dashboard fields, derived from the stored case (intake + formal_fields).
  // Everything is optional — missing fields are omitted, never shown blank.
  const intake = (caseRow && caseRow.intake) || {};
  const formal = (caseRow && caseRow.formal_fields) || {};
  const childFirst = (intake.student_first_name || "").trim();
  const childFull = (formal.child_full_name || "").trim();
  const childTitle = childFull || childFirst;          // case-card title (full legal preferred)
  const childPossessive = childFirst || childFull;     // header "[Child]'s Case"
  const headerTitle = childPossessive
    ? `Your Account — ${childPossessive}'s Case`
    : "Your Account — Your Case";
  const gradeStr = intake.student_grade != null ? String(intake.student_grade).trim() : "";
  const ageStr = intake.student_age != null ? String(intake.student_age).trim() : "";
  const school = (intake.student_school || "").trim();
  const classification = (intake.student_classification || "").trim();
  const facts = [
    gradeStr ? `Grade ${gradeStr}` : null,
    ageStr ? `Age ${ageStr}` : null,
    school || null,
    classification || null,
  ].filter(Boolean);
  const issue = recap || (intake.concerns_summary || "").trim();
  const kd = intake.key_dates || {};
  const cseDate = (kd.most_recent_cse_date || "").trim();
  const noticeDate = (kd.ten_day_notice_date_sent || "").trim();

  return (
    <div className="account-dash fade-in">
      <div className="dash-header">
        <div className="eyebrow">Your account</div>
        <h1 className="display" style={{ fontSize: 40, marginBottom: 8 }}>{headerTitle}</h1>
        {lastVisitStr && <p className="muted" style={{ margin: 0 }}>Last visit: {lastVisitStr}</p>}
        <div className="dash-actions">
          <button className="btn btn-primary" onClick={onContinue}>Continue the conversation</button>
          <button className="btn btn-ghost" onClick={authSignOut}>Log out</button>
        </div>
      </div>

      <div className="card case-card">
        <div className="eyebrow" style={{ marginBottom: 12 }}>Case summary</div>
        {childTitle && <h2 className="case-title">{childTitle}</h2>}
        {facts.length > 0 && <div className="case-facts">{facts.join(" · ")}</div>}
        {issue
          ? <p className="case-issue">{issue}</p>
          : <p className="case-issue muted">We haven't built up a summary of your situation yet — pick up the conversation whenever you're ready.</p>}
        {(cseDate || noticeDate) && (
          <div className="case-dates">
            {cseDate && <span><span className="case-date-label">CSE meeting</span>{cseDate}</span>}
            {noticeDate && <span><span className="case-date-label">10-day notice sent</span>{noticeDate}</span>}
          </div>
        )}
      </div>

      <div className="dash-grid">
        <div className="dash-main">
          <div className="card">
            <h3 className="sub">My notes</h3>
            <p className="help">Anything you want to jot down for yourself — questions, dates, what happened at a meeting. I'll have these in our next conversation.</p>
            <div className="field">
              <textarea rows={10} value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="e.g., CSE meeting is on the 14th; ask about the speech eval." />
            </div>
            <button className="btn btn-ghost" onClick={saveNotes} disabled={notesStatus === "saving"}>
              {notesStatus === "saving" ? "Saving…" : notesStatus === "saved" ? "Saved ✓" : "Save notes"}
            </button>
          </div>

          {docsReviewed.length > 0 && (
            <div className="card">
              <h3 className="sub">Docs Reviewed by Be Heard</h3>
              <p className="help">
                Documents you've shared here. To protect your and your child's
                privacy, only a short summary is kept here — never the original file. If
                we need the specifics again, I'll ask you to re-upload it.
              </p>
              <ul style={{ listStyle: "none", padding: 0, margin: 0 }}>
                {docsReviewed.map((d, i) => (
                  <li key={i} style={{ padding: "10px 0", borderTop: i ? "1px solid var(--border-soft)" : "none" }}>
                    <div style={{ fontWeight: 500 }}>
                      {d.doc_type || "Document"}{d.date_conducted ? ` — ${d.date_conducted}` : ""}
                    </div>
                    {d.headline_extraction && (
                      <div style={{ fontSize: 13, color: "var(--ink-muted)", marginTop: 2 }}>{d.headline_extraction}</div>
                    )}
                    <div style={{ fontSize: 12, color: "var(--ink-soft)", marginTop: 2 }}>
                      {d.filename}{d.source ? ` · ${d.source}` : ""}{d.date_reviewed ? ` · reviewed ${d.date_reviewed}` : ""}
                    </div>
                  </li>
                ))}
              </ul>
            </div>
          )}
        </div>

        <div className="dash-rail">
          <div className="card">
            <h3 className="sub">Documents Prepared by Be Heard</h3>
            {genFiles.length > 0 ? (
              <>
                <p className="help">
                  Documents we put together with you — your complaint, letters.
                  Download them whenever you need them.
                </p>
                <ul style={{ listStyle: "none", padding: 0, margin: 0 }}>
                  {genFiles.map((f, i) => (
                    <li
                      key={f.name}
                      style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, padding: "10px 0", borderTop: i ? "1px solid var(--border-soft)" : "none" }}
                    >
                      <span>{f.name.replace(/\.pdf$/i, "").replace(/[-_]/g, " ").replace(/^./, (c) => c.toUpperCase())}</span>
                      <button className="btn btn-ghost" onClick={() => downloadGenFile(f.name)} disabled={downloadingFile === f.name}>
                        {downloadingFile === f.name ? "Downloading…" : "Download"}
                      </button>
                    </li>
                  ))}
                </ul>
              </>
            ) : (
              <p className="help">Nothing here yet. When we draft a complaint or letter with you, it'll show up here to download.</p>
            )}
          </div>
        </div>
      </div>

      <p className="muted" style={{ marginTop: 18, fontSize: 13 }}>
        Signed in as {user.email}.
      </p>
    </div>
  );
}

function App() {
  const route = useRoute();

  // After a magic-link sign-in completes, land on the account page. SIGNED_IN
  // fires on a fresh sign-in (not on a restored session), so returning users who
  // reload elsewhere aren't yanked here.
  useEffect(() => {
    if (!sb) return;
    const { data: listener } = sb.auth.onAuthStateChange((event) => {
      if (event === "SIGNED_IN") go("/account");
    });
    return () => { if (listener && listener.subscription) listener.subscription.unsubscribe(); };
  }, []);

  let page;
  // Implicit-flow magic-link return: tokens (or an error) come back in the URL
  // hash, colliding with the hash router. Hold a sign-in screen until the client
  // parses the session and the effect above routes onward.
  const isAuthCallback =
    route.indexOf("access_token=") !== -1 ||
    route.indexOf("error_description=") !== -1 ||
    route.indexOf("error=") !== -1;
  if (isAuthCallback) {
    page = <AuthCallback />;
  } else {
  // /terms and /terms/<anchor> both render TermsPage; the anchor deep-links a section.
  let termsAnchor = null;
  let routeKey = route;
  if (route === "/terms" || route.indexOf("/terms/") === 0) {
    termsAnchor = route.indexOf("/terms/") === 0 ? route.slice("/terms/".length) : null;
    routeKey = "/terms";
  }
  switch (routeKey) {
    case "/": page = <HomePage />; break;
    case "/start": page = <StartPage />; break;
    case "/login": page = <LoginPage />; break;
    case "/how": page = <HowPage />; break;
    case "/who": page = <WhoPage />; break;
    case "/faq": page = <FaqPage />; break;
    case "/resources": page = <ResourcesPage />; break;
    case "/about": page = <AboutPage />; break;
    case "/contact": page = <ContactPage />; break;
    case "/terms": page = <TermsPage anchor={termsAnchor} />; break;
    case "/privacy": page = <PrivacyPage />; break;
    case "/disclaimer": page = <Redirect to="/terms" />; break;
    case "/account": page = <AccountPage />; break;
    default: page = <NotFoundPage />;
  }
  }

  return (
    <>
      <style>{STYLES}</style>
      <div className="app-root">
        <Header route={route} />
        {page}
        <Footer />
      </div>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(
  <LangProvider>
    <App />
  </LangProvider>
);
</script>
