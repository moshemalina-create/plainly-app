<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

// ============================================================================
// AUTH (Supabase magic-link) — optional accounts. The anonymous path never
// depends on this: if the client fails to load, authReady stays false and no
// auth UI mounts, so Start works exactly as before.
// ============================================================================
const SUPABASE_URL = "https://fzlztzqdvxibxnnfoeyc.supabase.co";
// Publishable (anon-equivalent) key. Public by design — security is RLS, not
// secrecy. The service-role key is NOT here and never goes in the client.
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_41fCnhgEDTpo3IuSpB9PVA_U1NRtf-l";
// Recorded with each new account's consent. PLACEHOLDER wording until the owner
// supplies the real consent text — going live on placeholder text is a launch
// gate (see docs/accounts-persistence.md).
const CONSENT_VERSION = "placeholder-2026-06";

let sb = null;
try {
  if (typeof window !== "undefined" && window.supabase && window.supabase.createClient) {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth: {
        // Implicit flow: tokens return in the URL hash, which works cross-device
        // (the magic link can be opened on a different device than it was
        // requested from). The hash-router collision is handled explicitly in
        // the auth-callback path.
        flowType: "implicit",
        detectSessionInUrl: true,
        persistSession: true,
        autoRefreshToken: true,
      },
    });
  }
} catch (e) {
  sb = null;
}
// True only when the client actually initialized. Gates every piece of auth UI.
const authReady = !!sb;

// Auth-state hook. Safe to call from multiple components — each gets its own
// subscription. Returns the current session/user and a one-time loading flag.
function useAuth() {
  const [session, setSession] = useState(null);
  const [authLoading, setAuthLoading] = useState(authReady);
  useEffect(() => {
    if (!sb) { setAuthLoading(false); return; }
    let active = true;
    sb.auth.getSession()
      .then(({ data }) => { if (active) { setSession(data ? data.session : null); setAuthLoading(false); } })
      .catch(() => { if (active) setAuthLoading(false); });
    const { data: listener } = sb.auth.onAuthStateChange((_event, s) => {
      if (active) setSession(s);
    });
    return () => {
      active = false;
      if (listener && listener.subscription) listener.subscription.unsubscribe();
    };
  }, []);
  return { session, user: session ? session.user : null, authLoading };
}

async function authSignOut() {
  if (sb) { try { await sb.auth.signOut(); } catch (e) {} }
  go("/");
}

// ============================================================================
// PLAINLY — SITE SHELL
// ============================================================================
// A demo of the broader site that wraps the chat tool. This is a single-file
// React app with simple hash-based routing. When porting to Next.js, each
// route below becomes its own page file.
//
// Routes:
//   #/         home
//   #/start    the chat tool (stub link in this file — full version is the
//              standalone artifact; in production this will be the live tool)
//   #/how      "How it works" — NY due process arc in plain language
//   #/who      "Is this for me?" — claim types with examples
//   #/faq      common questions
//   #/resources  links to NYSED, NYC IHO, mediation, primary sources
//   #/about    about, disclaimers
// ============================================================================

const STYLES = `
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,800&family=Newsreader:ital,wght@0,300;0,400;0,500;1,400&display=swap');

/* Self-hosted Be Heard wordmark (heaviest Fraunces display cut, logo glyphs only) */
@font-face {
  font-family: "BeHeard Wordmark";
  src: url("/brand/BeHeard-Wordmark.woff2") format("woff2");
  font-weight: 800;
  font-display: swap;
}

:root {
  /* Be Heard brand tokens — single source of truth (consolidated from the two
     former :root blocks). Navy backbone + terracotta accent; no teal/green.
     --accent* is intentionally collapsed onto the terracotta family so every
     legacy var(--accent) consumer renders terracotta (this also auto-unifies the
     two italic accents). */
  --bg: #F2EADB;            /* cream page background */
  --surface: #FBF6EC;       /* cream card / raised surface */
  --surface-2: #EAE0CE;     /* cream sunken / inset */
  --ink: #1B3A5B;           /* navy — headlines, body, structure */
  --ink-muted: #5A5248;     /* secondary text / tagline */
  --ink-soft: #8A8275;      /* meta / hints */
  --accent: #C8501F;        /* collapsed onto terracotta (was teal/green) */
  --accent-deep: #A8401A;
  --accent-soft: #FBE0D5;   /* soft terracotta tint (was teal tint) */
  --action: #C8501F;        /* terracotta — the only action color */
  --action-deep: #A8401A;   /* action hover / pressed */
  --action-soft: #FBE0D5;   /* soft terracotta tint */
  --warn: #B85C38;
  --warn-soft: #F2DDD0;
  --warn-deep: #8A4226;
  --border: rgba(27, 58, 91, 0.15);       /* navy hairline */
  --border-soft: rgba(27, 58, 91, 0.09);  /* faint navy divider */
  --shadow: 0 1px 2px rgba(27,58,91,0.05), 0 4px 12px rgba(27,58,91,0.05);
  --shadow-lg: 0 4px 28px rgba(27,58,91,0.10);
}

* { box-sizing: border-box; }

body, html, #root {
  margin: 0;
  padding: 0;
  background: var(--bg);
  font-family: 'Newsreader', Georgia, serif;
  color: var(--ink);
  font-size: 17px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.app-root {
  min-height: 100vh;
  background-image:
    radial-gradient(circle at 15% 0%, rgba(31,111,139,0.07) 0%, transparent 38%),
    radial-gradient(circle at 85% 30%, rgba(215,82,42,0.07) 0%, transparent 38%);
}

/* ------- Header ------- */

.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--bg);
  border-bottom: 1px solid var(--border-soft);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.site-header-inner {
  max-width: 1080px;
  margin: 0 auto;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 32px;
}
.brand-link {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: inherit;
  flex-shrink: 0;
}
.brand-mark {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--accent);
  position: relative;
  flex-shrink: 0;
}
.brand-mark::after {
  content: '';
  position: absolute;
  inset: 5px;
  border: 1.5px solid var(--bg);
  border-radius: 50%;
}
.brand-name {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 21px;
  letter-spacing: -0.015em;
  color: var(--ink);
}
.brand-mark-tag {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-soft);
  margin-left: 16px;
  font-weight: 500;
}
/* Be Heard live-text wordmark (replaces the ring/circle logo). "Heard" is
   terracotta with the signature underline. */
.bh-wordmark {
  font-family: "BeHeard Wordmark", 'Fraunces', Georgia, serif;
  font-weight: 800;
  letter-spacing: -0.01em;
  line-height: 1;
  color: var(--ink);          /* navy "Be" */
  display: inline-block;
}
.bh-wordmark .bh-heard {
  color: var(--action);       /* terracotta "Heard" */
  border-bottom: 0.07em solid #E8602C;  /* terracotta-lift underline (brand signature) */
  padding-bottom: 0.04em;
}
.bh-wordmark--header { font-size: 24px; }
.bh-wordmark--footer { font-size: 22px; }
/* Inline in a heading: inherit the heading's size, render the name as the wordmark. */
.bh-wordmark--inline { font-size: inherit; letter-spacing: -0.01em; }

.site-nav {
  display: flex;
  gap: 24px;
  align-items: center;
  flex: 1;
}
.site-nav a {
  color: var(--ink-muted);
  text-decoration: none;
  font-size: 15px;
  transition: color 0.15s ease;
  white-space: nowrap;
}
.site-nav a:hover { color: var(--ink); }
.site-nav a.active { color: var(--accent); font-weight: 500; }

.header-cta {
  background: var(--action);
  color: white;
  padding: 8px 18px;
  border-radius: 6px;
  text-decoration: none;
  font-size: 14.5px;
  font-weight: 500;
  font-family: inherit;
  transition: background 0.15s ease;
  white-space: nowrap;
}
.header-cta:hover { background: var(--action-deep); }

/* Mid widths: free space so the (now non-wrapping) nav links never crowd or
   overflow — drop the decorative brand tag and tighten gaps. */
@media (max-width: 980px) {
  .brand-mark-tag { display: none; }
  .site-header-inner { gap: 22px; }
  .site-nav { gap: 18px; }
}

@media (max-width: 720px) {
  .site-nav { display: none; }
  .site-header-inner { padding: 14px 18px; gap: 12px; }
}

/* ------- Page shell ------- */

.page {
  max-width: 720px;
  margin: 0 auto;
  padding: 56px 24px 80px;
}
.page-wide {
  max-width: 1000px;
  margin: 0 auto;
  padding: 56px 24px 80px;
}
/* Middle tier — grids, headings, and structural sections. Shares the 960px
   width with the account dashboard. Reserved band width (1120) stays for the
   composed hero / how-it-works sections; pure prose stays at .page (720). */
.page-mid {
  max-width: 960px;
  margin: 0 auto;
  padding: 56px 24px 80px;
}
/* Prose keeps a readable measure even when it sits inside a wider tier. */
.measure { max-width: 65ch; }
/* Center the measure column under a centered heading (block centered; multi-line
   text stays left-aligned unless .text-center is also set). */
.measure.center { margin-left: auto; margin-right: auto; }
.measure.text-center { text-align: center; }

@media (max-width: 720px) {
  .page, .page-wide, .page-mid { padding: 32px 18px 60px; }
}

/* ------- Type ------- */

h1.display {
  font-family: 'Fraunces', serif;
  font-weight: 400;
  font-size: 52px;

  margin: 0 0 20px;
}
h1.display em { font-style: italic; font-weight: 300; color: var(--action); }

@media (max-width: 720px) {

}

h2.section {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 32px;
  line-height: 1.15;
  letter-spacing: -0.015em;
  color: var(--ink);

}

h3.sub {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 20px;
  letter-spacing: -0.005em;

}

.eyebrow {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  color: var(--ink);
  font-weight: 600;
  margin-bottom: 16px;
}

.lede {

}

p { margin: 0 0 16px; }
p.muted { color: var(--ink-muted); }
p.soft { color: var(--ink-soft); font-size: 14px; }

a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { color: var(--action-deep); text-decoration-thickness: 2px; }

ul, ol { padding-left: 22px; margin: 0 0 16px; }
li { margin-bottom: 8px; }

strong { font-weight: 500; color: var(--ink); }

/* ------- Buttons ------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 13px 24px;
  border-radius: 6px;
  font-family: 'Newsreader', serif;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s ease;
  border: none;
  text-decoration: none;
}
.btn-primary { background: var(--action); color: white; }
.btn-primary:hover { background: var(--action-deep); color: white; }
.btn-accent { background: var(--action); color: white; }
.btn-accent:hover { background: var(--action-deep); color: white; }
.btn-secondary {
  background: transparent;
  color: var(--ink);
  border: 1px solid rgba(27, 58, 91, 0.30);
}
.btn-secondary:hover { background: rgba(27, 58, 91, 0.04); color: var(--ink); border-color: var(--ink); }
.btn:focus-visible, .header-cta:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(232, 96, 44, 0.35);
}
.btn-large { padding: 18px 40px; font-size: 19px; }

.btn-row {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}

/* ------- Cards / sections ------- */

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-top: 2px solid var(--ink);
  border-radius: 0;
  padding: 28px;
  margin-bottom: 14px;
}
.card-accent {
  border-top-color: var(--action);
}
.card h3 { margin-top: 0; }

/* ------- Account dashboard (scoped to /account only) -------
   Widening + grid live entirely under .account-dash and namespaced children.
   The site-wide .page (720px) is NOT touched, so the chat (.page-wide) and every
   other page are unaffected. */
.account-dash {
  max-width: 960px;
  margin: 0 auto;
  padding: 56px 24px 80px;
}
.dash-header { margin-bottom: 22px; }
.dash-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }

/* Docket-style case card — the signature element */
.case-card { padding: 26px 30px; }
.case-title {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 26px;
  letter-spacing: -0.01em;
  color: var(--ink);
  margin: 0 0 12px;
}
.case-facts {
  background: var(--surface-2);
  border-radius: 8px;
  padding: 10px 14px;
  margin: 0 0 16px;
  font-size: 14px;
  color: var(--ink-muted);
}
.case-issue { font-size: 16px; line-height: 1.6; color: var(--ink); margin: 0; }
.case-dates {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 28px;
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--border-soft);
  font-size: 14px;
  color: var(--ink);
}
.case-date-label {
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 11px;
  font-weight: 600;
  color: var(--accent);
  margin-right: 6px;
}

/* Inputs (main) / outputs (rail) split */
.dash-grid {
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  gap: 20px;
  align-items: start;
  margin-top: 20px;
}
.dash-main, .dash-rail { min-width: 0; }
.dash-main .card, .dash-rail .card { margin-bottom: 20px; }

/* Notes textarea fills its card. A textarea is inline-block by default, so
   force block + full width to guarantee it spans the section; taller by default
   since notes tend to run long. Scoped to the dashboard so no other .field
   textarea (drafter, letters) is affected. */

  display: block;
  width: 100%;
  min-height: 220px;
}

@media (max-width: 720px) {
  .dash-grid { grid-template-columns: 1fr; }
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin: 24px 0;
}
@media (max-width: 720px) {
  .card-grid { grid-template-columns: 1fr; }
}

.card-grid-2 {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  margin: 24px 0;
}
@media (max-width: 720px) {
  .card-grid-2 { grid-template-columns: 1fr; }
}

  font-size: 14.5px;

  margin: 0;

  padding-top: 12px;
  font-size: 13px;
  color: var(--action);

}

/* Split composition: text left, photo right, in a wider band that breaks the

  gap: 44px;
  flex-wrap: wrap;
  font-size: 16.5px;

  display: flex;
  flex-direction: column;
  gap: 4px;

  padding-left: 44px;
}
.hero-stat-num {
  font-family: 'Fraunces', serif;
  font-size: 40px;
  font-weight: 500;
  color: var(--ink);

// ROUTING (hash-based, no library)

function useRoute() {
  const get = () => {
    if (typeof window === "undefined") return "/";
    const h = window.location.hash || "#/";
    return h.replace(/^#/, "") || "/";
  };
  const [route, setRoute] = useState(get);
  useEffect(() => {
    const onHash = () => setRoute(get());
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);
  useEffect(() => {
    if (typeof window !== "undefined") window.scrollTo({ top: 0, behavior: "instant" });
  }, [route]);
  return route;
}

function go(path) {
  if (typeof window !== "undefined") window.location.hash = "#" + path;
}

function HowPage() {
  return (
    <div className="page fade-in">
      <div className="eyebrow">How it works</div>
      <h1 className="display" style={{ fontSize: 42 }}>
        What filing a <em>due process complaint</em> in New York actually looks like.
      </h1>
      <p className="lede">
        In plain language, with realistic timelines. The whole process is more
        manageable than it sounds — most cases don't end up at a hearing.
      </p>

      <h2 className="section" style={{ marginTop: 32 }}>The arc</h2>
      <div className="timeline">
        <div className="timeline-step">
          <div className="meta">Step 1 · Day 0</div>
          <h4>You file the complaint</h4>
          <p>
            The complaint is a written document — a letter, basically — that
            describes the problem and what you want fixed. You send it to two
            places at the same time: your school district and the New York
            State Education Department. There's no filing fee, and we draft it
            for you in your voice.
          </p>
        </div>
        <div className="timeline-step">
          <div className="meta">Step 2 · Within 15 days</div>
          <h4>Resolution session</h4>
          <p>
            The district has to convene a "resolution session" — basically a
            sit-down meeting between you and district representatives to try to
            settle the complaint. It's informal. No hearing officer, no
            transcript. A lot of cases settle here. The district usually shows
            up because they'd rather give you something than litigate.
          </p>
        </div>
        <div className="timeline-step">
          <div className="meta">Step 3 · Days 15–30</div>
          <h4>Resolution period</h4>
          <p>
            If the resolution session doesn't fully resolve things on day one,
            the parties have up to 30 days from the date you filed to keep
            negotiating. Many cases that don't settle on day one do settle
            within this window. Mediation is also available as a separate,
            voluntary alternative — free, less formal — if both sides agree.
          </p>
        </div>
        <div className="timeline-step">
          <div className="meta">Step 4 · ~Day 75 in NY</div>
          <h4>If unresolved: due process hearing</h4>
          <p>
            If nothing's been resolved, the case proceeds to a formal hearing
            before an Impartial Hearing Officer (IHO). Both sides present
            evidence and witnesses. NYC has its own Impartial Hearing Office;
            other NY districts handle hearings through their own procedures.
            The hearing itself is usually 1–3 days. Extensions are common in
            practice, so the actual timeline can run longer.
          </p>
        </div>
        <div className="timeline-step">
          <div className="meta">Step 5 · ~45 days after hearing</div>
          <h4>Decision</h4>
          <p>
            The hearing officer issues a written decision. If you disagree with
            it, you can appeal to a State Review Officer (SRO), and from there
            potentially to court. Most cases don't reach this stage.
          </p>
        </div>
      </div>

      <div className="callout">
        <strong>What this all means for your time:</strong>
        <p style={{ marginTop: 8 }}>
          If your case settles at the resolution session — which a lot do — the
          whole thing might be a couple of hours of your time, plus drafting and
          gathering documents. If it goes to hearing, plan on 1–3 days of
          hearing time plus prep. Throughout, your child's current program
          stays in place; the district can't change it while the case is pending.
        </p>
      </div>

      <h2 className="section">A few things parents are usually surprised to learn</h2>
      <div className="card">
        <h3 className="sub">There's no filing fee.</h3>
        <p className="muted" style={{ margin: 0 }}>
          Filing a due process complaint costs you nothing out of pocket. Some
          parents end up paying for outside evaluations or hiring an advocate or
          attorney, but the filing itself is free.
        </p>
      </div>
      <div className="card">
        <h3 className="sub">The district can't recover legal fees from you.</h3>
        <p className="muted" style={{ margin: 0 }}>
          Under IDEA, fee-shifting only runs to prevailing parents — meaning a
          district can't make you pay their lawyer. The narrow exception is for
          truly frivolous filings, which is a high bar.
        </p>
      </div>
      <div className="card">
        <h3 className="sub">Pendency means your child's current program stays.</h3>
        <p className="muted" style={{ margin: 0 }}>
          Once you file, the district can't change your child's program until
          the case is resolved. This is called "pendency" or "stay-put." For
          most parents this is a feature: it freezes things in place while you
          negotiate.
        </p>
      </div>
      <div className="card">
        <h3 className="sub">Most cases settle at the resolution session.</h3>
        <p className="muted" style={{ margin: 0 }}>
          The resolution session exists because districts settle most cases
          there. They have lawyers; lawyers are expensive; districts would
          rather give parents something than fight. Parents who file with a
          credible, well-organized claim often walk out of the resolution
          session with most of what they wanted.
        </p>
      </div>
      <div className="card">
        <h3 className="sub">You don't need a lawyer to file.</h3>
        <p className="muted" style={{ margin: 0 }}>
          Many parents handle the resolution session themselves, especially
          when the facts are clear. If a case escalates to a hearing — and
          especially if the district shows up with their attorney — that's
          when many parents reassess. You can always bring in an attorney or
          advocate later.
        </p>
      </div>

      <h2 className="section">A short video walkthrough</h2>
      <p className="muted">Coming soon — we're producing a series of short videos covering each step.</p>
      <div className="card-grid-2">
        <VideoPlaceholder title="What a resolution session is actually like" duration="3 min" />
        <VideoPlaceholder title="What to bring to a CSE meeting" duration="4 min" />
        <VideoPlaceholder title="How to read your child's IEP" duration="5 min" />
        <VideoPlaceholder title="Mediation vs. due process — which is right?" duration="4 min" />
      </div>

      <div className="cta-strip">
        <h3>See what filing would look like for your situation</h3>
        <p>The chat tool walks you through it. About ten minutes.</p>
        <button className="btn btn-primary" onClick={() => go("/start")}>Start now</button>
      </div>
    </div>
  );
}

function WhoPage() {

    <div className="page fade-in">
      <div className="eyebrow">Is this for me?</div>
      <h1 className="display" style={{ fontSize: 42 }}>
        How We Can Help
      </h1>

        that out with you.
      </p>

      {CLAIM_TYPES.map((c, i) => (
        <div className="card" key={i} style={{ marginBottom: 16 }}>
          <h3 className="sub">{c.title}</h3>
          <p className="muted" style={{ marginBottom: 12 }}>{c.summary}</p>
          <ul style={{ marginBottom: c.flag ? 12 : 0 }}>
            {c.examples.map((ex, j) => <li key={j}>{ex}</li>)}
          </ul>
          {c.flag && (
            <div className="callout" style={{ margin: "8px 0 0", fontSize: 14 }}>
              <strong>Note:</strong> {c.flag}
            </div>
          )}
        </div>
      ))}

      <h2 className="section">When this isn't really a due process issue</h2>
      <p>
        Not every disagreement with a school is a due process matter. A few
        situations that look like ours but really aren't:
      </p>
      <ul>
        <li>
          <strong>Run-of-the-mill teacher complaints.</strong> If the issue is
          about a specific teacher's style or personality and there's no IEP
          implication, due process isn't the right tool.
        </li>
        <li>
          <strong>Bullying alone.</strong> Bullying may be relevant to a special
          education claim if it's interfering with your child's education, but
          most pure bullying complaints go through other channels (Title IX,
          the Dignity for All Students Act, etc.).
        </li>
        <li>
          <strong>504 plan disputes (mostly).</strong> 504 plans have their own
          process and are governed by Section 504 of the Rehabilitation Act,
          not IDEA. There's overlap, but it's a different track.
        </li>
        <li>
          <strong>General educational quality.</strong> "The school isn't very
          good" isn't a due process claim. It has to be about your child's
          specific needs not being met under their IEP.
        </li>
      </ul>

      <div className="cta-strip">
        <h3>Not sure if your situation fits?</h3>
        <p>
          Just tell us what's going on. We'll help you figure out together
          whether there's a viable due process claim — and if there isn't,
          we'll be honest about it and tell you what to do instead.
        </p>
        <button className="btn btn-primary" onClick={() => go("/start")}>
          Start the conversation
        </button>
      </div>
    </div>
  );
}

// ============================================================================
// SESSION STORAGE SHIM — emulates artifact window.storage API
// ============================================================================
// Uses sessionStorage (not localStorage): a conversation survives a page
// reload WITHIN the same browser tab, but a new visit / new tab / closing the
// tab starts completely fresh. This prevents a new visitor from ever seeing a
// previous person's conversation, while still protecting against accidental
// mid-session refreshes. Installed BEFORE any chat code runs.
if (typeof window !== "undefined" && !window.storage) {
  var _store = (typeof sessionStorage !== "undefined") ? sessionStorage : null;
  // In-memory fallback if sessionStorage is unavailable (private mode edge cases)
  var _mem = {};
  function _get(k) { return _store ? _store.getItem(k) : (k in _mem ? _mem[k] : null); }
  function _set(k, v) { if (_store) _store.setItem(k, v); else _mem[k] = v; }
  function _del(k) { if (_store) _store.removeItem(k); else delete _mem[k]; }
  function _len() { return _store ? _store.length : Object.keys(_mem).length; }
  function _key(i) { return _store ? _store.key(i) : Object.keys(_mem)[i]; }

  window.storage = {
    async get(key) {
      const v = _get(key);
      if (v == null) throw new Error("Key not found: " + key);
      return { key, value: v, shared: false };
    },
    async set(key, value) {
      try {
        const s = typeof value === "string" ? value : JSON.stringify(value);
        _set(key, s);
        return { key, value: s, shared: false };
      } catch (e) { return null; }
    },
    async delete(key) {
      try { _del(key); return { key, deleted: true, shared: false }; }
      catch (e) { return null; }
    },
    async list(prefix) {
      const keys = [];
      for (let i = 0; i < _len(); i++) {
        const k = _key(i);
        if (!prefix || (k && k.startsWith(prefix))) keys.push(k);
      }
      return { keys, prefix, shared: false };
    },
  };

  // One-time cleanup: the previous version stored conversations in
  // localStorage. Remove any leftover "plainly:" keys there so old data doesn't
  // linger in returning visitors' browsers.
  try {
    if (typeof localStorage !== "undefined") {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && (k.indexOf("plainly:") === 0 || k.indexOf("filing_path_demo:") === 0)) {
          stale.push(k);
        }
      }
      stale.forEach((k) => localStorage.removeItem(k));
    }
  } catch (e) { /* ignore */ }
}

const CHAT_ADVOCATE_PROMPT = `You are a special education advocate helping a parent in New York State. You know this system — IDEA, Article 89, how CSE meetings actually go, what districts do when they're pushed and when they're not — far better than the parent does. Your job is to help them navigate it: understand what's happening with their child's services, make sense of their documents, push back on decisions that aren't right, get things in writing, and prepare for meetings and conversations with the district.

Filing a due process complaint is ONE tool you can help with — not the destination. Some parents need a single letter. Some need to understand their options. Some need to know whether what the district did was even allowed. Some will end up filing. Meet the parent where they are.

WHO YOU ARE — TONE
You sound like a knowledgeable friend who has done this before. Confident, direct, warm. Honest when something is genuinely uncertain, rather than falsely reassuring or falsely alarming. You are NOT a polite explainer. You are NOT a customer-service agent. You are NOT a lawyer being careful. You're the person a parent calls because you actually know how this works and you'll tell them straight.
- Plain English. Use the child's first name. Keep messages short — don't lecture, don't dump everything you know. Answer what they asked, then point to the next useful thing.
- Never use "FAPE," "LRE," or cite statutes in chat. Explain the ideas in ordinary words.
- Acknowledge feelings briefly when it matters, then keep moving. You're useful, not therapeutic.
- Never tell a parent their case is weak, and never tell them to just accept it.

HOW YOU WORK
There is no script and no intake form. Let the parent tell you what's going on in their own words, and follow it. Ask good questions to understand the situation, but don't interrogate — one thing at a time, and only what you actually need to be useful right now. This is a conversation, not a form.

Early on you mainly need enough to talk naturally and understand the problem: the child's first name, roughly their age and grade, and what's actually going wrong. Formal identifiers — full names, addresses, the district's name, dates of birth — you do NOT need yet and should not ask for. Those come later, and only if the parent decides to put something in writing or file. The schema below includes fields like the district's name; capture these if the parent mentions them naturally, but don't ask for them.

ADVOCATE BEHAVIORS — this is the actual job
A good advocate doesn't just answer questions. You:
- Push back when the parent's read of the situation seems off. If they think something is hopeless when it isn't, or think they have a slam dunk when it's shakier than that, say so — kindly and directly. They came to you because you know better; don't just nod along. Pushing back on how they're reading things — a procedural slip they think sinks the whole case when it doesn't, a slam dunk that's really a maybe — is NOT the same as telling them their case is weak. Do the first; never do the second.
- Tell the truth about gray areas. When something is genuinely unsettled, name it as a gray area and explain both sides, instead of pretending it's clear-cut.
- Warn the parent before they weaken their own position. If they're about to fire off an angry email, agree to something at a meeting on the spot, sign an IEP they haven't read, or let a deadline slide — flag it. "Before you send that — quick heads up: ..." Tactics matter, and parents usually don't know the move.
- Surface tools they don't know they have. Parents dramatically under-use their rights. A lot of your value is simply telling them what they CAN do.

DOCUMENTS
Documents — the IEP, evaluations, prior written notices, progress reports, report cards, anything — make your guidance far more concrete. There's an attach button right in the chat, and you can invite the parent to use it.

Asking for documents:
- Lightly and early, when one would help but isn't essential: "If you've got [child]'s IEP handy, attach it and I'll take a look." No pressure.
- More directly when the answer genuinely depends on what's in the document — but keep the focus on THEIR question, not on your own limitations. Don't say "I can't tell you without seeing it." Say: "Whether that reading goal is actually appropriate depends on what the evaluation recommended — is that something you can share?"
- Ask once. If they don't have it, work with what you've got and tell them what's less certain without it. Don't nag.

When a parent attaches a document, do NOT immediately analyze it at them. Acknowledge that you've read it, maybe note one or two things that stand out, and then hand the floor back to the parent. For example: "Okay, I've read through it. Before I tell you what I notice — what's been bothering you about how things are going for [child]?" The document is there to inform the parent's concern, not to trigger a preemptive report. Let them tell you what matters; then use the document to go deeper on it.

Once a document is in the conversation, its text appears in an UPLOADED DOCUMENTS section appended below. Treat that text as the real document the parent shared. Reference specifics naturally — service amounts, goal language, dates, classification, who signed what. Never invent anything that isn't actually there. If a document shows as truncated, tell the parent you've read most of it and ask them to point you to a specific section or page if you need a part you can't see. Documents can be any type; work out what each one is from its contents and use it accordingly.

THE IEP AND THE EVALUATION MUST ALIGN — check for the eval before you finalize
An IEP is supposed to flow from the child's evaluation: the evaluation identifies the areas of need, and the IEP is supposed to address exactly those. They are two independent documents, and parents usually don't know they're supposed to match — teaching them this is one of the most useful things you can do. A reasonable-looking IEP can still be wrong because it doesn't do what the evaluation says the child needs: goals in the wrong area, nothing for the child's biggest documented deficit, services that don't match the findings.

You can give an initial read on the IEP alone. But BEFORE you give a firm judgment on whether the IEP is adequate — or finalize a document that turns on adequacy — check whether the parent has the district's evaluation (and any private evaluation). Ask plainly: "Do you have the evaluation the district did? The IEP is supposed to line up with what that evaluation found, and comparing the two is often where the real problem shows up."
- If they have it (attached, or already in the conversation): analyze the gap. What did the evaluation identify as the areas of need, and what did it recommend? What does the IEP actually do? Name the mismatches concretely — an area the eval flagged that the IEP has no goal for, a recommendation the IEP ignores, service levels that don't match the findings. That gap is often the most concrete part of the case.
- If they DON'T have it readily: do NOT stall or make them feel stuck. Keep going with what you have — give your read, draft the document they need — and tell them briefly that the evaluation would sharpen it and why: "If you can get the evaluation later, we can check whether the IEP actually matches what it found — that's often the clearest way to show the program is off." The eval strengthens the work; it is never a precondition for doing it.

PREVIOUSLY REVIEWED DOCUMENTS (returning parents)
You may see a PREVIOUSLY REVIEWED DOCUMENTS section below. These are SHALLOW HEADLINES of documents the parent shared in an earlier conversation. To protect the family's privacy, this tool does not keep the original files between sessions — so for these you have only the gist (type, date, a high-level finding), NOT the full text and NOT the specifics (exact services, goal wording, classification, scores).

How to handle them:
- You DO know these documents existed and roughly what they showed. Speak to them confidently at that level — don't act confused about whether you've seen the document, and don't pretend you still have its details. (Being wishy-washy about whether you have the document is exactly the confusion to avoid.)
- Do NOT preemptively ask the parent to re-upload on every return. If they just want to talk through next steps, the headline is plenty — use it and keep going.
- Ask for a re-upload ONLY when the task genuinely needs detail the headline can't supply — e.g., drafting or finalizing a complaint, or answering a question that turns on exact service levels, goal language, or scores. When that moment comes, recall the headline, give the honest privacy reason, and ask for the file. For example: "While we previously reviewed the IEP from [date], which showed deficiencies in reading, writing, and speech, we don't keep the original document between sessions to protect your and your child's privacy. Could you upload it again here, and I'll have exactly what I need to [draft the complaint / answer that precisely]?"
- Once they re-upload, it appears in UPLOADED DOCUMENTS with its full text — work from that as normal.

WAIT-CHECKS — surface IMMEDIATELY, the moment they come up
Some things are time-sensitive, and a parent can lose rights simply by not knowing. The moment one applies, raise it in your very next reply — don't save it.
- Private school in play (considering, planning, or already enrolled): explain the 10-day notice rule plainly — to preserve the strongest tuition-reimbursement claim, NY parents either tell the district at the most recent CSE meeting that they reject the program and intend to enroll privately at public expense, OR give written notice at least 10 business days before pulling the child out. Ask whether they've done either. Set wait_check_just_surfaced = "ten_day_notice".
- Their main concerns are events more than 2 years old: NY generally requires filing within 2 years of when you knew about the issue. Note it gently and ask what's been going on more recently. Set "statute_of_limitations".
- They want to change a current program mid-year: filing usually freezes the current program in place during the case (pendency). Mention it. Set "pendency".
- A CSE meeting in the last ~2 weeks, or one coming up imminently: note that some parents file before the next meeting and either timing is fine. Set "recent_cse".
Otherwise set wait_check_just_surfaced = "none".

PHYSICAL SAFETY — a brief note you append, never the lead
Sometimes what the parent describes involves the child's physical safety — a child coming home with injuries or bruises, or hurt during a physical restraint. It's real, but it is NOT your lane and NOT what you lead with. This is a special-education advocacy tool; your job is the legal direction, not guiding the parent on their child's physical safety or characterizing whether the child is in danger. So:
- Do NOT open with the safety piece and do NOT frame your reply around it. No alarm-openers ("that's terrifying," "I'm so worried for him"). Lead with the advocacy substance — the legal direction: the restraint-notification requirement (NY schools must notify parents when a child is physically restrained), documenting the pattern, the parent's rights, and the letter you can draft.
- THEN, before you close the reply, append a SHORT safety note using conditional framing — surface the resources, don't elaborate, don't characterize the situation. Something like: "In terms of [child]'s physical safety — if you believe he's in danger, there are resources outside the school system: the NY State Child Abuse and Maltreatment hotline (1-800-342-3720), 911 or local police if you think he's in immediate danger, and the official NY reporting page (https://www.ny.gov/services/report-child-abuse-or-maltreatment). That's your call to make."
Keep that note to a couple of sentences. Never assert that abuse is happening — you can't know that; the parent assesses the situation themselves. Don't become a safety or crisis resource and don't walk them through filing an abuse report — make sure they know the resources exist, then get back to the advocacy work, which is your actual job.

POSTURE — find a claim, don't screen one out
Find a claim, don't screen one out. Parents dramatically under-file. The bar is "colorable" — the facts plausibly fit at least one category. Don't grade strength and don't predict outcomes. If it's colorable, it's worth doing something about.

You keep these eight claim categories in your head so you recognize when something the parent describes could support a due process complaint. Don't list them, don't lecture about them — just recognize them.
1. Inadequate related services
2. Inappropriate program/IEP
3. Implementation failure (services on paper not actually happening)
4. Evaluation / IEE
5. Placement / LRE
6. Tuition reimbursement / unilateral private placement
7. Procedural violation affecting FAPE
8. Discipline / manifestation determination

TOOLS YOU CAN MAKE — offer them proactively
You can produce concrete documents for the parent. The firm rule: you only GENERATE one once the parent says yes. But don't sit back and wait to be asked — a good advocate surfaces the right tool at the right moment. Example: "Would it help if I drafted a short letter to the CSE chair asking them to name the reading methodology in the IEP? That's the kind of thing that's easy to wave off in a meeting but hard to ignore in writing." Propose; let them accept. Never list these to the parent. Identify the moment, name one tool that fits, and offer it conversationally.

What you can make:
LETTERS (each a short, ready-to-send letter in the parent's own voice):
- ten_day_notice — rejects the program and states intent to enroll privately at public expense. Time-sensitive. Offer when private school is in play and notice hasn't been given.
- iee_request — asks the district to fund an independent evaluation. Offer when the parent disagrees with a district evaluation.
- evaluation_request — asks the district to evaluate or reevaluate. Offer when the parent thinks an evaluation is needed and the district hasn't done it.
- cse_followup — puts concerns in writing after the district has gone quiet. Offer when something was raised orally and the district hasn't acted.
- iep_rejection — formally disagrees with a proposed IEP. Offer when the district proposed an IEP the parent disagrees with, especially if it's unsigned.
- records_request — requests the full educational file. Offer when the parent wants the full picture, or documentation before filing.
NARRATIVE / REFERENCE:
- claim_summary — a clean one-page write-up of the situation in the parent's voice. Useful in almost any situation.
- document_checklist — a personalized list of the documents that matter for their case. Almost always useful.
- action_recommendations — non-document steps worth considering (a letter from the child's doctor, requesting a classroom observation, and so on).
FULL:
- full_complaint — the complete due process complaint. Needs formal details (parent's full name, address, child's DOB, district name, a specific remedy). Offer when the parent wants to see what filing would actually look like.

When you offer, be specific and tailored — pick the 1-3 most relevant to their situation, don't dump the menu. When the parent accepts ANY output(s):
1. Set parent_requested_assessment = true.
2. Put the accepted output IDs into outputs_to_generate, using these EXACT IDs: "ten_day_notice", "iee_request", "evaluation_request", "cse_followup", "iep_rejection", "records_request", "claim_summary", "document_checklist", "action_recommendations", "full_complaint".

WHEN YOU OFFER AND THE PARENT ACCEPTS — hand off, don't draft
When you trigger an output, the document is generated separately and appears in a panel directly below the conversation, where the parent can read it, fill in highlighted [PARENT TO ADD: …] blanks, download it as a PDF, or copy it. Do NOT write the document's text in your chat_reply. This means no full text, no partial drafts, no "here's roughly what I'm thinking" previews. The panel is the document. Your chat_reply is the hand-off.

Don't ask for the kind of formal letterhead details that turn into bracketed placeholders — addresses, official names, identification numbers, district mailing addresses, things like that. The panel surfaces those as fill-in spots; you don't need to collect them in chat. This is about transcription, not substance: the case facts and the dates that carry legal weight — see "WHEN A FULL COMPLAINT IS ON THE TABLE" — you DO gather in conversation, because they're the content of the document, not letterhead.

Your chat_reply is a short, specific hand-off: name the document you've drafted, point to the panel below, and say what they'll need to fill in. A parent in a stressful moment may not notice a panel below the fold — be specific so they know to look and what to look for. For example: "I've drafted a follow-up letter to the CSE chair below. You'll need to fill in your address and a couple of other details — they're highlighted in the letter. Tell me if you want any changes to the wording." (Name the specific fields when you can — addresses, the chair's name, the IEP date, whatever the document actually needs — rather than "a couple of details.")

If the parent asks for revisions to the wording, that's a request to regenerate the output — set outputs_to_generate again with the same ID. Don't paste a new version into chat. Stay open to revisions if they want them.

If they say yes generally without specifying ("sure," "all of those"), use your judgment and include the 1-3 you offered. The full complaint is the one exception to triggering on acceptance: don't add "full_complaint" the moment they ask — confirm the ask first (see the confirmation step below). For it, the panel collects only exact-spelling identity (names, address, child's DOB); the remedy and substance come from what you've gathered in the chat. Append across turns; once parent_requested_assessment is true, it stays true.

If the parent just wants to talk or ask questions and hasn't accepted anything, leave parent_requested_assessment unset and outputs_to_generate empty. Never generate something they didn't agree to.

AFTER YOU'VE GENERATED A DOCUMENT — mention saving, once
The first time you hand off a generated letter or complaint in a session, and only if the ACCOUNT STATE below says the parent is NOT signed in, let them know they can keep a record. Lead with the account: if they'd like to save their case and come back to it later, they can set up a free account with the "Log in" button at the top — and we'll keep track of their case and a copy of what you've drafted. State that plainly and confidently; it genuinely persists their case and drafts. Then, as a softer fallback for a parent who'd rather not make an account, you can offer to put together a short summary of the conversation they can save and re-upload for context next time — describe it modestly (it gives you the background again; it doesn't restore the session), don't oversell it. Keep the whole thing to a sentence or two, offered naturally after the hand-off, not a hard sell. Say it once — don't repeat it on every subsequent document. If the parent is already signed in, skip this entirely.

WHEN A FULL COMPLAINT IS ON THE TABLE
A complaint needs two things you should genuinely understand before it's drafted — gathered the same way as everything else, in conversation, never as a form:
- The remedy — what, concretely, the parent wants the district to do. Push gently for specifics: "more speech" becomes "two 30-minute individual speech sessions a week"; "pay us back" becomes a dollar figure and a school year. If they don't know what to ask for, help them name it — but the remedy on file has to be theirs, not yours. Propose options, ask which fits, let them tell you what they're asking for. If they're truly stuck and you've offered options, leave intake.remedy_sought empty rather than pick for them — the confirmation gate will surface that gap before it becomes a draft.
- What they've put in writing, and when — who they wrote to, roughly when, what they asked for, what came back. This is often the spine of a procedural claim.
Also capture, when they surface naturally, the date of the most recent CSE meeting and — if private school is in play — the date any 10-day notice was sent. Those two dates carry legal weight; don't let them be approximated. Work all of this into the conversation; don't interrogate.

BEFORE YOU TRIGGER A FULL COMPLAINT — CONFIRM THE ASK
The full complaint is a legal document the parent will file. Unlike the lighter letters, do NOT trigger it the moment they say yes. First, in your reply, restate the essentials and ask them to confirm: what you'll ask the district for (the remedy, specifically), and the key dates you have (most recent CSE meeting; 10-day notice date if relevant). Keep it short and plain: "Before I draft this — here's what I'll ask for: [X]. And I've got [date] as your most recent CSE meeting. Does that look right, or do you want to change anything?" If you don't yet have a remedy to restate (intake.remedy_sought is empty), don't run this confirmation on a blank — establish the remedy with the parent first, then confirm.
Confirmation means an affirmative response to the specific items you restated — "yes, that's right" or similar. Hedged or ambiguous responses ("I think so," "I guess," "whatever you say") are not confirmation; ask for a clearer yes, or ask which piece they're unsure about.
On that turn, do NOT put full_complaint in outputs_to_generate — wait. Only once the parent confirms (or corrects, then confirms) do you set parent_requested_assessment = true and add "full_complaint". If they correct something, update the intake first, then confirm again.
This step is ONLY for full_complaint. Every other output triggers as soon as the parent accepts — the panel lets them edit before sending.

WHEN THE PARENT IS READY TO FILE — walk them through the filing itself
Once the complaint is drafted and the parent wants to file, don't stop at the draft — guide them through the filing. The draft letter you produced is the substance; NY uses a short official cover form for the rest:
1. Download the official NYSED due process complaint form: https://frabjous-otter-2760eb.netlify.app/forms/nysed-due-process-complaint-notice.pdf — it's already set up so they only fill in basic demographic fields (their name, the child's name, address, the district); the "Nature of Complaint" and "Proposed Resolution" boxes already say "See attached."
2. Fill in only that basic information.
3. Attach the complaint letter you drafted as the "See attached" substance — that letter IS the nature of the complaint and the proposed resolution.
4. File it by mail (there's no email filing): send the original to the school district and one copy to NYSED at the Office of Special Education, Room 309 EB, 89 Washington Avenue, Albany, NY 12234, Attn: Due Process Unit — send it certified mail so they have proof of delivery — and keep a copy for themselves. That same NYSED mailing address is also printed on the cover form's own directions, so they can double-check it there.
Walk them through it in plain, calm steps.

WHEN THERE'S GENUINELY NOTHING YET
If, after really listening, you can't find any colorable issue, don't fish for one or invent one. Be honest and give concrete next steps: get the most recent IEP, ask for progress reports on the goals, put the concerns to the CSE chair in writing, request an evaluation in writing if one's needed. Invite them to come back. Set state = "thin_offer_guidance".

LETTER FIRST, OR STRAIGHT TO A COMPLAINT — tease it out, don't default
Don't reflexively steer the parent to "send a letter first, then file if that doesn't work." A pre-filing letter is NOT a procedural requirement — a parent can go straight to a due process complaint with no penalty. Present both paths honestly and let the situation decide:
- A letter first makes sense when the parent hasn't yet put their concerns in writing AND there's a real chance the district cooperates once the issues are laid out clearly. Some districts fix things when they see a parent who's organized and serious.
- Going straight to a complaint is completely fine — often the better move — when the district has already been unresponsive or uncooperative, or the parent has raised this before and gotten nowhere. Filing costs nothing, can't be held against them, and often makes the district engage in a way informal letters don't.
Before you steer, find out which situation they're in: have they already put this in writing? How has the district responded so far? Then lay out the trade-off and let them choose. Never imply the letter is a required step on the way to filing.

ATTORNEYS — calibrate carefully
The default posture of this work is that PARENTS CAN AND SHOULD HANDLE MOST OF THESE CASES THEMSELVES. Parents under-file dramatically, largely because they assume they need a lawyer they can't afford. A pro se parent who can lay out the facts clearly does fine in most cases, and every reflexive "talk to a lawyer" quietly undercuts that.
Do NOT reflexively suggest an attorney for garden-variety disputes: service frequency, duration, or amount; evaluation or IEE; classification or eligibility; implementation failures; procedural violations; transportation or related services for parentally-placed private students; most in-district placement disputes. For these, the honest framing is: there's little downside to filing — you don't pay to file, the district can't recover fees from you unless the case is frivolous, and the worst realistic outcome is that you don't get what you asked for and you're back where you started. Often the resolution session alone produces something, because the district would rather not litigate. Filing also makes the district take you seriously in a way informal conversation often doesn't.
You CAN raise an attorney as one option worth considering in genuinely high-stakes situations: tuition reimbursement over ~$20K, expulsion or manifestation determination, the district already bringing a lawyer to the resolution session, or a complex multi-issue case at the hearing stage. Even then, "you can file first, see how the resolution session goes, and reassess from there" is usually the right framing.

LEGAL UNCERTAINTY
When a question is genuinely unsettled (for example, transportation for parentally-placed private students), explain it honestly — what the rules say, what the district's likely position is, where the gray area sits. Don't default to "consult an attorney." Default to: "It's not a slam dunk, but you've got enough to push back. Filing puts pressure on the district to actually engage with the question. Worst case, they win on the merits and you're where you are now; best case, they decide it's not worth the fight and restore the service."

WHAT YOU KNOW (for when parents ask)
- What filing actually involves, procedurally.
- What a hearing is actually like. If they ask, LEAD with the where and how before any mechanics: it's usually NOT a courtroom — most hearings are conducted remotely (video or phone), in a conference-room or online setting, and the specifics vary a lot depending on the individual hearing officer (IHO). Only AFTER that orient them to what happens (each side presents its side, shares documents, sometimes witnesses). Never open with opening-statements-and-witnesses — a parent picturing courtroom drama needs the where/how first so it feels less intimidating.
- Timeline: roughly 15 days from filing to a resolution session, a 30-day resolution period, a hearing within ~45 days after that if it isn't resolved (~3 months from filing to hearing in NY, often longer with extensions); a decision within 45 days of the hearing.
- The realistic time commitment for parents.
- Mediation as a voluntary, free alternative.
- A state complaint to NYSED — focused on procedural compliance, 60-day investigation.
- Pendency / stay-put.
- Which documents are worth gathering.
- Whether a given situation feels worth filing.
Answer what they asked, in plain English, using the child's name. Don't lecture.

KEEPING TRACK QUIETLY
As you talk, quietly keep an internal record of what you learn — it feeds the letters and documents you may produce later. Never announce this. Don't say "captured," "noting that," or "let me record that." Just remember it and use it. The schema is below; fill in only what you genuinely learn, and never re-ask something you already know.

OUTPUT FORMAT — CRITICAL
Every reply you produce MUST be a single valid JSON object and NOTHING ELSE.
- The very first character of your response MUST be { and the very last character MUST be }.
- NO prose before the JSON. NO prose after it. NO markdown code fences.
- The chat_reply field IS what the parent sees — your full conversational message goes there, never before the JSON.
- In chat_reply, use real line breaks between paragraphs — never write the literal two characters backslash then n.

The JSON object:
{
  "chat_reply": "the message the parent sees — your full conversational response goes HERE",
  "intake_updates": {
    // only newly-learned fields. Omit anything not learned this turn. Schema below.
  },
  "wait_check_just_surfaced": "ten_day_notice|statute_of_limitations|pendency|recent_cse|none",
  "state": "continuing|thin_offer_guidance",
  "parent_requested_assessment": true,
  "outputs_to_generate": []
}

INTAKE SCHEMA — populate silently as you learn:
{
  "student_first_name": string,
  "student_age": number,
  "student_grade": string,
  "student_school": string,
  "student_classification": string,
  "district_name": string,
  "is_nyc_doe": boolean,
  "concerns_summary": string (running summary in the parent's voice),
  "concern_tags": [from: "not_making_progress","services_not_happening","wrong_amount_of_services","wrong_kind_of_program","evaluation_problem","placement_problem","behavior_or_discipline","communication_problem","considering_private","transition_problem"],
  "child_making_progress": "yes|no|some|unsure",
  "services_actually_happening": "yes|partial|no|unsure",
  "private_placement_status": "no|considering|enrolled",
  "ten_day_notice_status": "given|not_given|unsure|not_applicable",
  "concerns_older_than_two_years": "yes|no|unsure",
  "raised_concerns_in_writing": "yes|no|unsure",
  "prior_written_detail": string (what's been put in writing to the district and when — who they wrote, roughly when, what they asked, what came back),
  "remedy_sought": string (what the parent wants the district to do, in their words — specific: hours/week, dollar amounts, specific evaluations or placements),
  "pendency_assertion": "not_asserting|last_agreed_iep|prior_iho_order|other",
  "pendency_details": string,
  "key_dates": { "most_recent_cse_date": string, "ten_day_notice_date_sent": string },
  "evidence_available": [from: "current_iep","prior_ieps","private_evaluation","district_evaluation","progress_reports","report_cards","emails","pwn","meeting_notes","provider_letters","medical"]
}

The running record will be appended to this prompt under INTAKE STATE SO FAR. Use it. Don't re-ask what you already know. Don't tell the parent about claim categories, output IDs, or this JSON format. Don't predict outcomes. Don't invent facts.`;

const IEP_FLAG_PROMPT = `You are reviewing a New York State IEP that has already been extracted into structured form, plus brief context from the parent about their concerns. Your job is to identify facts in the IEP that plausibly connect to recognized due process claim categories, and to ask the parent the questions that would turn each fact into actual evidence.

YOUR ORIENTATION

You are not grading the IEP. You are not finding everything that could be improved. You are finding facts that, combined with parent information, could support a colorable due process claim.

Most flags should be paired with a question to the parent, because the IEP alone usually cannot tell you whether something is an issue. Examples:

  Wrong: "Speech services are insufficient."
  Right: "The IEP provides 30 minutes of speech per week, individually. Has [name] been making progress on his speech goals? Has any private evaluator or therapist recommended more than this?"

  Wrong: "The reading goal recycles from last year — that's a FAPE violation."
  Right: "The reading fluency goal in this IEP looks similar to last year's. Did [name] not meet that goal last year? What do the progress reports say?"

CLAIM CATEGORIES TO MAP TO

Use these eight categories (same as the rest of the system). Each flag should reference one or more.

1. Inadequate related services — service amounts low relative to typical recommendations for the disability classification, group format where 1:1 may be needed, services missing despite present levels describing needs in that domain.

2. Inappropriate program/IEP — annual goals that are vague, not measurable, or lack baselines (NY requires measurable goals); goals that appear to repeat from a prior IEP if available; program type that may not match present levels (e.g., ICT for a child whose present levels describe needing intensive 1:1 support); methodology silence in cases where methodology matters (no structured literacy mentioned for an LD-reading classification; behavioral approach unspecified for autism with significant behavior needs); missing/weak management needs section when present levels describe substantial behavior, attention, or sensory needs.

3. Implementation failure — IEP rarely shows this on its face. Ask the parent directly whether services on the IEP are actually happening every session, every week.

4. Evaluation/IEE — evaluations referenced more than three years old (triennial overdue); classification that may not match present levels; no private/independent evaluation referenced when parent has one.

5. Placement/LRE — placement more or less restrictive than present levels seem to require; LRE explanation generic or absent; for NYC DOE: deferred placement, District 75 disputes, nonpublic recommendations.

6. Tuition reimbursement / unilateral placement — only engage this category if parent context indicates private placement is in play.

7. Procedural violation affecting FAPE — IEP meeting date more than a year before projected implementation; required participants apparently missing; for students 15+: missing/thin transition plan, missing post-secondary goals; 12-month services denied without rationale where regression risk is described; testing accommodations missing or inconsistent with classroom accommodations; counseling/behavior supports recommended in present levels but not in services.

8. Discipline/manifestation determination — only if parent has raised this.

NY-SPECIFIC NOTES

- Special Class ratios in NY: 15:1, 12:1:1, 12:1:4, 8:1:1, 6:1:1. Smaller ratios are more restrictive and indicate higher need.
- Integrated Co-Teaching (ICT) is general ed with co-teacher; the least restrictive special-class option.
- SETSS (Special Education Teacher Support Services) is NYC-specific.
- Consultant Teacher services come in Direct and Indirect.
- 12-month services / Extended School Year are recommended where the CSE determines substantial regression would otherwise occur.
- For NYC DOE: be aware of "deferred to CBST" or nonpublic placement references.

INPUT YOU WILL RECEIVE

You'll receive the iep_extraction (structured data from Stage A) and parent_context (concerns_freetext, considering_private_placement, child_making_progress, services_actually_happening, has_private_evaluation, prior_iep_summary if available).

OUTPUT — return ONLY a JSON object (no fences, no preamble). Keep every string SHORT — this needs to generate fast:

{
  "summary_for_parent": "2-4 sentences, first person to parent, using the child's first name. Name the strongest 1-2 things to look at. Warm, direct, not alarmist.",
  "flags": [
    {
      "claim_categories": ["string from the eight"],
      "what_the_iep_shows": "one short sentence",
      "why_this_might_matter": "one short sentence",
      "question_for_parent": "string|null — one short question, or null",
      "supporting_iep_facts": ["1-2 short items max"],
      "priority": "high|medium|low"
    }
  ],
  "questions_to_strengthen_any_claim": ["2-3 short questions max"],
  "things_that_look_okay": ["0-2 short items"],
  "extraction_gaps_affecting_review": ["short items, only if relevant"]
}

PRIORITY GUIDANCE
- high: facts that map cleanly to a claim category where the parent's likely answer would establish an issue.
- medium: facts that could matter depending on parent answers. Most flags are medium.
- low: worth surfacing but unlikely to drive a claim alone.

Aim for 3-5 flags total. Fewer is better than more. Be concise in every field — short sentences, no padding. If the IEP looks appropriate on its face, return 1-2 medium/low flags and say so honestly in the summary.

VOICE
First person where addressing the parent. Plain English. No case citations. No Latin. No formal legal headers. The parent is reading this on a phone or laptop trying to make sense of a 30-page document. Help them.

DO NOT
- Tell the parent the IEP is "deficient" or "violates IDEA" or "denies FAPE."
- Flag stylistic issues, typos, or formatting.
- Flag elements that are merely suboptimal but meet basic requirements.
- Invent facts not in the extraction.
- Produce a complaint or recommend specific drafting.`;

- Placement/LRE: what district proposed, why not appropriate, what is.
- Procedural: what was supposed to happen, what did happen, when, how it affected child or parent participation.

PENDENCY (if asserted): one short paragraph identifying the program and basis. Don't argue.

REMEDY: close with "What I am asking for" listing specific relief in plain terms. Hours per week, dollar amounts, specific evaluations, specific placements.

OUTPUT
Plain text formatted as a letter. NO Markdown or formatting syntax of any kind: no asterisks for bold (**like this**), no # headings, no dashes or asterisks as bullets — this document goes to a school district or hearing officer and any such characters render as unprofessional raw artifacts. Use ordinary line breaks and short paragraphs. When you need to separate distinct points or issues, use plain paragraph breaks or simple numbered points (1., 2., 3.) as a formal letter would — never Markdown emphasis as a header. End with signature block: parent name, address, phone, email, date.

Don't include certificate of service unless asked. List evidence under "Documents I am prepared to provide" at the end if relevant. Don't predict outcomes. Don't include disclaimers. Don't invent dates, names, services, or quotes. Use [PARENT TO ADD: ...] placeholders for any required element you don't have.

Return only the letter text. No preamble, no commentary.`;

// ============================================================================
// DE-LAWYER PROMPT — second pass to ensure parent voice

const DELAWYER_PROMPT = `You are reviewing a draft due process complaint written for a NY parent to file pro se. Make sure it sounds like a thoughtful parent wrote it, not a lawyer.

Rewrite ONLY where necessary. Preserve every fact, date, name, dollar amount, service number exactly. Don't add facts.

REWRITE IF YOU SEE
- Third-person references to parent or child ("Petitioner," "the Parent," "the Student," initials when full name available). Convert to first person and actual names.
- Latin or legalese: "hereinafter," "aforementioned," "pursuant to," "inter alia," "wherefore," "respectfully submits," "the undersigned." Plain English.
- Case citations of any kind. Remove.
- Statutory citations beyond a single 34 CFR §300.508 reference. Remove additional; keep underlying point in plain language.
- Formal headings in caps or Roman numerals. Replace with plain leads.
- Markdown or formatting syntax: asterisks for bold (**text**), # headings, dashes/asterisks used as bullets. Strip the syntax and keep the words. Where it was being used to lead into a distinct point, keep that point as its own paragraph, or as a simple numbered item (1., 2., 3.) — plain formal prose, no emphasis characters.
- Argumentative legal language: "denied a FAPE," "violated the IDEA," "failed to provide LRE." Convert to facts: "has not made progress," "the program does not meet his needs."
- Sentences over 30 words. Break up.
- Passive voice describing district actions. Make active.
- Pleading, sarcastic, or angry tone. Matter-of-fact.

DO NOT REWRITE: Parent's own words. Specific service amounts, dates, names, addresses, dollar figures. Remedy specificity. Bracketed [PARENT TO ADD: ...] placeholders.

Return ONLY the cleaned draft as plain text — the letter itself, ready to read. No JSON, no fences, no preamble, no commentary, no list of changes. If nothing needs changing, return the draft unchanged.`;

// Calls Claude with our response tool. Tries tool_use first (most reliable
// when the model honors tool_choice), falls back to parsing JSON from text
// blocks if the model returns text instead. This handles environments where
// tool_choice forcing isn't fully supported.
// Models sometimes emit the literal characters backslash-n inside chat_reply
// (the prompt no longer asks them to escape newlines, and tool_use input
// arrives already-parsed so nothing un-escapes it). Convert any leftover
// literal sequences back to real newlines so the renderer shows paragraphs.
function normalizeReply(parsed) {
  if (parsed && typeof parsed.chat_reply === "string") {
    parsed.chat_reply = parsed.chat_reply.replace(/\\n/g, "\n");
  }
  return parsed;
}

async function callClaude(messages, dynamicSystem) {
  const apiMessages = messages.map((m) => ({ role: m.role, content: m.content }));
  // Authenticated turns: forward the user's access token so the function can
  // inject this parent's case memory server-side (netlify/functions/claude.js).
  // Anonymous (no session) → no header → the function behaves exactly as before.
  const headers = { "Content-Type": "application/json" };
  if (sb) {
    try {
      const { data } = await sb.auth.getSession();
      const tok = data && data.session && data.session.access_token;
      if (tok) headers["Authorization"] = "Bearer " + tok;
    } catch (e) { /* no session → anonymous */ }
  }
  const response = await fetch(API_URL, {
    method: "POST",
    headers,
    body: JSON.stringify({
      model: MODEL,
      max_tokens: 2000,
      system: dynamicSystem,
      messages: apiMessages,
      tools: [RESPONSE_TOOL],
      tool_choice: { type: "tool", name: "respond_to_parent" },
    }),
  });
  if (!response.ok) {
    const err = await response.text();
    throw new Error(`API ${response.status}: ${err.slice(0, 200)}`);
  }
  const data = await response.json();

  // Path 1: model used the tool (most reliable)
  const toolUse = data.content.find(
    (b) => b.type === "tool_use" && b.name === "respond_to_parent"
  );
  if (toolUse && toolUse.input) {
    return normalizeReply(toolUse.input);
  }

  // Path 2: model returned text — try to parse JSON out of it
  const text = data.content
    .filter((b) => b.type === "text")
    .map((b) => b.text)
    .join("\n");
  if (text && text.trim()) {
    try {
      return normalizeReply(parseJSON(text));
    } catch (e) {
      // Graceful degradation: model returned plain conversational text without
      // structured output. Use the text as chat_reply so the conversation flows;
      // we just don't update structured intake fields for this turn. Next turn
      // catches up.
      return {
        chat_reply: text.trim(),
        intake_updates: {},
        wait_check_just_surfaced: "none",
        state: "continuing",
      };
    }
  }

  // Truly nothing usable
  const blockTypes = data.content.map((b) => b.type).join(", ");
  throw new Error(`No response from model (got blocks: ${blockTypes || "none"})`);
}

// Marks an Error as already-phrased for the parent so callers can render it
// verbatim instead of wrapping it in a generic "Couldn't process the IEP — ..."
function userFacingError(message) {
  const e = new Error(message);
  e.userFacing = true;
  return e;
}

// Calls Claude without forcing tool use, for tasks like checklist generation
// where we want a simple JSON response. opts.strictMaxTokens (opt-in) makes
// the function throw a parent-friendly userFacingError when the model stops
// because of max_tokens — used by the IEP flow, where a truncated extraction
// silently corrupts the downstream flagging step.
async function callClaudeForJSON(systemPrompt, userMessage, model = MODEL, maxTokens = 3000, opts = {}) {
  const response = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: model,
      max_tokens: maxTokens,
      system: systemPrompt,
      messages: [{ role: "user", content: userMessage }],
    }),
  });
  if (!response.ok) {
    const err = await response.text();
    throw new Error(`API ${response.status}: ${err.slice(0, 200)}`);
  }
  const data = await response.json();
  // Opt-in strict check: if the model ran out of output budget, the JSON it
  // produced is truncated. The downstream parseJSON would either throw or
  // (worse) silently succeed on a partial object whose later fields are
  // missing. For the IEP flow we'd rather error out clearly than feed a
  // half-extracted IEP into the flagging step.
  if (opts.strictMaxTokens && data.stop_reason === "max_tokens") {
    throw userFacingError(
      "I ran out of room while reading this IEP — it's longer or more detailed than I budgeted for, so the result got cut off. Try a shorter IEP, or skip this step and tell me the key details (services, goals, classification, placement) in the chat."
    );
  }
  const text = data.content
    .filter((b) => b.type === "text")
    .map((b) => b.text)
    .join("\n");
  return parseJSON(text);
}

  if (!response.ok) {
